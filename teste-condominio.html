<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN — Teste de Condomínio</title><style>body{font-family:Arial;margin:0;background:#f5f6f7;color:#102a3a}.wrap{max-width:800px;margin:40px auto;padding:20px}.card{background:white;padding:25px;border-radius:14px;box-shadow:0 4px 20px #0001}input{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}button{padding:13px 20px;background:#d3aa62;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}pre{white-space:pre-wrap;background:#111;color:#eee;padding:15px;border-radius:8px;overflow:auto}#status{margin:18px 0;padding:12px;background:#f0f2f4;border-radius:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🔎 Teste de Condomínio</h1><p>Teste direto no domínio da VSN.</p><div class="grid"><div><label>Endereço</label><input id="address" placeholder="Rua Vergueiro"></div><div><label>Número</label><input id="number" placeholder="1000"></div></div><div class="grid"><div><label>CEP</label><input id="cep" placeholder="04101-000"></div><div><label>Cidade</label><input id="city" value="São Paulo"></div></div><label>Estado</label><input id="state" value="SP"><button onclick="testar()">Identificar condomínio</button><div id="status">Aguardando...</div><div id="out"></div></div></div><script>async function testar(){const d={address:address.value.trim(),number:number.value.trim(),cep:cep.value.trim(),city:city.value.trim(),state:state.value.trim()};if(!d.address||!d.number){status.innerHTML='Informe endereço e número.';return}status.innerHTML='🔎 Pesquisando...';out.innerHTML='';const t=performance.now();try{const q=new URLSearchParams(d);const r=await fetch('/api/identify-condo.js?'+q);const raw=await r.text();status.innerHTML='HTTP '+r.status+' · '+((performance.now()-t)/1000).toFixed(2)+'s';out.innerHTML='<pre>'+esc(raw)+'</pre>'}catch(e){status.innerHTML='❌ '+esc(e.message);out.innerHTML='<pre>'+esc(e.stack||e)+'</pre>'}}function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}</script></body></html>
