<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel VSN Imóveis</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18212b;font-family:Inter,Arial,sans-serif}.top{background:#171d24;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.brand span{color:#ed1c24}.top a{color:#fff;text-decoration:none;font-size:13px}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.head h1{margin:0;font-size:30px}.head p{margin:6px 0 0;color:#68737d}.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:800;cursor:pointer}.red{background:#d71920;color:#fff}.light{background:#fff;border:1px solid #ddd}.panel{background:#fff;border:1px solid #e4e7ea;border-radius:14px;padding:24px;box-shadow:0 5px 25px #00000008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e4e7ea;border-radius:12px;padding:20px}.stat b{display:block;font-size:28px}.stat span{color:#68737d;font-size:13px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid #eee;font-size:13px}.table th{color:#68737d}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#e8f6ed;color:#168247;font-weight:800;font-size:11px}.badge.off{background:#f0f1f2;color:#68737d}.actions button{margin-right:6px;padding:7px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#071018cc;z-index:20;padding:20px;overflow:auto;align-items:center;justify-content:center}.modal.open{display:flex}.box{background:#fff;width:min(760px,100%);border-radius:15px;padding:28px}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe3e7;border-radius:7px;font:inherit}.field textarea{min-height:110px;resize:vertical}.checks{display:flex;gap:20px;margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.empty{text-align:center;padding:45px;color:#68737d}@media(max-width:700px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.table{min-width:700px}.panel{overflow:auto}}
</style></head><body><header class="top"><div class="brand">VSN <span>IMÓVEIS</span></div><a href="/">← Voltar para o site</a></header><main class="wrap"><div class="head"><div><h1>Painel de imóveis</h1><p>Cadastre, edite e controle os imóveis publicados pela VSN.</p></div><button class="btn red" onclick="openNew()">+ Novo imóvel</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total de imóveis</span></div><div class="stat"><b id="active">0</b><span>Publicados</span></div><div class="stat"><b id="inactive">0</b><span>Desativados</span></div></div><section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar por título, bairro ou código" oninput="render()"><select id="filter" onchange="render()"><option value="all">Todos</option><option value="active">Publicados</option><option value="inactive">Desativados</option></select></div><div id="list"></div></section></main><div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Novo imóvel</h2><form id="form"><input type="hidden" name="id"><div class="grid"><div class="field"><label>Título</label><input name="title" required placeholder="Apartamento 3 dormitórios no Morumbi"></div><div class="field"><label>Código do imóvel</label><input name="code" placeholder="VSN-001"></div><div class="field"><label>Finalidade</label><select name="purpose"><option>Venda</option><option>Locação</option></select></div><div class="field"><label>Preço</label><input name="price" required placeholder="R$ 650.000"></div><div class="field"><label>Bairro / região</label><input name="location" required placeholder="Morumbi · São Paulo"></div><div class="field"><label>Área (m²)</label><input name="area" type="number" placeholder="82"></div><div class="field"><label>Dormitórios</label><input name="beds" type="number" placeholder="3"></div><div class="field"><label>Suítes</label><input name="suites" type="number" placeholder="1"></div><div class="field"><label>Vagas</label><input name="parking" type="number" placeholder="2"></div><div class="field"><label>Foto principal (URL)</label><input name="image" placeholder="https://..."></div><div class="field full"><label>Fotos adicionais (uma URL por linha)</label><textarea name="images" placeholder="https://...&#10;https://..."></textarea></div><div class="field full"><label>Descrição</label><textarea name="description" placeholder="Descreva o imóvel, diferenciais, condomínio e localização."></textarea></div></div><div class="checks"><label><input type="checkbox" name="featured"> Destacar no site</label><label><input type="checkbox" name="active" checked> Publicar imediatamente</label></div><div class="modal-actions"><button type="button" class="btn light" onclick="closeModal()">Cancelar</button><button class="btn red">Salvar imóvel</button></div></form></div></div><script>const KEY='vsn_imoveis_admin_v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(items))}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let arr=items.filter(x=>(f==='all'||(f==='active'?x.active:!x.active))&&(!q||[x.title,x.location,x.code].join(' ').toLowerCase().includes(q)));$('total').textContent=items.length;$('active').textContent=items.filter(x=>x.active).length;$('inactive').textContent=items.filter(x=>!x.active).length;if(!arr.length){$('list').innerHTML='<div class="empty">Nenhum imóvel encontrado.<br><br><button class="btn red" onclick="openNew()">Cadastrar primeiro imóvel</button></div>';return}$('list').innerHTML='<table class="table"><thead><tr><th>Imóvel</th><th>Finalidade</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+arr.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small>${esc(x.location)} ${x.code?'· '+esc(x.code):''}</small></td><td>${esc(x.purpose)}</td><td><b>${esc(x.price)}</b></td><td><span class="badge ${x.active?'':'off'}">${x.active?'PUBLICADO':'DESATIVADO'}</span></td><td class="actions"><button onclick="edit('${x.id}')">Editar</button><button onclick="toggle('${x.id}')">${x.active?'Desativar':'Publicar'}</button><button onclick="removeItem('${x.id}')">Excluir</button></td></tr>`).join('')+'</tbody></table>'}function openNew(){ $('form').reset();$('form').id.value='';$('form').active.checked=true;$('modalTitle').textContent='Novo imóvel';$('modal').classList.add('open')}function edit(id){let x=items.find(i=>i.id===id);if(!x)return;let f=$('form');Object.keys(x).forEach(k=>{let el=f.elements[k];if(!el)return;if(el.type==='checkbox')el.checked=!!x[k];else if(k==='images')el.value=(x[k]||[]).join('\n');else el.value=x[k]??''});f.id.value=x.id;$('modalTitle').textContent='Editar imóvel';$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}$('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id=f.get('id')||Date.now().toString();let x={id,title:f.get('title'),code:f.get('code'),purpose:f.get('purpose'),price:f.get('price'),location:f.get('location'),area:f.get('area'),beds:f.get('beds'),suites:f.get('suites'),parking:f.get('parking'),image:f.get('image'),images:String(f.get('images')||'').split('\n').map(s=>s.trim()).filter(Boolean),description:f.get('description'),featured:f.get('featured')==='on',active:f.get('active')==='on'};let idx=items.findIndex(i=>i.id===id);if(idx>=0)items[idx]=x;else items.unshift(x);save();closeModal();render()};function toggle(id){let x=items.find(i=>i.id===id);if(x){x.active=!x.active;save();render()}}function removeItem(id){if(confirm('Excluir este imóvel?')){items=items.filter(x=>x.id!==id);save();render()}}render();</script></body></html>
