name: Use Vinicius VSN SVG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-vinicius-vsn-svg.yml'

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update founder image
        run: |
          sed -i 's#/vinicius-corrigido.jpg#/vinicius-vsn.svg#g' index.html
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/use-vinicius-vsn-svg.yml
          git commit -m "Carrega vinicius-vsn.svg na Home"
          git push
