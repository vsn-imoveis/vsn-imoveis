name: Fix founder JPG display
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar exibição do JPG original
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          pattern = r'\.founder-photo\{[^}]*\}'
          new = '.founder-photo{display:block;width:432px;max-width:100%;height:auto;justify-self:end;object-fit:contain;object-position:center center;border-radius:16px;box-shadow:0 18px 45px rgba(11,41,64,.14)}'
          s2, n = re.subn(pattern, new, s, count=1)
          if n != 1:
              raise SystemExit('CSS da foto não encontrado')
          p.write_text(s2)
          PY
      - name: Commit e remover workflow
        run: |
          git config user.name "vsn-imoveis"
          git config user.email "vsnimoveis@gmail.com"
          git add index.html
          git commit -m "Ajusta exibição da foto JPG original"
          git rm .github/workflows/fix-founder-jpg-display.yml
          git commit -m "Remove workflow temporário"
          git push
