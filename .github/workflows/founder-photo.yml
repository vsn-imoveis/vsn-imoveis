name: Ajuste foto do fundador
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar proporção e espaçamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.founder-inner{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:1fr .72fr;gap:70px;align-items:center}', '.founder-inner{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:1fr .68fr;gap:82px;align-items:center}')
          s=s.replace('.founder-photo{width:100%;max-width:460px;height:390px;justify-self:end;object-fit:cover;object-position:center 20%;', '.founder-photo{width:100%;max-width:430px;height:420px;justify-self:end;object-fit:cover;object-position:center 18%;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remover workflow e publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/founder-photo.yml
          git add index.html .github/workflows/founder-photo.yml
          git diff --cached --quiet || git commit -m "style: ajustar foto do fundador"
          git push
