name: Run construction year lookup

on:
  workflow_dispatch:

jobs:
  lookup-construction-years:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute construction year search batch
        env:
          SUPABASE_FUNCTION_URL: https://jpdfynaioepcmgqlqlht.supabase.co/functions/v1/condo-construction-year-copy
          FUNCTION_TOKEN: ${{ secrets.CONDO_CONSTRUCTION_YEAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FUNCTION_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CONDO_CONSTRUCTION_YEAR_TOKEN"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 600 \
            "${SUPABASE_FUNCTION_URL}?token=${FUNCTION_TOKEN}"
          echo