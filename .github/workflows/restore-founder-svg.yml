name: Restore founder SVG
on:
  push:
    paths:
      - '.github/workflows/restore-founder-svg.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore original SVG
        run: |
          sed -i 's#/vinicius-vsn.jpg#/vinicius-vsn.svg#g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restaura SVG original da foto do fundador' || true
          git rm .github/workflows/restore-founder-svg.yml
          git commit -m 'Remove workflow temporário' || true
          git push
