name: Sync property SEO pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static property pages
        run: node scripts/generate-property-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "VSN Imóveis Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imovel/
          if git diff --cached --quiet; then
            echo "No property page changes."
          else
            git commit -m "Sync property SEO pages"
            git push
          fi
