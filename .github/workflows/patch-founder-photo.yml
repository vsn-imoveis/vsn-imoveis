name: Atualizar foto do fundador
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar foto e ajustar enquadramento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="/vinicius-vsn.svg"','src="/vinicius-corrigido.jpg"')
          s=s.replace('object-position:center 18%','object-position:center center')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-founder-photo.yml
          git add index.html .github/workflows/patch-founder-photo.yml
          git diff --cached --quiet || git commit -m "style: corrigir foto do fundador"
          git push
