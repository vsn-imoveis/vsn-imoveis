name: Fix founder photo display

on:
  push:
    paths:
      - '.github/workflows/fix-founder-photo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust photo size without editing image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          old = r'\.founder-photo\{[^}]*\}'
          new = '.founder-photo{display:block;width:390px;max-width:100%;height:auto;justify-self:end;object-fit:initial;object-position:center center;border-radius:16px;box-shadow:0 18px 45px rgba(11,41,64,.14)}'
          s2, n = re.subn(old, new, s, count=1)
          if n != 1:
              raise SystemExit('CSS da foto não encontrado')
          p.write_text(s2)
          PY
          git config user.name "vsn-imoveis"
          git config user.email "vsnimoveis@gmail.com"
          git add index.html
          git commit -m "Ajusta tamanho da foto original" || true
          git push
