name: Fix Vinicius photo proportion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar CSS da foto
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.founder-photo{width:100%;max-width:430px;height:420px;justify-self:end;object-fit:cover;object-position:center center;'
          new='.founder-photo{width:100%;max-width:432px;height:auto;justify-self:end;object-fit:contain;object-position:center center;'
          if old not in s:
              raise SystemExit('CSS desktop da foto não encontrado')
          s=s.replace(old,new,1)
          old2='.founder-photo{height:360px;max-width:none}'
          new2='.founder-photo{height:auto;max-width:432px;width:100%;justify-self:center}'
          if old2 not in s:
              raise SystemExit('CSS mobile da foto não encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Publicar alteração
        run: |
          git config user.name "vsn-imoveis"
          git config user.email "vsnimoveis@gmail.com"
          git add index.html
          git commit -m "Corrige proporção da foto do Vinicius" || exit 0
          git push
      - name: Remover workflow temporário
        if: success()
        run: |
          rm .github/workflows/fix-vinicius-photo-proportion.yml
          git config user.name "vsn-imoveis"
          git config user.email "vsnimoveis@gmail.com"
          git add .github/workflows/fix-vinicius-photo-proportion.yml
          git commit -m "Remove workflow temporário de correção da foto" || exit 0
          git push