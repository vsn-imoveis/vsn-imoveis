name: Publicar Home VSN
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cards da Home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px auto 0;width:min(1140px,calc(100% - 72px))}', '.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px auto 0;width:min(1140px,calc(100% - 72px))}')
          s=s.replace('.quick-card{height:165px;border-radius:9px;overflow:hidden;position:relative;background-size:cover;background-position:center}', '.quick-card{height:176px;border-radius:12px;overflow:hidden;position:relative;background-size:cover;background-position:center;box-shadow:0 8px 24px rgba(11,41,64,.10);transition:transform .2s ease,box-shadow .2s ease}.quick-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,41,64,.15)}')
          s=s.replace('.quick-content{position:absolute;left:22px;right:18px;bottom:17px;z-index:2;color:#fff;display:flex;align-items:center;gap:11px}', '.quick-content{position:absolute;left:24px;right:20px;bottom:20px;z-index:2;color:#fff;display:flex;align-items:center;gap:13px}')
          s=s.replace('.quick-content svg{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.6}', '.quick-content svg{width:40px;height:40px;stroke:var(--gold);fill:none;stroke-width:1.6}')
          s=s.replace('.quick-content h3{margin:0 0 4px;font-size:16px}', '.quick-content h3{margin:0 0 4px;font-size:17px}')
          s=s.replace('.quick-content p{margin:0;font-size:11px}', '.quick-content p{margin:0;font-size:11.5px}')
          s=s.replace('.arrow{margin-left:auto;width:34px;height:34px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:18px}', '.arrow{margin-left:auto;width:36px;height:36px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:18px}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-home.yml
          git add index.html .github/workflows/publish-home.yml
          git diff --cached --quiet || git commit -m "style: finalizar cards de acesso rapido"
          git push
