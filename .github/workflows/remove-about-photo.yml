name: Remover foto institucional
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover foto da seção institucional
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.about{display:grid;grid-template-columns:1fr 1fr;min-height:290px}', '.about{display:block;min-height:290px}')
          s=s.replace('.about-img{background:url(\'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=80\') center/cover}', '.about-img{display:none}')
          s=s.replace('.about-copy{padding:40px 6%;display:flex;justify-content:center;flex-direction:column}', '.about-copy{padding:60px 6%;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center}')
          s=s.replace('.about-copy p{font-size:13px;line-height:1.6;color:var(--muted);max-width:540px}', '.about-copy p{font-size:13px;line-height:1.6;color:var(--muted);max-width:650px}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-about-photo.yml
          git add index.html .github/workflows/remove-about-photo.yml
          git diff --cached --quiet || git commit -m "style: remover foto da seção institucional"
          git push
