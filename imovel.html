<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imóvel | VSN Imóveis</title><style>body{font-family:Arial,sans-serif;margin:0;color:#20252b;background:#f4f6f8}.wrap{max-width:1180px;margin:auto;padding:24px 20px 50px}.back{display:inline-block;margin-bottom:16px;color:#b21f2d;text-decoration:none;font-weight:600}.hero{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px #0001}.gallery{position:relative;background:#fff}.mainphoto{width:100%;height:560px;object-fit:cover;background:#fff;display:block}.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:#ffffffe8;color:#222;font-size:30px;cursor:pointer;z-index:2;box-shadow:0 2px 10px #0002}.prev{left:18px}.next{right:18px}.counter{position:absolute;right:18px;bottom:18px;background:#111d;color:#fff;padding:7px 12px;border-radius:20px;font-size:13px}.thumbs{display:flex;gap:9px;padding:12px;overflow:auto;background:#fff;border-top:1px solid #eee}.thumbs img{width:100px;height:70px;object-fit:cover;border-radius:7px;cursor:pointer;opacity:.65;border:2px solid transparent;flex:none}.thumbs img.active{opacity:1;border-color:#b21f2d}.content{padding:28px 30px 30px}.eyebrow{font-size:13px;font-weight:700;color:#b21f2d;text-transform:uppercase;letter-spacing:.5px}.title{font-size:34px;line-height:1.15;margin:7px 0 8px}.location{font-size:16px;color:#5d6873}.price{font-size:32px;font-weight:800;margin:18px 0 14px}.stats{display:flex;flex-wrap:wrap;gap:10px}.stat{background:#f4f6f8;border-radius:10px;padding:11px 14px;font-weight:700}.stat span{display:block;font-size:12px;font-weight:500;color:#6c7580;margin-top:2px}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-top:20px}.box{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 14px #0001;margin-bottom:20px}.box h2{font-size:21px;margin:0 0 16px}.description{font-size:16 const db=window.supabase.createClient('https://jpdfynaioepcmgqlqlht.supabase.co','sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03');
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
async function load(){if(!id){app.innerHTML='<div class="box"><h2>Imóvel não informado.</h2><a class="back" href="/">Voltar ao site</a></div>';return}try{const {data:p,error}=await db.from('properties').select('*').eq('id',id).eq('published',true).single();if(error)throw error;const photos=Array.isArray(p.photos)?p.photos:[];const photo=photos[0]||'';const valor=p.transaction_type==='rent'?(p.rent_price?brl(p.rent_price)+'/mês':'Consulte'):(p.price?brl(p.price):'Consulte');const loc=[p.address,p.number,p.neighborhood,p.city].filter(Boolean).join(', ');const propertyFeatures=Array.isArray(p.property_features)?p.property_features:(Array.isArray(p.features)?p.features:[]);const condoFeatures=Array.isArray(p.condo_features)?p.condo_features:[];const stats=[p.area&&['Área',p.area+' m²'],p.bedrooms&&['Dormitórios',p.bedrooms],p.suites&&['Suítes',p.suites],p.bathrooms&&['Banheiros',p.bathrooms],p.parking&&['Vagas',p.parking]].filter(Boolean);const chips=a=>a.map(x=>'<span class="chip">'+esc(x)+'</span>').join('');let currentPhoto=0;window.showPhoto=function(i){if(!photos.length)return;currentPhoto=(i+photos.length)%photos.length;const main=document.getElementById('main');if(main)main.src=photos[currentPhoto];document.querySelectorAll('#thumbs img').forEach((x,n)=>x.classList.toggle('active',n===currentPhoto));const counter=document.getElementById('counter');if(counter)counter.textContent=(currentPhoto+1)+' / '+photos.length};window.changePhoto=function(dir){showPhoto(currentPhoto+dir)};app.innerHTML='<div class="hero"><div class="gallery">'+(photo?'<img id="main" class="mainphoto" src="'+esc(photo)+'">':'<div class="mainphoto"></div>')+'<button class="navbtn prev" onclick="changePhoto(-1)">‹</button><button class="navbtn next" onclick="changePhoto(1)">›</button><div class="counter" id="counter">'+(photos.length?1:0)+' / '+photos.length+'</div></div><div class="thumbs" id="thumbs">'+photos.map((x,i)=>'<img class="'+(i===0?'active':'')+'" src="'+esc(x)+'" onclick="showPhoto('+i+')">').join('')+'</div><div class="content"><div class="eyebrow">'+esc(p.property_type||'Imóvel')+' · '+esc(p.code||'')+'</div><h1 class="title">'+esc(p.title||'Imóvel disponível')+'</h1><div class="location">📍 '+esc(loc)+'</div><div class="price">'+esc(valor)+'</div><div class="stats">'+stats.map(s=>'<div class="stat">'+esc(s[1])+'<span>'+esc(s[0])+'</span></div>').join('')+'</div></div></div><div class="grid"><div><div class="box"><h2>Sobre este imóvel</h2><div class="description">'+esc(p.description||'Entre em contato para mais informações sobre este imóvel.').replace(/\n/g,'<br>')+'</div>'+(propertyFeatures.length?'<div class="section-label">Destaques do imóvel</div><div class="chips">'+chips(propertyFeatures)+'</div>':'')+'</div><div class="box"><h2>Condomínio</h2><div class="detail"><b>Nome</b><span>'+esc(p.condominium_name||'Não informado')+'</span></div>'+(p.condominium_builder?'<div class="detail"><b>Construtora</b><span>'+esc(p.condominium_builder)+'</span></div>':'')+(p.condominium_delivery_year||p.construction_year?'<div class="detail"><b>Entrega</b><span>'+esc(p.condominium_delivery_year||p.construction_year)+'</span></div>':'')+(p.condominium_units?'<div class="detail"><b>Unidades</b><span>'+esc(p.condominium_units)+'</span></div>':'')+(p.condominium_land_area?'<div class="detail"><b>Terreno</b><span>'+esc(p.condominium_land_area)+' m²</span></div>':'')+(condoFeatures.length?'<div class="section-label">Lazer e comodidades</div><div class="chips">'+chips(condoFeatures)+'</div>':'')+'</div></div><aside><div class="box highlight"><h2>Valores</h2><div class="detail"><b>Preço</b><span>'+esc(valor)+'</span></div>'+(p.condo_fee&&Number(p.condo_fee)>0?'<div class="detail"><b>Condomínio</b><span>'+esc(brl(p.condo_fee))+'/mês</span></div>':'')+(p.iptu&&Number(p.iptu)>0?'<div class="detail"><b>IPTU</b><span>'+esc(brl(p.iptu))+'</span></div>':'')+'</div><div class="cta"><div><strong>Gostou deste imóvel?</strong><small>Fale com a VSN Imóveis e agende uma visita.</small></div><a href="https://wa.me/?text='+encodeURIComponent('Olá! Tenho interesse no imóvel '+(p.code||''))+'">Tenho interesse</a></div></aside></div>}catch(e){console.error(e);app.innerHTML='<div class="box"><h2>Imóvel não encontrado</h2><p class="muted">Este imóvel pode não estar publicado ou o link pode estar incorreto.</p><a class="back" href="/">Voltar ao site</a></div>'}}load();</script></body></html>
