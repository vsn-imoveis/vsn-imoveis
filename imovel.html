<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imóvel | VSN Imóveis</title><style>body{font-family:Arial,sans-serif;margin:0;color:#20252b;background:#f7f8f9}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.back{display:inline-block;margin-bottom:20px;color:#b21f2d;text-decoration:none}.hero{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 18px #0001}.mainphoto{width:100%;height:520px;object-fit:cover;background:#ddd}.thumbs{display:flex;gap:8px;padding:10px;overflow:auto}.thumbs img{width:90px;height:65px;object-fit:cover;border-radius:6px;cursor:pointer}.content{padding:25px}.price{font-size:30px;font-weight:700;margin:10px 0}.meta{font-size:17px;margin:12px 0;color:#59636d}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}.box{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 12px #0001}.muted{color:#69737d}@media(max-width:700px){.grid{grid-template-columns:1fr}.mainphoto{height:320px}}</style></head><body><div class="wrap"><a class="back" href="/">← Voltar para imóveis</a><div id="app"><div class="box">Carregando imóvel...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://jpdfynaioepcmgqlqlht.supabase.co','sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03');
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
async function load(){if(!id){app.innerHTML='<div class="box">Imóvel não informado.</div>';return}try{const {data:p,error}=await db.from('properties').select('*').eq('id',id).eq('published',true).single();if(error)throw error;const photos=Array.isArray(p.photos)?p.photos:[];const photo=photos[0]||'';const valor=p.transaction_type==='rent'?(p.rent_price?brl(p.rent_price)+'/mês':'Consulte'):(p.price?brl(p.price):'Consulte');const feats=[p.area&&p.area+' m²',p.bedrooms&&p.bedrooms+' dormitórios',p.suites&&p.suites+' suítes',p.bathrooms&&p.bathrooms+' banheiros',p.parking&&p.parking+' vagas'].filter(Boolean).join(' · ');const loc=[p.address,p.number,p.neighborhood,p.city].filter(Boolean).join(', ');app.innerHTML='<div class="hero">'+(photo?'<img id="main" class="mainphoto" src="'+esc(photo)+'">':'<div class="mainphoto"></div>')+'<div class="thumbs">'+photos.map((x,i)=>'<img src="'+esc(x)+'" onclick="document.getElementById(\'main\').src=\''+esc(x)+'\'">').join('')+'</div><div class="content"><div class="muted">'+esc(p.code||'')+'</div><h1>'+esc(p.title||'Imóvel disponível')+'</h1><div class="price">'+esc(valor)+'</div><div class="meta">'+esc(feats)+'</div><div class="meta">'+esc(loc)+'</div></div></div><div class="grid"><div class="box"><h2>Descrição</h2><p class="muted">'+esc(p.description||'Entre em contato para mais informações sobre este imóvel.').replace(/\n/g,'<br>')+'</p></div><div class="box"><h2>Características</h2><p class="muted">'+esc(p.features||'Consulte o corretor para informações completas.')+'</p></div></div>'}catch(e){console.error(e);app.innerHTML='<div class="box"><h2>Imóvel não encontrado</h2><p class="muted">Este imóvel pode não estar publicado ou o link pode estar incorreto.</p><a class="back" href="/">Voltar ao site</a></div>'}}load();
</script></body></html>
