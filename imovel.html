const db=window.supabase.createClient('https://jpdfynaioepcmgqlqlht.supabase.co','sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03');
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');

async function load(){if(!id){app.innerHTML='<div class="box">Imóvel não informado.</div>';return}try{const {data:p,error}=await db.from('properties').select('*').eq('id',id).eq('published',true).single();if(error)throw error;const photos=Array.isArray(p.photos)?p.photos:[];const photo=photos[0]||'';const valor=p.transaction_type==='rent'?(p.rent_price?brl(p.rent_price)+'/mês':'Consulte'):(p.price?brl(p.price):'Consulte');const feats=[p.area&&p.area+' m²',p.bedrooms&&p.bedrooms+' dormitórios',p.suites&&p.suites+' suítes',p.bathrooms&&p.bathrooms+' banheiros',p.parking&&p.parking+' vagas'].filter(Boolean).join(' · ');const loc=[p.address,p.number,p.neighborhood,p.city].filter(Boolean).join(', ');let currentPhoto=0;window.showPhoto=function(i){if(!photos.length)return;currentPhoto=(i+photos.length)%photos.length;const main=document.getElementById('main');if(main)main.src=photos[currentPhoto];document.querySelectorAll('#thumbs img').forEach((x,n)=>x.classList.toggle('active',n===currentPhoto));const counter=document.getElementById('counter');if(counter)counter.textContent=(currentPhoto+1)+' / '+photos.length};window.changePhoto=function(dir){showPhoto(currentPhoto+dir)};window.openPhotoFullscreen=function(){const g=document.querySelector('.gallery');if(g&&g.requestFullscreen)g.requestFullscreen()};app.innerHTML='<div class="sale-strip">🏠 <b>VSN Imóveis</b> · Atendimento personalizado para compra, venda e visita ao imóvel</div><div class="hero"><div class="gallery">'+(photo?'<img id="main" class="mainphoto" src="'+esc(photo)+'">':'<div class="mainphoto"></div>')+'<button class="navbtn prev" onclick="changePhoto(-1)">‹</button><button class="navbtn next" onclick="changePhoto(1)">›</button><button class="fullscreen" aria-label="Ampliar fotos" onclick="openPhotoFullscreen()">⛶</button><div class="photo-overlay" id="counter">'+(photos.length?1:0)+' / '+photos.length+'</div></div><div class="thumbs" id="thumbs">'+photos.map((x,i)=>'<img class="'+(i===0?'active':'')+'" src="' </script></body></html>
