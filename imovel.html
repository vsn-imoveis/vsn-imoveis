<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#17202a;font-family:Arial,Helvetica,sans-serif}
.page{max-width:1440px;margin:auto;padding:0 34px 70px}
.header{height:68px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:30px;font-weight:800;color:#9f1f2d;letter-spacing:-1px}
.header-actions{display:flex;gap:12px;align-items:center}
.share{border:1px solid #e3e6e9;background:#fff;border-radius:16px;padding:12px 18px;font-size:15px;box-shadow:0 4px 14px #0000000d;cursor:pointer}
.heart{border:0;background:#fff;font-size:30px;cursor:pointer}
.hero{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px #00000012}
.gallery{height:430px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:3px;background:#fff;position:relative}
.gallery-photo{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.gallery-photo:first-child{grid-row:1}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:#fffffff2;font-size:34px;cursor:pointer;box-shadow:0 4px 15px #0003;z-index:4}
.gallery-nav.prev{left:16px}.gallery-nav.next{right:16px}
.counter{position:absolute;left:18px;bottom:18px;background:#000b;color:#fff;padding:8px 12px;border-radius:9px;font-size:13px;z-index:4}
.thumbs{display:flex;gap:9px;padding:12px 16px;overflow:auto;border-top:1px solid #eee}
.thumbs img{width:96px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.active{border-color:#a51f2d}
.content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
.left{padding:28px 18px 0 18px}
.breadcrumbs{display:flex;gap:8px;flex-wrap:wrap;color:#77818a;font-size:14px;margin-bottom:20px}

.code{font-size:13px;color:#7c858d;margin-bottom:26px}
.stats{display:flex;gap:38px;flex-wrap:wrap;margin-bottom:25px}
.stat{display:flex;align-items:center;gap:13px;min-width:150px}
.stat .ico{font-size:30px;color:#17202a;width:38px;text-align:center}
.stat strong{display:block;font-size:22px}
.stat small{display:block;color:#68737c;font-size:15px;margin-top:3px}

.location a{color:#9f1f2d;text-decoration:underline}

.price-card .label{font-size:14px;color:#68727b}
.price-card .price{font-size:36px;font-weight:900;color:#9f1f2d;margin:8px 0 18px}
.price-row{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #eceeef;font-size:15px}
.price-row strong{color:#20252b}
.interest{display:block;text-align:center;text-decoration:none;background:#a51f2d;color:#fff;font-size:18px;font-weight:800;border-radius:9px;padding:15px;margin-top:14px}
.finance,.card-wa{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;background:#fff;padding:17px 0;cursor:pointer;text-decoration:none;color:#20252b}
.finance .symbol{font-size:25px}.card-wa .wa-symbol{color:#14b95b;font-size:30px}
.finance span,.card-wa span{flex:1}.finance strong,.card-wa strong{display:block;font-size:16px}.finance small,.card-wa small{display:block;color:#68727b;margin-top:4px}
.divider{height:1px;background:#eceeef}
.wa-float{position:fixed;right:24px;bottom:22px;display:flex;align-items:center;gap:12px;background:#16c766;color:#fff;text-decoration:none;padding:13px 20px 13px 14px;border-radius:999px;box-shadow:0 8px 25px #0003;z-index:20}
.wa-icon{width:43px;height:43px;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800}
.slide-presenter{display:none;position:fixed;inset:0;background:#000e;z-index:100;align-items:center;justify-content:center}
.slide-presenter.open{display:flex}
.slide-presenter img{max-width:90vw;max-height:88vh;object-fit:contain}
.slide-close,.slide-prev,.slide-next{position:absolute;border:0;border-radius:50%;background:#fff;color:#17202a;width:48px;height:48px;font-size:32px;cursor:pointer}
.slide-close{right:24px;top:22px}.slide-prev{left:24px;top:50%;transform:translateY(-50%)}.slide-next{right:24px;top:50%;transform:translateY(-50%)}
.slide-count{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:8px 12px;border-radius:8px}
@media(max-width:900px){.page{padding:0 18px 90px}.gallery{height:350px}.content{grid-template-columns:1fr}.price-card{position:static;margin:22px 18px 0}.left{padding:24px 8px 0}h1{font-size:31px}.stats{gap:22px}.wa-float{right:14px;bottom:14px;padding:10px 15px 10px 10px}.wa-icon{width:39px;height:39px}.wa-float strong{font-size:14px}}
