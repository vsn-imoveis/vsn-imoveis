<header class="site-header"><a class="brand" href="/" aria-label="VSN Imóveis"><b>VSN</b><small>IMÓVEIS</small></a><div class="header-search"><input id="headerSearch" placeholder="Buscar imóvel — Bairro, cidade, código ou condomínio" onkeydown="if(event.key==='Enter')doHeaderSearch()"><button onclick="doHeaderSearch()" aria-label="Buscar"><i class="fa fa-search"></i></button></div><div class="header-actions"><a class="header-btn gold" href="#contato">Fale comigo</a></div></header>

<script>function doHeaderSearch(){const v=document.getElementById('headerSearch').value.trim();if(v)window.location.href='/?busca='+encodeURIComponent(v);}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://jpdfynaioepcmgqlqlht.supabase.co','sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03');
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function gallery(){if(!photos.length)return '<div class="empty">Sem fotos disponíveis</div>';const a=photos[0],b=photos[1]||a,c=photos[2]||a;return '<div class="gallery"><img id="g0" src="'+esc(a)+'" onclick="openPresenter(current)"><img id="g1" src="'+esc(b)+'" onclick="openPresenter((current+1)%photos.length)"><img id="g2" src="'+esc(c)+'" onclick="openPresenter((current+2)%photos.length)"><button class="prev" onclick="show(current-1)">‹</button><button class="next" onclick="show(current+1)">›</button><div id="count" class="counter"></div></div><div class="thumbs" id="thumbs"></div>'}
function show(n){if(!photos.length)return;current=(n+photos.length)%photos.length;[0,1,2].forEach(i=>{const e=document.getElementById('g'+i);if(e)e.src=photos[(current+i)%photos.length]});document.getElementById('count').textContent=(current+1)+' / '+photos.length;document.getElementById('thumbs').innerHTML=photos.map((p,i)=>'<img class="'+(i===current?'active':'')+'" src="'+esc(p)+'" onclick="show('+i+')">').join('')}
function openPresenter(n){if(!photos.length)return;current=(n+photos.length)%photos.length;document.getElementById('presenter').style.setProperty('--presenter-bg',"url('"+photos[current].replace(/'/g,"\\'")+"')");document.getElementById('presenter').classList.add('open');document.body.style.overflow='hidden';updatePresenter()}

function sharePage(){if(navigator.share)navigator.share({title:document.title,url:location.href});else navigator.clipboard?.writeText(location.href)}
document.addEventListener('keydown',e=>{if(!document.getElementById('presenter').classList.contains('open'))return;if(e.key==='Escape')closePresenter();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
function list(v){const a=(Array.isArray(v)?v:[]).filter(Boolean);if(a.length<=1)return a[0]||'';if(a.length===2)return a[0]+' e '+a[1];return a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function featureSection(title,items,gold=false){if(!items.length)return '';return '<div class="block"><h2>'+title+'</h2><div class="tags">'+items.map(x=>'<span class="tag '+(gold?'gold':'')+'">'+esc(x)+'</span>').join('')+'</div></div>'}
async function load(){
 if(!id){app.innerHTML='<div style="padding:50px 0">Imóvel não informado.</div>';return}
 try{
  const {data:p,error}=await db.from('properties').select('*').eq('id',id).eq('published',true).single();if(error)throw error;
  photos=Array.isArray(p.photos)?p.photos.filter(Boolean):[];
  const sale=p.for_sale||p.transaction_type==='sale'||p.transaction_type==='both',rent=p.for_rent||p.transaction_type==='rent'||p.transaction_type==='both';
  const type=p.property_type||'Imóvel',neigh=p.neighborhood||'',city=p.city||'São Paulo',state=p.state||'SP';
  const loc=[p.address,p.number].filter(Boolean).join(', ');

  const priceSale=sale&&p.price?brl(p.price):'',priceRent=rent&&p.rent_price?brl(p.rent_price)+'/mês':'';
  let price=priceSale||priceRent||'Consulte';if(sale&&rent)price=priceSale+' · '+priceRent;
  const suites=Number(p.suites||0),beds=Number(p.bedrooms||0),parking=Number(p.parking||0);
  const facts=[p.area?[Number(p.area).toLocaleString('pt-BR')+' m²','Área útil']:null,beds?[beds+' '+(beds===1?'quarto':'quartos'),'Dormitórios']:null,suites?[suites+' '+(suites===1?'suíte':'suítes'),'Suítes']:null,parking?[parking+' '+(parking===1?'vaga':'vagas'),'Garagem']:null].filter(Boolean);
  const wa='https://wa.me/5511974116234?text='+encodeURIComponent('Olá! Tenho interesse no imóvel '+(p.title||'')+(p.code?', código '+p.code:'')+'.');
  document.title=(p.title||'Imóvel')+' | VSN Imóveis';
   document.getElementById('floatWa').href=wa;
  const features=Array.isArray(p.features)?p.features:[],condoFeatures=Array.isArray(p.condo_features)?p.condo_features:[];
  app.innerHTML='<div class="hero">'+gallery()+'</div><div class="layout"><main class="main"><div class="crumb"><a href="/">Início</a><b>›</b>'+esc(type)+'<b>›</b>'+esc(neigh||city)+'</div><div class="type">'+esc(purposes)+'</div><h1 class="title">'+esc(p.title||type+' em '+(neigh||city))+'</h1><div class="code">Código '+esc(p.code||'—')+'</div><div class="address">⌖ '+esc([loc,neigh,city+' - '+state].filter(Boolean).join(' · '))+'</div><div class="facts">'+facts.map(x=>'<div class="fact"><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+'</span></div>').join('')+'</div><div class="block"><h2>Sobre o imóvel</h2><div class="description">'+esc(p.description||'Entre em contato para receber mais informações sobre este imóvel.').replace(/\n/g,'<br>')+'</div></div>'+featureSection('Características do imóvel',features,true)+featureSection('Características do condomínio',condoFeatures)+((p.condominium_name)?'<div class="block"><h2>Condomínio</h2><div class="description"><strong>'+esc(p.condominium_name)+'</strong></div></div>':'')+'</main><aside class="side"><div class="card" id="contato"><div class="eyebrow">'+esc(purposes)+'</div><div class="price">'+esc(price)+'</div>'+(sale&&rent?'<div class="subprice">Valores de venda e locação disponíveis.</div>':'')+'<div class="row"><span>Condomínio</span><strong>'+(p.condo_fee?brl(p.condo_fee):'Consulte')+'</strong></div><div class="row"><span>IPTU</span><strong>'+(p.iptu?brl(p.iptu):'Consulte')+'</strong></div><a class="cta" href="'+wa+'" target="_blank" rel="noopener">Tenho interesse</a><a class="wa" href="'+wa+'" target="_blank" rel="noopener"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3.2a12.7 12.7 0 0 0-10.9 19l-1.4 5.1 5.2-1.4A12.8 12.8 0 1 0 16 3.2Zm0 23.2c-2 0-4-.5-5.7-1.6l-.4-.2-3.1.8.8-3-.3-.5a10.3 10.3 0 1 1 8.7 4.5Zm5.6-7.7c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-1 1.1-.2.2-.4.2-.7.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.8-1.7.1-.2 0-.4 0-.5-.1-.1-.7-1.6-1-2.2-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1 2.9 1.1 3.1c.1.2 2 3.1 4.9 4.3 2.9 1.3 2.9.9 3.4.9.5 0 1.7-.7 2-1.3.3-.6.3-1.2.2-1.3-.1-.1-.3-.2-.6-.4Z"/></svg>WhatsApp</a><a class="back" href="/">← Voltar para imóveis</a></div></aside></div>';
  show(0);
 }catch(e){console.error(e);app.innerHTML='<div style="padding:60px 0"><h2>Imóvel não encontrado</h2><p>Este imóvel pode não estar publicado ou o link pode estar incorreto.</p><a class="back" href="/">← Voltar para imóveis</a></div>'}
}
load();
</script></body></html>
