<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="panel" src="./painel-v7.html?v=20260910-v11" title="Painel VSN Imóveis"></iframe><script>
const frame=document.getElementById('panel');
function findForm(win){try{const doc=win.document;const f=doc.getElementById('propertyForm');if(f)return{win,doc,form:f};for(const fr of doc.querySelectorAll('iframe')){try{const r=findForm(fr.contentWindow);if(r)return r}catch(e){}}}catch(e){}return null}
async function setup(){const ctx=findForm(frame.contentWindow);if(!ctx)return;const{win,doc,form}=ctx;
if(!doc.getElementById('structuralCondoFields')){const box=doc.createElement('div');box.id='structuralCondoFields';box.style.cssText='margin-top:18px;padding:18px;border:1px solid #dfe4ea;border-radius:12px;background:#fff';box.innerHTML='<div style="font-weight:700;font-size:15px;margin-bottom:12px">🏢 Dados do condomínio</div><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px"><div><label>Construtora</label><input name="condominium_builder" type="text" placeholder="Ex.: Campanário"></div><div><label>Ano de entrega</label><input name="condominium_delivery_year" type="number" min="1800" max="2100" placeholder="Ex.: 1992"></div><div><label>Unidades</label><input name="condominium_units" type="number" min="1" placeholder="Ex.: 34"></div><div><label>Terreno (m²)</label><input name="condominium_land_area" type="number" min="0" step="0.01" placeholder="Ex.: 2456"></div></div><div id="structuralMsg" style="margin-top:8px;font-size:12px;color:#68737d">Digite endereço e número para preencher automaticamente.</div>';const sections=[...form.querySelectorAll('.section')];const target=sections.find(s=>/características do condomínio|condomínio/i.test(s.querySelector('h2')?.textContent||''))||sections[sections.length-1];(target||form).appendChild(box)}
const get=n=>String(form.elements.namedItem(n)?.value||'').trim();
async function structural(){const address=get('address'),number=get('number');if(!address||!number)return;const key=address+'|'+number;if(form.dataset.structuralKey===key)return;form.dataset.structuralKey=key;const msg=doc.getElementById('structuralMsg');if(msg)msg.textContent='🔎 Consultando dados do condomínio...';try{const r=await fetch('/api/identify-condo-structural.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,number,cep:get('cep'),neighborhood:get('neighborhood'),city:get('city'),state:get('state')})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha');const set=(n,v)=>{const e=form.elements.namedItem(n);if(e&&v!==null&&v!==undefined&&String(v)!=='')e.value=v};set('condominium_builder',j.condominium_builder);set('condominium_delivery_year',j.condominium_delivery_year);set('condominium_units',j.condominium_units);set('condominium_land_area',j.condominium_land_area);if(msg){const found=[j.condominium_builder,j.condominium_delivery_year,j.condominium_units,j.condominium_land_area].some(v=>v!==null&&v!==undefined&&String(v)!=='');msg.textContent=found?'✓ Dados preenchidos automaticamente.':'Nenhum dado estrutural confirmado para este endereço.'}}catch(e){if(msg)msg.textContent='Não foi possível consultar os dados agora.';console.warn(e)}}
const trigger=()=>{clearTimeout(form.__st);form.__st=setTimeout(structural,500)};if(!form.dataset.structuralListeners){form.dataset.structuralListeners='1';['address','number','cep'].forEach(n=>{const e=form.elements.namedItem(n);e?.addEventListener('input',trigger);e?.addEventListener('change',trigger)});setTimeout(structural,800)}
async function nextCode(){const code=form.elements.namedItem('code');if(!code||String(code.value||'').trim())return;try{const r=await fetch('https://jpdfynaioepcmgqlqlht.supabase.co/rest/v1/properties?select=code&code=not.is.null&order=code.desc&limit=1',{headers:{apikey:'sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',Authorization:'Bearer sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03'}});if(!r.ok)return;const rows=await r.json();let n=0;if(rows[0]?.code){const m=String(rows[0].code).match(/^vsn(\d+)$/i);if(m)n=parseInt(m[1],10)||0}code.value='vsn'+String(n+1).padStart(5,'0');code.readOnly=true;code.title='Código gerado automaticamente a partir do banco de dados';code.style.background='#f3f5f7'}catch(e){console.warn('Código VSN:',e)}}
function installPhotoSorter(){const container=doc.getElementById('photos');if(!container)return;container.querySelectorAll('.photo').forEach(item=>{if(item.dataset.vsnSortReady==='1')return;item.dataset.vsnSortReady='1';item.draggable=true;item.style.cursor='grab';item.style.position='relative';const img=item.querySelector('img');if(img&&!item.dataset.vsnPhotoKey){const src=img.getAttribute('src')||'';if(src.startsWith('blob:')){const blobs=[...container.querySelectorAll('.photo img')].filter(x=>(x.getAttribute('src')||'').startsWith('blob:'));item.dataset.vsnPhotoKey='new:'+blobs.indexOf(img)}else item.dataset.vsnPhotoKey='stored:'+src}const badge=doc.createElement('span');badge.textContent='☰ Arraste';badge.style.cssText='position:absolute;left:6px;bottom:6px;background:#171d24e8;color:#fff;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;pointer-events:none';item.appendChild(badge);item.addEventListener('dragstart',e=>{item.style.opacity='.45';e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.dataset.vsnPhotoKey)});item.addEventListener('dragend',()=>{item.style.opacity='1';container.querySelectorAll('.photo').forEach(x=>x.classList.remove('vsn-drag-over'))});item.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';item.classList.add('vsn-drag-over')});item.addEventListener('dragleave',()=>item.classList.remove('vsn-drag-over'));item.addEventListener('drop',e=>{e.preventDefault();item.classList.remove('vsn-drag-over');const key=e.dataTransfer.getData('text/plain');const from=[...container.querySelectorAll('.photo')].find(x=>x.dataset.vsnPhotoKey===key);if(!from||from===item)return;const rect=item.getBoundingClientRect();const after=e.clientY>rect.top+rect.height/2;container.insertBefore(from,after?item.nextSibling:item);});});if(!doc.getElementById('vsn-sort-style')){const st=doc.createElement('style');st.id='vsn-sort-style';st.textContent='.photo.vsn-drag-over{outline:3px solid #d71920;outline-offset:2px}.photo[draggable=true]:active{cursor:grabbing}';doc.head.appendChild(st)}}
function photoOrder(){const container=doc.getElementById('photos');if(!container)return null;return [...container.querySelectorAll('.photo')].map(x=>x.dataset.vsnPhotoKey||'').filter(Boolean)}
if(!win.__v11Fetch){const oldFetch=win.fetch.bind(win);win.__v11Fetch=true;win.fetch=async function(input,init){let url=typeof input==='string'?input:(input&&input.url)||'';if(url.includes('/rest/v1/properties')&&init?.body&&typeof init.body==='string'){try{const body=JSON.parse(init.body);for(const n of ['condominium_builder','condominium_delivery_year','condominium_units','condominium_land_area']){const e=form.elements.namedItem(n);if(e)body[n]=String(e.value||'').trim()?(n==='condominium_builder'?e.value.trim():Number(e.value)):null}if(Array.isArray(body.photos)){const order=photoOrder();if(order?.length){const stored=body.photos.filter(u=>typeof u==='string'&&/^https?:/i.test(u));const uploaded=body.photos.filter(u=>typeof u==='string'&&!/^https?:/i.test(u));const byKey=new Map();stored.forEach(u=>byKey.set('stored:'+u,u));uploaded.forEach((u,i)=>byKey.set('new:'+i,u));const sorted=order.map(k=>byKey.get(k)).filter(Boolean);if(sorted.length===body.photos.length)body.photos=sorted}}init={...init,body:JSON.stringify(body)}}catch(e){console.warn('VSN fotos:',e)}}return oldFetch(input,init)}}
installPhotoSorter();new MutationObserver(()=>{installPhotoSorter()}).observe(doc.body,{childList:true,subtree:true});nextCode();}
frame.addEventListener('load',()=>{setTimeout(setup,100);setTimeout(setup,700);setTimeout(setup,1600);setTimeout(setup,3000)});setTimeout(setup,1200);
</script></body></html>
