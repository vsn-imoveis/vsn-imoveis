cription')||'',features:fd.getAll('feature'),video_url:fd.get('video_url')||null,photos:[...photos,...await uploadSelected()]};const{error}=editId?await S.from('properties').update(obj).eq('id',editId):await S.from('properties').insert(obj);if(error)throw error;toast('Imóvel salvo com sucesso.','ok');selected=[];editId='';await load();document.getElementById('form').innerHTML=''}catch(e){toast('Erro ao salvar: '+e.message,'err');btn.disabled=false;btn.textContent='Salvar imóvel'}}async function edit(id){const{data,error}=await S.from('properties').select('*').eq('id',id).single();if(error)return toast(error.message,'err');newProp(data)}async function toggle(id){const{data}=await S.from('properties').select('published').eq('id',id).single();await S.from('properties').update({published:!data.published}).eq('id',id);load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;await S.from('properties').delete().eq('id',id);load()}function cancelForm(){document.getElementById('form').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}boot();</script></body></html>
