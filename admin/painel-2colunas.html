x solid var(--l);border-radius:10px;background:#f8fafb}.seg input{display:none}.seg label{text-align:center;margin:0;padding:10px;cursor:pointer;border-radius:7px;color:#56616b}.seg input:checked+label{background:#fff;color:var(--d);box-shadow:0 2px 7px #00000014}.money{display:flex}.money span{height:46px;padding:0 12px;display:flex;align-items:center;background:#f0f2f4;border:1px solid #cbd3da;border-right:0;border-radius:10px 0 0 10px;font-weight:800}.money input{border-radius:0 10px 10px 0}.counter{height:62px;display:grid;grid-template-columns:62px 1fr 62px;border:1px solid #cbd3da;border-radius:12px;overflow:hidden}.counter button{border:0;background:#eef1f4;font-size:34px;cursor:pointer}.counter .plus{background:var(--r);color:#fff}.counter input{height:62px;border:0;text-align:center;font-size:21px;font-weight:900;padding:0}.unit{text-align:center;font-size:11px;color:var(--m);font-weight:700;margin-top:-14px;position:relative}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--l);border-radius:10px;padding:11px;cursor:pointer}.check input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--r)}.addrmsg{font-size:12px;color:var(--m);margin-top:6px;min-height:17px}.ok{color:var(--g)}.upload{border:2px dashed #c8d0d7;border-radius:14px;padding:27px;text-align:center;background:#fafbfc}.upload strong{display:block;margin-bottom:5px}.upload p{color:var(--m);margin:0 0 15px;font-size:13px}.upload input{display:none}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.photo{position:relative;aspect-ratio:4/3;border:1px solid var(--l);border-radius:10px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:29px;height:29px;background:#fff;color:#b42318;font-size:18px;cursor:pointer}.photo.cover:after{content:"CAPA";position:absolute;left:6px;bottom:6px; </style></head><body><header class="top"><div class="brand">VSN IMÓVEIS</div><div class="user" id="user"></div></header><main class="wrap" id="app"></main><div id="toast" class="toast"></div><script>
const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K),A=document.getElementById('app');let selected=[],photos=[],editId='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t,c=''){const e=document.getElementById('toast');e.textContent=t;e.className='toast show '+c;setTimeout(()=>e.className='toast',3500)}async function boot(){const{data:{session}}=await S.auth.getSession();session?show(session):login()}function login(msg=''){A.innerHTML='<div class="panel login"><div class="sec"><h1>Área administrativa</h1><p class="help">Entre com seu e-mail e senha.</p><br><label>E-mail</label><input id="em" type="email" value="wm.vinicius@hotmail.com"><br><label>Senha</label><input id="pw" type="password" onkeydown="if(event.key===\'Enter\')go()"><br><br><button class="btn red" onclick="go()">Entrar</button><p id="msg" class="help">'+esc(msg)+'</p></div></div>'}async function go(){const m=document.getElementById('msg');m.textContent='Entrando...';const{data,error}=await S.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error){m.textContent=error.message;return}show(data.session)}async function show(s){user.textContent=s.user.email;A.innerHTML='<div class="head"><div><h1>Novo imóvel</h1><p>Informações comerciais à esquerda. Localização, descrição e mídia à direita.</p></div><div class="actions"><button class="btn gray" onclick="S.auth.signOut()">Sair</button></div></div><div id="list"></div><div id="form"></div>';load()}async function load(){const{data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error)return;document.getElementById('list').innerHTML='<div class="panel"><div class="sec"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Imóveis cadastrados</b><div class="help">'+data.length+' imóvel(is)</div></div><button class="btn red" onclick="newProp()">+ Novo imóvel</button></div>'+(data.length?'<div style="margin-top:14px">'+data.map(x=>'<div style="border-top:1px solid var(--l);padding:12px 0"><b>'+esc(x.title)+'</b><br><small style="color:var(--m)">'+esc(x.neighborhood||'')+' · R$ '+Number(x.price||0).toLocaleString('pt-BR')+' · '+(x.published?'Publicado':'Rascunho')+'</small><div style="margin-top:7px"><button class="btn gray" onclick="edit(\''+x.id+'\')">Editar</button> <button class="btn gray" onclick="toggle(\''+x.id+'\')">'+(x.published?'Despublicar':'Publicar')+'</button></div></div>').join('')+'</div>':'<p class="help" style="margin-top:14px">Nenhum imóvel cadastrado.</p>')+'</div></div>'}function ctr(n,v,u){return '<div class="counter"><button type="button" onclick="adj(\''+n+'\',-1)">−</button><input id="c-'+n+'" name="'+n+'" type="number" min="0" value="'+(v||0)+'"><button type="button" class="plus" onclick="adj(\''+n+'\',1)">+</button></div><div class="unit">'+u+'</div>'}function adj(n,d){const i=document.getElementById('c-'+n);i.value=Math.max(0,(+i.value||0)+d)}
function newProp(x={}){editId=x.id||'';photos=[...(x.photos||[])];selected=[];document.getElementById('form').innerHTML='<form onsubmit="save(event)"><div class="layout"><div class="panel"><section class="sec"><div class="sh"><div class="ico">1</div><div><h2>Dados do imóvel</h2><p class="help">Informações principais do anúncio.</p></div></div><div class="grid"><div class="f"><label>Título <span class="req">*</span></label><input name="title" required placeholder="Ex.: Apartamento moderno no Morumbi" value="'+esc(x.title)+'"></div><div class="f"><label>Código</label><input name="code" placeholder="VSN1234" value="'+esc(x.code)+'"></div><div class="f"><label>Finalidade</label><div class="seg"><input id="v" type="radio" name="transaction_type" value="sale" '+(x.transaction_type!=='rent'?'checked':'')+'><label for="v">Venda</label><input id="l" type="radio" name="transaction_type" value="rent" '+(x.transaction_type==='rent'?'checked':'')+'><label for="l">Locação</label></div></div><div class="f"><label>Tipo do imóvel</label><select name="property_type"><option>Apartamento</option><option>Casa</option><option>Studio</option><option>Cobertura</option><option>Terreno</option><option>Sala comercial</option><option>Outro</option></select></div></div></section><section class="sec"><div class="sh"><div class="ico">R$</div><div><h2>Valores</h2><p class="help">Preencha os valores do imóvel.</p></div></div><div class="grid"><div class="f3"><label>Preço <span class="req">*</span></label><div class="money"><span>R$</span><input name="price" type="number" min="0" step="0.01" required value="'+(x.price||'')+'"></div></div><div class="f3"><label>Condomínio</label><div class="money"><span>R$</span><input name="condo_fee" type="number" min="0" step="0.01" value="'+(x.condo_fee||'')+'"></div></div><div class="f3"><label>IPTU</label><div class="money"><span>R$</span><input name="iptu" type="number" min="0" step="0.01" value="'+(x.iptu||'')+'"></div></div></div></section><section class="sec"><div class="sh"><div class="ico">+</div><div><h2>Características</h2><p class="help">Controles grandes para cadastrar rapidamente.</p></div></div><div class="grid"><div class="f3"><label>Área <span class="req">*</span></label>'+ctr('area',x.area,'m²')+'</div><div class="f3"><label>Dormitórios</label>'+ctr('bedrooms',x.bedrooms,'dormitórios')+'</div><div class="f3"><label>Suítes</label>'+ctr('suites',x.suites,'suítes')+'</div><div class="f3"><label>Vagas</label>'+ctr('parking',x.parking,'vagas')+'</div></div><div style="margin-top:18px"><label>Outras características</label><div class="checks">'+['Mobiliado','Varanda','Churrasqueira','Piscina','Academia','Salão de festas','Playground','Elevador','Portaria 24h','Aceita pets'].map(a=>'<label class="check"><input type="checkbox" name="feature" value="'+a+'" '+((x.features||[]).includes(a)?'checked':'')+'><b>'+a+'</b></label>').join('')+'</div></div></section></div><div class="panel"><section class="sec"><div class="sh"><div class="ico">⌖</div><div><h2>Localização</h2><p class="help">Digite o endereço e preencha automaticamente os dados.</p></div></div><div class="grid"><div class="full"><label>Endereço <span class="req">*</span></label><input id="address" name="address" required placeholder="Rua, número" value="'+esc(x.address)+'" onblur="addressLookup()"><div id="amsg" class="addrmsg">Bairro, cidade, estado e CEP serão buscados automaticamente.</div></div><div class="f"><label>Bairro <span class="req">*</span></label><input id="neighborhood" name="neighborhood" required value="'+esc(x.neighborhood)+'"></div><div class="f"><label>Cidade</label><input id="city" name="city" value="'+esc(x.city||'São Paulo')+'"></div><div class="f"><label>Estado</label><input id="state" name="state" maxlength="2" value="'+esc(x.state||'SP')+'"></div><div class="f"><label>CEP</label><input id="cep" name="cep" value="'+esc(x.cep)+'" placeholder="00000-000" onblur="cepLookup()"></div></div></section><section class="sec"><div class="sh"><div class="ico">✎</div><div><h2>Descrição</h2><p class="help">Após subir as fotos, a IA cria o texto do anúncio.</p></div></div><textarea id="description" name="description" maxlength="2000" placeholder="A descrição será criada automaticamente após as fotos...">'+esc(x.description)+'</textarea><div class="ai"><small id="aist">Suba as fotos e a descrição será gerada automaticamente.</small><button type="button" class="btn gray" onclick="ai()">Gerar agora</button></div></section><section class="sec"><div class="sh"><div class="ico">▧</div><div><h2>Fotos e vídeo</h2><p class="help">A primeira foto é a capa.</p></div></div><div class="upload" id="drop"><strong>Arraste e solte as fotos aqui</strong><p>JPG, PNG, WEBP ou HEIC · até 10 MB por foto</p><label class="btn red" for="files">Escolher fotos</label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif" onchange="pick(event)"></div><div id="pre" class="photos"></div><br><label>Vídeo (opcional)</label><input name="video_url" type="url" placeholder="https://youtube.com/..." value="'+esc(x.video_url)+'"></section><section class="sec"><label class="check"><input type="checkbox" name="published" '+(x.id?(x.published?'checked':''):'checked')+'><b>Publicar no site</b></label><label class="check" style="margin-top:8px"><input type="checkbox" name="featured" '+(x.featured?'checked':'')+'><b>Destacar imóvel</b></label></section></div></div><div class="bottom"><button type="button" class="btn gray" onclick="cancelar()">Cancelar</button><button id="save" class="btn red">Salvar imóvel</button></div></form>';document.querySelector('[name=property_type]').value=x.property_type||'Apartamento';render();document.getElementById('form').scrollIntoView({behavior:'smooth'})}
async function cepLookup(){const c=cep.value.replace(/\D/g,'');if(c.length!==8)return;amsg.textContent='Consultando CEP...';try{const d=await(await fetch('https://viacep.com.br/ws/'+c+'/json/')).json();if(d.erro)throw 0;neighborhood.value=d.bairro||'';city.value=d.localidade||'';state.value=d.uf||'';if(d.logradouro&&!address.value)address.value=d.logradouro;amsg.textContent='Localização preenchida automaticamente.';amsg.className='addrmsg ok'}catch(e){amsg.textContent='CEP não encontrado.'}}async function addressLookup(){const q=address.value.trim();if(q.length<5)return;amsg.textContent='Buscando endereço...';try{const a=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=br&q='+encodeURIComponent(q+', São Paulo, Brasil'))).json();if(!a.length)throw 0;const d=a[0].address||{};neighborhood.value=d.suburb||d.neighbourhood||d.city_district||neighborhood.value;city.value=d.city||d.town||d.municipality||city.value;state.value=(d.state_code||'SP').replace('BR-','');cep.value=d.postcode||cep.value;amsg.textContent='Bairro, cidade, estado e CEP preenchidos automaticamente.';amsg.className='addrmsg ok'}catch(e){amsg.textContent='Não encontrei. Você pode preencher manualmente.'}}
function pick(e){selected=[...selected,...[...e.target.files].filter(f=>f.size<=10*1024*1024)];render();aist.textContent='Fotos selecionadas. Ao salvar, a descrição será criada automaticamente.'}function render(){pre.innerHTML='';photos.forEach((u,i)=>{const d=document.createElement('div');d.className='photo '+(i===0?'cover':'');d.innerHTML='<img src="'+esc(u)+'"><button type="button" onclick="photos.splice('+i+',1);render()">×</button>';pre.appendChild(d)});selected.forEach((f,i)=>{const d=document.createElement('div');d.className='photo '+(photos.length===0&&i===0?'cover':'');d.innerHTML='<img src="'+URL.createObjectURL(f)+'"><button type="button" onclick="selected.splice('+i+',1);render()">×</button>';pre.appendChild(d)})}async function upload(id){const out=[];for(let i=0;i<selected.length;i++){const f=selected[i],path=id+'/'+Date.now()+'_'+i+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const{error}=await S.storage.from('property-photos').upload(path,f,{contentType:f.type||'image/jpeg'});if(error)throw error;out.push(S.storage.from('property-photos').getPublicUrl(path).data.publicUrl)}return out}
async function ai(){if(!selected.length&&!photos.length)return toast('Suba as fotos primeiro.','err');aist.textContent='Gerando descrição...';try{let urls=photos.slice();if(selected.length&&editId)urls=urls.concat(await upload(editId));const f=new FormData(document.querySelector('form'));const r=await fetch('/api/generate-description.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:urls.slice(0,12),data:{property_type:f.get('property_type'),transaction_type:f.get('transaction_type'),area:f.get('area'),bedrooms:f.get('bedrooms'),suites:f.get('suites'),parking:f.get('parking'),neighborhood:f.get('neighborhood'),address:f.get('address')}})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha');description.value=j.description||'';aist.textContent='Descrição criada. Revise antes de publicar.';toast('Descrição gerada.','ok')}catch(e){aist.textContent='Não foi possível gerar agora.';toast(e.message,'err')}}
async function save(e){e.preventDefault();const f=new FormData(e.target),b=document.getElementById('save');b.disabled=true;b.textContent='Salvando...';try{let row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+f.get('area'),bedrooms:+f.get('bedrooms'),suites:+f.get('suites'),parking:+f.get('parking'),neighborhood:f.get('neighborhood'),city:f.get('city')||'São Paulo',state:f.get('state')||'SP',cep:f.get('cep')||null,address:f.get('address'),description:f.get('description')||null,features:[...document.querySelectorAll('[name=feature]:checked')].map(x=>x.value),video_url:f.get('video_url')||null,photos,featured:f.has('featured'),published:f.has('published')};let r=editId?await S.from('properties').update(row).eq('id',editId).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const urls=await upload(r.data.id);if(urls.length){photos=photos.concat(urls);await S.from('properties').update({photos}).eq('id',r.data.id)}if(urls.length||photos.length){const ar=await fetch('/api/generate-description.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:photos.slice(0,12),data:{property_type:row.property_type,transaction_type:row.transaction_type,area:row.area,bedrooms:row.bedrooms,suites:row.suites,parking:row.parking,neighborhood:row.neighborhood,address:row.address}})});const aj=await ar.json();if(ar.ok&&aj.description)await S.from('properties').update({description:aj.description}).eq('id',r.data.id)}toast('Imóvel salvo com sucesso.','ok');selected=[];photos=[];editId='';form.innerHTML='';load()}catch(err){toast(err.message,'err');b.disabled=false;b.textContent='Salvar imóvel'}}function edit(id){S.from('properties').select('*').eq('id',id).single().then(({data})=>newProp(data))}function cancelar(){selected=[];photos=[];editId='';form.innerHTML=''}async function toggle(id){const{data}=await S.from('properties').select('published').eq('id',id).single();await S.from('properties').update({published:!data.published}).eq('id',id);load()}S.auth.onAuthStateChange((_e,s)=>s?show(s):login());boot();
