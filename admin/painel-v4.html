<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#d71920;--dark:#171d24;--text:#202a33;--muted:#68737d;--line:#dfe4e8;--bg:#f4f6f8;--blue:#1463d8;--green:#168044}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{height:64px;background:var(--dark);color:#fff;padding:0 4%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:18px}.wrap{max-width:1450px;margin:auto;padding:24px 20px 100px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #171d2412;overflow:hidden}.section{padding:22px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.half{grid-column:span 6}.third{grid-column:span 4}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input,select,textarea{width:100%;height:46px;border:1px solid #cbd3da;border-radius:10px;padding:11px 13px;background:#fff;color:var(--text);font:inherit;outline:0}textarea{height:150px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #d7192017}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.red{background:var(--red);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:#e9edf0;color:#27323c}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#f7f9fa;border:1px solid var(--line);border-radius:10px}.seg input{display:none}.seg label{text-align:center;margin:0;padding:10px;cursor:pointer;border-radius:7px}.seg input:checked+label{background:#fff;box-shadow:0 2px 7px #0001}.money{display:flex}.money span{display:flex;align-items:center;padding:0 12px;background:#eef1f4;border:1px solid #cbd3da;border-right:0;border-radius:10px 0 0 10px;font-weight:800}.money input{border-radius:0 10px 10px 0}.counter{display:grid;grid-template-columns:52px 1fr 52px;height:56px;border:1px solid #cbd3da;border-radius:11px;overflow:hidden}.counter button{border:0;background:#eef1f4;font-size:29px;cursor:pointer}.counter .plus{background:var(--red);color:#fff}.counter input{height:56px;border:0;border-radius:0;text-align:center;font-size:20px;font-weight:900;padding:0}.unit{text-align:center;color:var(--muted);font-size:11px;margin-top:4px}.condo{margin-top:14px;padding:15px;border:1px solid #d8e5ff;background:#f7faff;border-radius:12px}.condo-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.features{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px}.check input{width:18px;height:18px;padding:0}.msg{min-height:18px;margin-top:7px;font-size:12px;color:var(--muted)}.msg.ok{color:var(--green)}.msg.err{color:#a92828}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.photo{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:#eee}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:28px;height:28px;background:#fff;color:#b42318;font-size:18px;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);padding:11px 20px;display:flex;justify-content:flex-end;gap:8px;z-index:20}.toast{position:fixed;right:20px;bottom:75px;z-index:30;background:var(--dark);color:#fff;padding:13px 16px;border-radius:10px;display:none;max-width:430px}.toast.show{display:block}.toast.ok{background:var(--green)}.toast.err{background:#a92828}@media(max-width:950px){.layout{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:18px 12px 100px}.grid{gap:12px}.half,.third{grid-column:1/-1}.features{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.head h1{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="brand">VSN IMÓVEIS</div><div id="user" class="muted" style="color:#fff"></div></header>
<main id="app" class="wrap"></main><div id="toast" class="toast"></div>
<script>
const SUPA='https://jpdfynaioepcmgqlqlht.supabase.co';
const KEY='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03';
const DB=window.supabase.createClient(SUPA,KEY);
const appEl=document.getElementById('app');
let editId='',storedPhotos=[],newFiles=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formEl=()=>document.getElementById('propertyForm');
const val=(name)=>{const f=formEl();const e=f&&f.elements.namedItem(name);return String(e?.value??'').trim()};
function toast(text,type=''){const e=document.getElementById('toast');e.textContent=text;e.className='toast show '+type;clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.className='toast',4500)}
function money(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyNumber(v){let s=String(v||'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'');return Number(s)||0}
function moneyMask(e){const n=moneyNumber(e.value);if(n)e.value=money(n)}
function counter(name,v){return `<div><div class="counter"><button type="button" onclick="adjust('${name}',-1)">−</button><input id="c_${name}" name="${name}" type="number" min="0" value="${Number(v||0)}"><button type="button" class="plus" onclick="adjust('${name}',1)">+</button></div></div>`}
function adjust(name,d){const e=document.getElementById('c_'+name);if(e)e.value=Math.max(0,(parseInt(e.value,10)||0)+d)}
function login(message=''){appEl.innerHTML=`<div class="panel" style="max-width:430px;margin:70px auto"><div class="section"><h1>Área administrativa</h1><p class="muted">Entre com seu e-mail e senha.</p><br><label>E-mail</label><input id="email" type="email" value="wm.vinicius@hotmail.com"><br><label>Senha</label><input id="password" type="password" onkeydown="if(event.key==='Enter')signIn()"><br><br><button class="btn red" onclick="signIn()">Entrar</button><div class="msg err">${esc(message)}</div></div></div>`}
async function signIn(){const m=document.querySelector('.msg');m.textContent='Entrando...';const{data,error}=await DB.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent=error.message;return}renderShell(data.session)}
async function boot(){const{data:{session}}=await DB.auth.getSession();session?renderShell(session):login()}
async function renderShell(session){document.getElementById('user').textContent=session.user.email;appEl.innerHTML=`<div class="head"><div><h1>Painel de imóveis</h1><p class="muted">O endereço usado na pesquisa é sempre lido dos campos atuais da tela. Nada depende de o imóvel já estar salvo.</p></div><button class="btn gray" onclick="DB.auth.signOut().then(()=>login())">Sair</button></div><div id="list"></div><div id="editor"></div>`;await loadList();newProperty()}
async function loadList(){const box=document.getElementById('list');const{data,error}=await DB.from('properties').select('*').order('created_at',{ascending:false});if(error){box.innerHTML=`<div class="panel"><div class="section msg err">${esc(error.message)}</div></div>`;return}box.innerHTML=`<div class="panel"><div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Imóveis cadastrados</b><div class="muted">${data.length} imóvel(is)</div></div><button class="btn red" onclick="newProperty()">+ Novo imóvel</button></div>${data.map(p=>`<div style="border-top:1px solid var(--line);padding:12px 0"><b>${esc(p.title||'Sem título')}</b><br><span class="muted">${esc(p.neighborhood||'')} · ${p.published?'Publicado':'Rascunho'}</span><div style="margin-top:7px"><button class="btn gray" onclick="editProperty('${p.id}')">Editar</button> <button class="btn gray" onclick="toggleProperty('${p.id}',${!!p.published})">${p.published?'Despublicar':'Publicar'}</button> <button class="btn gray" onclick="deleteProperty('${p.id}')">Excluir</button></div></div>`).join('')}</div></div>`}
function newProperty(p={}){editId=p.id||'';storedPhotos=[...(p.photos||[])];newFiles=[];const sale=p.for_sale!==undefined?p.for_sale:p.transaction_type!=='rent';const rent=p.for_rent!==undefined?p.for_rent:p.transaction_type==='rent';document.getElementById('editor').innerHTML=`<form id="propertyForm" class="layout" onsubmit="saveProperty(event)">
<div class="panel"><section class="section"><h2>Dados do imóvel</h2><div class="grid"><div class="half"><label>Título *</label><input name="title" required value="${esc(p.title)}"></div><div class="half"><label>Código</label><input name="code" value="${esc(p.code)}"></div><div class="full"><label>Finalidade *</label><div class="seg"><input id="fs" name="for_sale" type="checkbox" ${sale?'checked':''}><label for="fs">Venda</label><input id="fr" name="for_rent" type="checkbox" ${rent?'checked':''}><label for="fr">Locação</label></div></div><div class="half"><label>Tipo</label><select name="property_type"><option ${p.property_type==='Apartamento'?'selected':''}>Apartamento</option><option ${p.property_type==='Casa'?'selected':''}>Casa</option><option ${p.property_type==='Studio'?'selected':''}>Studio</option><option ${p.property_type==='Cobertura'?'selected':''}>Cobertura</option><option ${p.property_type==='Terreno'?'selected':''}>Terreno</option><option ${p.property_type==='Sala comercial'?'selected':''}>Sala comercial</option></select></div></div></section>
<section class="section"><h2>Valores</h2><div class="grid"><div class="third"><label>Preço de venda</label><div class="money"><span>R$</span><input name="price" value="${p.price?money(p.price):''}" onblur="moneyMask(this)"></div></div><div class="third"><label>Valor de locação</label><div class="money"><span>R$</span><input name="rent_price" value="${p.rent_price?money(p.rent_price):''}" onblur="moneyMask(this)"></div></div><div class="third"><label>Condomínio</label><div class="money"><span>R$</span><input name="condo_fee" value="${p.condo_fee?money(p.condo_fee):''}" onblur="moneyMask(this)"></div></div><div class="third"><label>IPTU</label><div class="money"><span>R$</span><input name="iptu" value="${p.iptu?money(p.iptu):''}" onblur="moneyMask(this)"></div></div></div></section>
<section class="section"><h2>Características</h2><div class="grid"><div class="third"><label>Área (m²) *</label><input name="area" type="number" step="0.01" required value="${p.area??''}"></div><div class="third"><label>Dormitórios</label>${counter('bedrooms',p.bedrooms)}</div><div class="third"><label>Suítes</label>${counter('suites',p.suites)}</div><div class="third"><label>Banheiros</label>${counter('bathrooms',p.bathrooms)}</div><div class="third"><label>Vagas</label>${counter('parking',p.parking)}</div></div><br><label>Características</label><div class="features">${['Mobiliado','Varanda','Churrasqueira','Piscina','Academia','Salão de festas','Playground','Elevador','Portaria 24h','Aceita pets'].map(f=>`<label class="check"><input name="feature" type="checkbox" value="${f}" ${(p.features||[]).includes(f)?'checked':''}>${f}</label>`).join('')}</div></section></div>
<div class="panel"><section class="section"><h2>Localização</h2><p class="muted">1. Digite o CEP. 2. O endereço será preenchido. 3. Digite o número. 4. O condomínio será pesquisado usando exatamente estes campos da tela.</p><div class="grid"><div class="half"><label>CEP *</label><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="cep" name="cep" required maxlength="9" inputmode="numeric" value="${esc(p.cep||'')}" oninput="cepMask(this)"><button type="button" class="btn blue" onclick="lookupCep()">Buscar CEP</button></div><div id="cepmsg" class="msg">Digite o CEP.</div></div><div class="half"><label>Estado</label><input id="state" name="state" maxlength="2" value="${esc(p.state||'')}"></div><div class="half"><label>Endereço *</label><input id="address" name="address" required value="${esc(p.address||'')}"></div><div class="half"><label>Número *</label><input id="number" name="number" required value="${esc(p.number||'')}" oninput="scheduleCondo()"></div><div class="half"><label>Complemento</label><input name="complement" value="${esc(p.complement||'')}"></div><div class="half"><label>Bairro *</label><input id="neighborhood" name="neighborhood" required value="${esc(p.neighborhood||'')}"></div><div class="half"><label>Cidade</label><input id="city" name="city" value="${esc(p.city||'São Paulo')}"></div><div class="full"><div class="condo"><div class="condo-head"><div><b>Condomínio</b><div class="muted">A pesquisa acontece antes de salvar.</div></div><button type="button" class="btn blue" onclick="identifyCondo(true)">Identificar condomínio</button></div><br><input id="condominium_name" name="condominium_name" placeholder="Será preenchido automaticamente" value="${esc(p.condominium_name||'')}"><div id="condomsg" class="msg"></div></div></div></div></section>
<section class="section"><h2>Descrição</h2><textarea id="description" name="description" placeholder="Digite ou gere a descrição...">${esc(p.description||'')}</textarea><br><button type="button" class="btn gray" onclick="generateDescription()">Gerar descrição automática</button></section>
<section class="section"><h2>Fotos</h2><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="pickFiles(this.files)"><div class="photos" id="photos"></div></section></div>
<div class="bottom"><button type="button" class="btn gray" onclick="document.getElementById('editor').innerHTML=''">Cancelar</button><button id="save" class="btn red">Salvar imóvel</button></div></form>`;renderPhotos();if(p.cep&&p.number)setTimeout(()=>identifyCondo(false),400)}
function cepMask(e){let s=e.value.replace(/\D/g,'').slice(0,8);e.value=s.length>5?s.slice(0,5)+'-'+s.slice(5):s}
async function lookupCep(){const cep=document.getElementById('cep').value.replace(/\D/g,'');const m=document.getElementById('cepmsg');if(cep.length!==8){m.textContent='Informe 8 dígitos.';m.className='msg err';return}m.textContent='Consultando CEP...';try{const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');const d=await r.json();if(d.erro)throw Error('CEP não encontrado.');document.getElementById('address').value=d.logradouro||'';document.getElementById('neighborhood').value=d.bairro||'';document.getElementById('city').value=d.localidade||'';document.getElementById('state').value=d.uf||'';m.textContent='✓ Endereço preenchido. Agora informe o número.';m.className='msg ok';scheduleCondo()}catch(e){m.textContent=e.message;m.className='msg err'}}
let condoTimer;
function scheduleCondo(){clearTimeout(condoTimer);condoTimer=setTimeout(()=>identifyCondo(false),500)}
function currentAddress(){const f=formEl();return{cep:String(f.elements.namedItem('cep')?.value||'').trim(),address:String(f.elements.namedItem('address')?.value||'').trim(),number:String(f.elements.namedItem('number')?.value||'').trim(),neighborhood:String(f.elements.namedItem('neighborhood')?.value||'').trim(),city:String(f.elements.namedItem('city')?.value||'').trim(),state:String(f.elements.namedItem('state')?.value||'').trim()}}
async function identifyCondo(force=false){const d=currentAddress();const msg=document.getElementById('condomsg');if(!d.address||!d.number){if(force){msg.textContent='Faltam dados: endereço='+ (d.address?'OK':'VAZIO') +' · número='+ (d.number?'OK':'VAZIO');msg.className='msg err';}return}msg.textContent='🔎 Pesquisando usando os campos atuais da tela...';msg.className='msg';try{const r=await fetch('/api/identify-condo.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha na pesquisa');if(j.condominium_name){document.getElementById('condominium_name').value=j.condominium_name;msg.innerHTML='✓ '+esc(j.condominium_name)+(j.confidence?' · confiança: '+esc(j.confidence):'')+'. '+esc(j.evidence||'');msg.className='msg ok'}else{msg.textContent='Não encontrei evidência suficiente. Preencha manualmente.';msg.className='msg err'}const features=j.features||[];document.querySelectorAll('input[name="feature"]').forEach(e=>{if(features.includes(e.value))e.checked=true})}catch(e){msg.textContent='Falha na pesquisa: '+e.message;msg.className='msg err'}}
function pickFiles(files){newFiles=[...files];renderPhotos()}
function renderPhotos(){const e=document.getElementById('photos');if(!e)return;e.innerHTML=storedPhotos.map((u,i)=>`<div class="photo"><img src="${esc(u)}"><button type="button" onclick="storedPhotos.splice(${i},1);renderPhotos()">×</button></div>`).join('')+newFiles.map((f,i)=>`<div class="photo"><img src="${URL.createObjectURL(f)}"><button type="button" onclick="newFiles.splice(${i},1);renderPhotos()">×</button></div>`).join('')}
async function uploadFiles(){const urls=[];for(const f of newFiles){const path='properties/'+(editId||crypto.randomUUID())+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const{error}=await DB.storage.from('property-photos').upload(path,f);if(error)throw error;urls.push(DB.storage.from('property-photos').getPublicUrl(path).data.publicUrl)}return urls}
function joinList(arr){const a=arr.filter(Boolean);if(!a.length)return'';if(a.length===1)return a[0];if(a.length===2)return a[0]+' e '+a[1];return a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function generateDescription(){const f=formEl();if(!f)return;const get=n=>String(f.elements.namedItem(n)?.value||'').trim();const tipo=get('property_type')||'imóvel';const area=get('area');const quartos=Number(get('bedrooms')||0);const suites=Number(get('suites')||0);const banheiros=Number(get('bathrooms')||0);const vagas=Number(get('parking')||0);const bairro=get('neighborhood');const cidade=get('city')||'São Paulo';const cond=get('condominium_name');const features=[...f.querySelectorAll('input[name="feature"]:checked')].map(e=>e.value);const venda=f.elements.namedItem('for_sale')?.checked;const locacao=f.elements.namedItem('for_rent')?.checked;const finalidade=venda&&locacao?'para venda e locação':locacao?'para locação':'à venda';const detalhes=[];if(area)detalhes.push(area+' m²');if(quartos)detalhes.push(quartos+' '+(quartos===1?'dormitório':'dormitórios'));if(suites)detalhes.push(suites+' '+(suites===1?'suíte':'suítes'));if(banheiros)detalhes.push(banheiros+' '+(banheiros===1?'banheiro':'banheiros'));if(vagas)detalhes.push(vagas+' '+(vagas===1?'vaga de garagem':'vagas de garagem'));if(!area&&!quartos&&!bairro&&!cond){toast('Preencha área, dormitórios, localização ou condomínio antes de gerar.','err');return}let p1='Excelente '+tipo+' '+finalidade+(detalhes.length?' com '+joinList(detalhes):'')+'.';if(bairro)p1+=' Localizado no bairro '+bairro+(cidade?', em '+cidade:'')+'.';else if(cidade)p1+=' Localizado em '+cidade+'.';let p2='O imóvel apresenta uma planta funcional e ambientes bem distribuídos, proporcionando conforto e praticidade para o dia a dia.';if(cond)p2+=' Está localizado no condomínio '+cond+'.';if(features.length)p2+=' O condomínio e/ou imóvel conta com '+joinList(features)+', oferecendo mais comodidade e opções de lazer e serviços aos moradores.';let p3='Uma excelente oportunidade para quem busca conforto, praticidade e uma localização estratégica.';document.getElementById('description').value=p1+'\n\n'+p2+'\n\n'+p3;toast('Descrição gerada automaticamente.','ok')}
async function saveProperty(ev){ev.preventDefault();const f=formEl(),btn=document.getElementById('save');btn.disabled=true;btn.textContent='Salvando...';try{const fd=new FormData(f),fs=fd.has('for_sale'),fr=fd.has('for_rent');if(!fs&&!fr)throw Error('Selecione Venda ou Locação.');const uploaded=await uploadFiles();const obj={title:fd.get('title'),code:fd.get('code')||null,transaction_type:fs?'sale':'rent',for_sale:fs,for_rent:fr,property_type:fd.get('property_type'),price:fs?moneyNumber(fd.get('price')):0,rent_price:fr?moneyNumber(fd.get('rent_price')):0,condo_fee:moneyNumber(fd.get('condo_fee')),iptu:moneyNumber(fd.get('iptu')),area:Number(fd.get('area')||0),bedrooms:Number(fd.get('bedrooms')||0),suites:Number(fd.get('suites')||0),bathrooms:Number(fd.get('bathrooms')||0),parking:Number(fd.get('parking')||0),neighborhood:fd.get('neighborhood'),city:fd.get('city')||null,state:fd.get('state')||null,cep:fd.get('cep')||null,address:fd.get('address'),number:fd.get('number'),complement:fd.get('complement')||null,condominium_name:fd.get('condominium_name')||null,description:fd.get('description')||'',features:fd.getAll('feature'),photos:[...storedPhotos,...uploaded]};const q=editId?await DB.from('properties').update(obj).eq('id',editId):await DB.from('properties').insert(obj);if(q.error)throw q.error;toast('Imóvel salvo com sucesso.','ok');editId='';await loadList();newProperty()}catch(e){toast('Erro ao salvar: '+e.message,'err')}finally{btn.disabled=false;btn.textContent='Salvar imóvel'}}
async function editProperty(id){const{data,error}=await DB.from('properties').select('*').eq('id',id).single();if(error)return toast(error.message,'err');newProperty(data);document.getElementById('editor').scrollIntoView({behavior:'smooth'})}
async function toggleProperty(id,published){const{error}=await DB.from('properties').update({published:!published}).eq('id',id);if(error)toast(error.message,'err');else loadList()}
async function deleteProperty(id){if(!confirm('Excluir este imóvel?'))return;const{error}=await DB.from('properties').delete().eq('id',id);if(error)toast(error.message,'err');else loadList()}
boot();
</script></body></html>
