<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Painel</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="panel" src="./painel-v4.html?v=20260910-description-validation" title="Painel VSN Imóveis"></iframe>
<script>
const frame=document.getElementById('panel');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    const originalFetch=w.fetch.bind(w);
    w.fetch=async function(input,init){
      let url=typeof input==='string'?input:(input&&input.url)||'';
      if(url.includes('/api/identify-condo.js')){
        const fixed=url.replace('/api/identify-condo.js','/api/identify-condo-fixed.js');
        if(typeof input==='string') input=fixed;
        else input=new w.Request(fixed,input);
      }
      return originalFetch(input,init);
    };

    // Validação antes de gerar a descrição: todos os campos relevantes do cadastro precisam estar preenchidos.
    const originalGenerate=w.generateDescription;
    if(typeof originalGenerate==='function'){
      w.generateDescription=function(){
        const f=d.getElementById('propertyForm');
        if(!f){return}
        const required=[
          ['title','Título'],
          ['code','Código'],
          ['property_type','Tipo de imóvel'],
          ['area','Área'],
          ['bedrooms','Dormitórios'],
          ['suites','Suítes'],
          ['bathrooms','Banheiros'],
          ['parking','Vagas'],
          ['cep','CEP'],
          ['state','Estado'],
          ['address','Endereço'],
          ['number','Número'],
          ['neighborhood','Bairro'],
          ['city','Cidade'],
          ['condominium_name','Condomínio']
        ];
        const missing=required.filter(([name])=>{
          const e=f.elements.namedItem(name);
          return !e || !String(e.value||'').trim();
        });
        const sale=f.elements.namedItem('for_sale')?.checked;
        const rent=f.elements.namedItem('for_rent')?.checked;
        if(!sale&&!rent){missing.push(['for_sale','Finalidade']);}
        if(sale&&!String(f.elements.namedItem('price')?.value||'').trim())missing.push(['price','Preço de venda']);
        if(rent&&!String(f.elements.namedItem('rent_price')?.value||'').trim())missing.push(['rent_price','Valor de locação']);
        if(missing.length){
          const names=missing.map(x=>x[1]).join(', ');
          if(typeof w.toast==='function')w.toast('Preencha todos os campos antes de gerar a descrição: '+names,'err');
          return;
        }
        return originalGenerate();
      };
    }
  }catch(e){console.error('Ajuste do painel:',e);}
});
</script>
</body>
</html>
