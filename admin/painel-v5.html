<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Painel</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="panel" src="./painel-v4.html?v=20260910-openai" title="Painel VSN Imóveis"></iframe>
<script>
const frame=document.getElementById('panel');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    const originalFetch=w.fetch.bind(w);
    w.fetch=async function(input,init){
      let url=typeof input==='string'?input:(input&&input.url)||'';
      if(url.includes('/api/identify-condo.js')){
        if(typeof input==='string') input=url.replace('/api/identify-condo.js','/api/identify-condo-fixed.js');
        else input=new w.Request(url.replace('/api/identify-condo.js','/api/identify-condo-fixed.js'),input);
      }
      return originalFetch(input,init);
    };

    // Geração automática de descrição dentro do painel usando a OpenAI API.
    w.generateDescription=async function(){
      if(!w.newFiles?.length&&!w.storedPhotos?.length){w.toast('Adicione fotos primeiro.','err');return}
      w.toast('Gerando descrição com IA...');
      try{
        let urls=[...(w.storedPhotos||[])];
        for(const file of (w.newFiles||[])){
          const path='tmp/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const up=await w.DB.storage.from('property-photos').upload(path,file);
          if(up.error)throw up.error;
          urls.push(w.DB.storage.from('property-photos').getPublicUrl(path).data.publicUrl);
        }
        const data={
          property_type:w.val('property_type'),
          area:w.val('area'),
          bedrooms:w.val('bedrooms'),
          suites:w.val('suites'),
          bathrooms:w.val('bathrooms'),
          parking:w.val('parking'),
          neighborhood:w.val('neighborhood'),
          condominium_name:w.val('condominium_name'),
          address:w.val('address')+', '+w.val('number')
        };
        const r=await originalFetch('/api/generate-description.js',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({images:urls,data})
        });
        const j=await r.json();
        if(!r.ok)throw Error(j.error||'Falha ao gerar descrição');
        const box=d.getElementById('description');
        if(box)box.value=j.description||'';
        w.toast('Descrição gerada automaticamente.','ok');
      }catch(e){w.toast('Falha ao gerar descrição: '+e.message,'err')}
    };

    const replaceButton=()=>{
      const b=[...d.querySelectorAll('button')].find(x=>(x.textContent||'').includes('Gerar descrição'));
      if(b){b.textContent='Gerar descrição com IA';b.title='Analisa automaticamente as fotos e preenche a descrição do imóvel.';}
    };
    replaceButton();
  }catch(e){
    console.error('Não foi possível aplicar os ajustes do painel:',e);
  }
});
</script>
</body>
</html>
