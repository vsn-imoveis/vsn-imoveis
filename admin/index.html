<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis | Painel</title><link rel="stylesheet" href="./admin.css"></head><body><div id="login" class="panel login"><h2>VSN Imóveis</h2><p>Acesso administrativo</p><form id="loginForm"><input id="email" type="email" value="vsnimoveis@gmail.com" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button><div id="loginError"></div></form></div><div id="app" hidden><header><b>VSN IMÓVEIS · PAINEL</b><button id="logout">Sair</button></header><main><section class="panel"><h2 id="formTitle">Novo imóvel</h2><form id="propertyForm"><input id="id" type="hidden"><label>Título<input id="title" required></label><div class="row"><label>Negócio<select id="transaction"><option value="sale">Venda</option><option value="rent">Locação</option></select></label><label>Tipo<select id="type"><option>Apartamento</option><option>Casa</option><option>Studio</option><option>Comercial</option><option>Terreno</option></select></label></div><div class="row"><label>Preço<input id="price" type="number" required></label><label>Código<input id="code"></label></div><div class="row"><label>Área<input id="area" type="number"></label><label>Quartos<input id="bedrooms" type="number"></label></div><div class="row"><label>Suítes<input id="suites" type="number"></label><label>Vagas<input id="parking" type="number"></label></div><label>Bairro<input id="neighborhood"></label><label>Endereço<input id="address"></label><label>Descrição<textarea id="description"></textarea></label><label>Características<input id="features" placeholder="Piscina, academia, varanda"></label><label>Fotos (URLs)<textarea id="photos"></textarea></label><label>Vídeo<input id="video"></label><label><input id="featured" type="checkbox"> Destaque</label><label><input id="published" type="checkbox"> Publicar no site</label><button>Salvar imóvel</button><button type="button" id="clear">Limpar</button><div id="saveError"></div></form></section><section class="panel"><h2>Imóveis cadastrados</h2><div id="count"></div><div id="list"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./admin.js"></script></body></html>
