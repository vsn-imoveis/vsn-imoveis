<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Cadastro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--r:#d71920;--d:#171d24;--t:#202a33;--m:#68737d;--l:#dfe4e8;--bg:#f4f6f8;--g:#168044;--b:#1463d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{height:64px;background:var(--d);color:#fff;padding:0 4%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:18px}.wrap{max-width:1450px;margin:auto;padding:26px 20px 105px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:30px}.help{margin:0;color:var(--m);font-size:13px;line-height:1.4}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55}.red{background:var(--r);color:#fff}.blue{background:var(--b);color:#fff}.gray{background:#e9edf0;color:#27323c}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 28px #171d2412;overflow:hidden}.sec{padding:24px;border-bottom:1px solid var(--l)}.sh{display:flex;gap:11px;align-items:flex-start;margin-bottom:18px}.ico{width:36px;height:36px;border-radius:10px;background:#fff0f1;color:var(--r);display:grid;place-items:center;font-weight:900;flex:0 0 36px}.sh h2{margin:0 0 3px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.f{grid-column:span 6}.f3{grid-column:span 4}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.req{color:var(--r)}input,select,textarea{width:100%;height:46px;border:1px solid #cbd3da;border-radius:10px;padding:12px 13px;background:#fff;color:var(--t);font:inherit;outline:0}textarea{height:160px;resize:vertical}.money{display:flex}.money span{height:46px;padding:0 12px;display:flex;align-items:center;background:#f0f2f4;border:1px solid #cbd3da;border-right:0;border-radius:10px 0 0 10px;font-weight:800}.money input{border-radius:0 10px 10px 0}.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;gap:4px;border:1px solid var(--l);border-radius:10px;background:#f8fafb}.seg input{display:none}.seg label{text-align:center;margin:0;padding:10px;cursor:pointer}.seg input:checked+label{background:#fff;box-shadow:0 2px 7px #0001}.counter{height:58px;display:grid;grid-template-columns:50px 1fr 50px;border:1px solid #cbd3da;border-radius:12px;overflow:hidden}.counter button{border:0;background:#eef1f4;font-size:30px;cursor:pointer}.counter .plus{background:var(--r);color:#fff}.counter input{height:58px;border:0;border-radius:0;text-align:center;font-size:20px;font-weight:900}.counter-unit{text-align:center;font-size:11px;color:var(--m);font-weight:700;margin-top:5px}.addrmsg{font-size:12px;color:var(--m);margin-top:6px;min-height:17px}.addrmsg.ok{color:var(--g)}.addrmsg.warn{color:#9a6700}.condo-box{margin-top:14px;padding:14px;border:1px solid #d8e5ff;background:#f7faff;border-radius:12px}.condo-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.condo-result{margin-top:10px}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--l);border-radius:10px;padding:11px}.check input{width:18px;height:18px;padding:0}.upload{border:2px dashed #c8d0d7;border-radius:14px;padding:27px;text-align:center}.upload input{display:none}.upload-btn{display:inline-block;background:var(--r);color:#fff;padding:11px 18px;border-radius:9px;font-weight:800;cursor:pointer}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.photo{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:10px}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:29px;height:29px;background:#fff;color:#b42318;font-size:18px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fffffff2;border-top:1px solid var(--l);padding:12px 20px;display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;right:20px;bottom:78px;z-index:50;background:var(--d);color:#fff;padding:13px 16px;border-radius:10px;display:none;max-width:430px}.toast.show{display:block}.toast.ok{background:var(--g)}.toast.err{background:#b42318}@media(max-width:950px){.layout{grid-template-columns:1fr}}@media(max-width:650px){.f,.f3{grid-column:1/-1}.feature-grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}} </style></head>
<body><header class="top"><div class="brand">VSN IMÓVEIS</div><div id="user"></div></header><main class="wrap" id="app"></main><div id="toast" class="toast"></div>
<script>
const SUPA='https://jpdfynaioepcmgqlqlht.supabase.co', KEY='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03', db=supabase.createClient(SUPA,KEY);let editId='',photos=[],selected=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(sel,root=document)=>root.querySelector(sel), $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
function toast(t,c=''){const e=$('#toast');e.textContent=t;e.className='toast show '+c;setTimeout(()=>e.className='toast',5000)}
function fmt(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyMask(e){let s=String(e.value||'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'');let n=Number(s);if(Number.isFinite(n))e.value=fmt(n)}
function moneyVal(v){return Number(String(v||'').replace(/\./g,'').replace(',','.'))||0}
function field(form,name){return form?.elements?.namedItem(name)||$(`[name="${name}"]`,form||document)}
function val(form,name){return String(field(form,name)?.value||'').trim()}
async function boot(){const{data:{session}}=await db.auth.getSession();session?show(session):login()}
function login(){app.innerHTML='<div class="panel" style="max-width:430px;margin:80px auto"><section class="sec"><h1>Área administrativa</h1><p class="help">Entre com seu e-mail e senha.</p><br><label>E-mail</label><input id="em" type="email" value="wm.vinicius@hotmail.com"><br><label>Senha</label><input id="pw" type="password"><br><br><button class="btn red" onclick="go()">Entrar</button><p id="msg" class="help"></p></section></div>'}
async function go(){const m=$('#msg');m.textContent='Entrando...';const{data,error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)m.textContent=error.message;else show(data.session)}
async function show(s){$('#user').textContent=s.user.email;app.innerHTML='<div class="head"><div><h1>Novo imóvel</h1><p class="help">O condomínio será pesquisado usando os campos que estão preenchidos na tela, antes de salvar.</p></div><button class="btn gray" onclick="db.auth.signOut()">Sair</button></div><div id="list"></div><div id="form"></div>';load()}
async function load(){const{data,error}=await db.from('properties').select('*').order('created_at',{ascending:false});if(error){$('#list').textContent=error.message;return}$('#list').innerHTML='<div class="panel"><section class="sec"><div style="display:flex;justify-content:space-between"><div><b>Imóveis cadastrados</b><div class="help">'+data.length+' imóvel(is)</div></div><button class="btn red" onclick="newProp()">+ Novo imóvel</button></div>'+data.map(x=>'<div style="border-top:1px solid var(--l);padding:12px 0"><b>'+esc(x.title)+'</b><br><small>'+esc(x.neighborhood||'')+' · '+(x.published?'Publicado':'Rascunho')+'</small><br><button class="btn gray" onclick="edit(\''+x.id+'\')">Editar</button> <button class="btn gray" onclick="toggle(\''+x.id+'\')">'+(x.published?'Despublicar':'Publicar')+'</button></div>').join('')+'</section></div>'}
function ctr(name,v,label){return '<div><div class="counter"><button type="button" onclick="adj(\''+name+'\',-1)">−</button><input id="c-'+name+'" name="'+name+'" type="number" min="0" value="'+(v??0)+'"><button type="button" class="plus" onclick="adj(\''+name+'\',1)">+</button></div><div class="counter-unit">'+label+'</div></div>'}
function adj(name,d){const i=$('#c-'+name);if(i)i.value=Math.max(0,(parseInt(i.value)||0)+d)}
function newProp(x={}){editId=x.id||'';photos=[...(x.photos||[])];selected=[];$('#form').innerHTML='<form id="propertyForm" onsubmit="save(event)"><div class="layout"><div class="panel"><section class="sec"><div class="sh"><div class="ico">1</div><div><h2>Dados do imóvel</h2><p class="help">Informações básicas.</p></div></div><div class="grid"><div class="f"><label>Título *</label><input name="title" required value="'+esc(x.title)+'"></div><div class="f"><label>Código</label><input name="code" value="'+esc(x.code)+'"></div><div class="full"><label>Finalidade *</label><div class="seg"><input id="sale" type="checkbox" name="for_sale" '+((x.for_sale??x.transaction_type!=='rent')?'checked':'')+'><label for="sale">Venda</label><input id="rent" type="checkbox" name="for_rent" '+((x.for_rent??x.transaction_type==='rent')?'checked':'')+'><label for="rent">Locação</label></div></div><div class="f"><label>Tipo</label><select name="property_type"><option>Apartmento</option><option '+(x.property_type==='Casa'?'selected':'')+'>Casa</option><option '+(x.property_type==='Studio'?'selected':'')+'>Studio</option><option '+(x.property_type==='Cobertura'?'selected':'')+'>Cobertura</option><option '+(x.property_type==='Terreno'?'selected':'')+'>Terreno</option></select></div></div></section><section class="sec"><h2>Valores</h2><div class="grid"><div class="f3"><label>Venda</label><div class="money"><span>R$</span><input name="price" value="'+(x.price?fmt(x.price):'')+'" onblur="moneyMask(this)"></div></div><div class="f3"><label>Locação</label><div class="money"><span>R$</span><input name="rent_price" value="'+(x.rent_price?fmt(x.rent_price):'')+'" onblur="moneyMask(this)"></div></div><div class="f3"><label>Condomínio</label><div class="money"><span>R$</span><input name="condo_fee" value="'+(x.condo_fee?fmt(x.condo_fee):'')+'" onblur="moneyMask(this)"></div></div><div class="f3"><label>IPTU</label><div class="money"><span>R$</span><input name="iptu" value="'+(x.iptu?fmt(x.iptu):'')+'" onblur="moneyMask(this)"></div></div></div></section><section class="sec"><h2>Características</h2><div class="grid"><div class="f3"><label>Área (m²) *</label><input name="area" type="number" step="0.01" min="0" required value="'+(x.area??'')+'"></div><div class="f3"><label>Dormitórios</label>'+ctr('bedrooms',x.bedrooms,'dormitórios')+'</div><div class="f3"><label>Suítes</label>'+ctr('suites',x.suites,'suítes')+'</div><div class="f3"><label>Banheiros</label>'+ctr('bathrooms',x.bathrooms,'banheiros')+'</div><div class="f3"><label>Vagas</label>'+ctr('parking',x.parking,'vagas')+'</div></div><div style="margin-top:18px"><label>Características</label><div class="feature-grid">'+['Mobiliado','Varanda','Churrasqueira','Piscina','Academia','Salão de festas','Playground','Elevador','Portaria 24h','Aceita pets'].map(a=>'<label class="check"><input type="checkbox" name="feature" value="'+a+'" '+((x.features||[]).includes(a)?'checked':'')+'>'+a+'</label>').join('')+'</div></div></section></div><div class="panel"><section class="sec"><div class="sh"><div class="ico">⌖</div><div><h2>Localização</h2><p class="help">Preencha o CEP. O sistema usa os valores atuais dos campos abaixo para pesquisar o condomínio.</p></div></div><div class="grid"><div class="f"><label>CEP *</label><div style="display:grid;grid-template-columns:1fr auto;gap:9px"><input id="cep" name="cep" required maxlength="9" value="'+esc(x.cep||'')+'" oninput="cepMask(this)"><button type="button" class="btn blue" onclick="lookupCep()">Buscar CEP</button></div><div id="cepmsg" class="addrmsg">Digite o CEP.</div></div><div class="f"><label>Estado</label><input id="state" name="state" value="'+esc(x.state||'')+'"></div><div class="f"><label>Endereço *</label><input id="address" name="address" required value="'+esc(x.address||'')+'"></div><div class="f"><label>Número *</label><input id="number" name="number" required value="'+esc(x.number||'')+'" onblur="autoCondo()"></div><div class="f"><label>Complemento</label><input id="complement" name="complement" value="'+esc(x.complement||'')+'"></div><div class="f"><label>Bairro *</label><input id="neighborhood" name="neighborhood" required value="'+esc(x.neighborhood||'')+'"></div><div class="f"><label>Cidade</label><input id="city" name="city" value="'+esc(x.city||'São Paulo')+'"></div><div class="full"><div class="condo-box"><div class="condo-head"><div><b>Condomínio</b><div class="help">Será preenchido a partir dos campos acima, mesmo antes de salvar o imóvel.</div></div><button type="button" class="btn blue" onclick="identifyCondo(true)">Identificar condomínio</button></div><div style="margin-top:12px"><input id="condominium_name" name="condominium_name" placeholder="Será preenchido automaticamente" value="'+esc(x.condominium_name||'')+'"></div><div id="condomsg" class="condo-result help"></div></div></div></div></section><section class="sec"><h2>Descrição</h2><textarea name="description" id="description">'+esc(x.description||'')+'</textarea></section><section class="sec"><h2>Fotos</h2><div class="upload"><b>Selecione as fotos</b><p class="help">JPG, PNG ou WEBP · até 10 MB por foto</p><label class="upload-btn">Escolher fotos<input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple onchange="pick(this.files)"></label></div><div id="photos" class="photos"></div></section></div></div><div class="bottom"><button type="button" class="btn gray" onclick="cancelForm()">Cancelar</button><button id="savebtn" class="btn red">Salvar imóvel</button></div></form>';renderPhotos();$('#form').scrollIntoView({behavior:'smooth'});if(x.cep&&x.number)setTimeout(autoCondo,300)}
function cepMask(i){let v=i.value.replace(/\D/g,'').slice(0,8);i.value=v.length>5?v.slice(0,5)+'-'+v.slice(5)}
async function lookupCep(){const f=$('#propertyForm'),cep=val(f,'cep'),m=$('#cepmsg');if(cep.replace(/\D/g,'').length!==8){m.textContent='Informe um CEP com 8 dígitos.';m.className='addrmsg warn';return}m.textContent='Consultando CEP...';try{const r=await fetch('https://viacep.com.br/ws/'+cep.replace(/\D/g,'')+'/json/');const d=await r.json();if(d.erro)throw Error('CEP não encontrado.');field(f,'address').value=d.logradouro||'';field(f,'neighborhood').value=d.bairro||'';field(f,'city').value=d.localidade||'';field(f,'state').value=d.uf||'';m.textContent='✓ Endereço preenchido pelo CEP.';m.className='addrmsg ok';setTimeout(autoCondo,150)}catch(e){m.textContent=e.message;m.className='addrmsg warn'}}
function addressData(){const f=$('#propertyForm');return{cep:val(f,'cep'),address:val(f,'address'),number:val(f,'number'),neighborhood:val(f,'neighborhood'),city:val(f,'city'),state:val(f,'state')}}
function autoCondo(){const d=addressData();if(d.address&&d.number)identifyCondo(false)}
async function identifyCondo(force=false){const d=addressData(),msg=$('#condomsg');if(!d.address||!d.number){if(force)toast('Preencha os campos Endereço e Número acima antes de pesquisar.','err');return}msg.textContent='🔎 Pesquisando o condomínio com os dados que estão na tela...';try{const r=await fetch('/api/identify-condo.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha na pesquisa');if(j.condominium_name){field($('#propertyForm'),'condominium_name').value=j.condominium_name;msg.innerHTML='✓ Condomínio identificado'+(j.confidence?' · confiança: <b>'+esc(j.confidence)+'</b>':'')+'. '+esc(j.evidence||'')}else msg.textContent='Não encontrei evidência suficiente. Você pode preencher manualmente.';$$('input[name="feature"]',$('#propertyForm')).forEach(i=>{if((j.features||[]).includes(i.value))i.checked=true})}catch(e){msg.textContent='Não foi possível pesquisar agora: '+e.message}}
function pick(files){selected=[...files];renderPhotos()}
function renderPhotos(){const e=$('#photos');if(!e)return;e.innerHTML=selected.map((f,i)=>'<div class="photo"><img src="'+URL.createObjectURL(f)+'"><button type="button" onclick="selected.splice('+i+',1);renderPhotos()">×</button></div>').join('')}
async function uploadSelected(){let urls=[];for(const f of selected){const path='properties/'+(editId||crypto.randomUUID())+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const{error}=await db.storage.from('property-photos').upload(path,f,{upsert:false});if(error)throw error;urls.push(db.storage.from('property-photos').getPublicUrl(path).data.publicUrl)}return urls}
async function save(ev){ev.preventDefault();const f=$('#propertyForm'),btn=$('#savebtn'),sale=f.elements.for_sale.checked,rent=f.elements.for_rent.checked;if(!sale&&!rent)return toast('Selecione Venda ou Locação.','err');btn.disabled=true;btn.textContent='Salvando...';try{const obj={title:val(f,'title'),code:val(f,'code')||null,transaction_type:sale?'sale':'rent',for_sale:sale,for_rent:rent,property_type:val(f,'property_type'),price:sale?moneyVal(val(f,'price')):0,rent_price:rent?moneyVal(val(f,'rent_price')):0,condo_fee:moneyVal(val(f,'condo_fee')),iptu:moneyVal(val(f,'iptu')),area:Number(val(f,'area')||0),bedrooms:Number(val(f,'bedrooms')||0),suites:Number(val(f,'suites')||0),bathrooms:Number(val(f,'bathrooms')||0),parking:Number(val(f,'parking')||0),neighborhood:val(f,'neighborhood'),city:val(f,'city'),state:val(f,'state'),cep:val(f,'cep'),address:val(f,'address'),number:val(f,'number'),complement:val(f,'complement')||null,condominium_name:val(f,'condominium_name')||null,description:val(f,'description'),features:f.elements.feature?[...f.elements.feature].filter(x=>x.checked).map(x=>x.value):[],photos:[...photos,...await uploadSelected()]};const q=editId?await db.from('properties').update(obj).eq('id',editId):await db.from('properties').insert(obj);if(q.error)throw q.error;toast('Imóvel salvo com sucesso.','ok');editId='';selected=[];await load();$('#form').innerHTML=''}catch(e){toast('Erro ao salvar: '+e.message,'err');btn.disabled=false;btn.textContent='Salvar imóvel'}}
async function edit(id){const{data,error}=await db.from('properties').select('*').eq('id',id).single();if(error)return toast(error.message,'err');newProp(data)}async function toggle(id){const{data}=await db.from('properties').select('published').eq('id',id).single();await db.from('properties').update({published:!data.published}).eq('id',id);load()}function cancelForm(){$('#form').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}boot();
</script></body></html>
