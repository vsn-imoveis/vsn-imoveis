<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="panel" src="./painel-v6.html?v=20260910-structural-v1" title="Painel VSN Imóveis"></iframe><script>
const frame=document.getElementById('panel');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;const original=w.identifyCondo;if(typeof original!=='function')return;
w.identifyCondo=async function(){
 await original.apply(this,arguments);
 const f=d.getElementById('propertyForm');if(!f)return;
 const get=n=>String(f.elements.namedItem(n)?.value||'').trim();
 const address=get('address'),number=get('number');if(!address||!number)return;
 try{
  const r=await fetch('/api/identify-condo-structural.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,number,cep:get('cep'),neighborhood:get('neighborhood'),city:get('city'),state:get('state')})});
  const j=await r.json();if(!r.ok)return;
  const set=(n,v)=>{const e=f.elements.namedItem(n);if(e&&v!==null&&v!==undefined&&String(v)!=='')e.value=v};
  set('condominium_builder',j.condominium_builder);set('condominium_delivery_year',j.condominium_delivery_year);set('condominium_units',j.condominium_units);set('condominium_land_area',j.condominium_land_area);
  if(j.towers!==null&&j.towers!==undefined){let e=f.elements.namedItem('condominium_towers');if(e)e.value=j.towers}
  if(typeof w.toast==='function'&&(j.condominium_builder||j.condominium_delivery_year||j.condominium_units||j.condominium_land_area))w.toast('Dados estruturais do condomínio preenchidos automaticamente.','ok');
 }catch(e){console.warn('Dados estruturais do condomínio:',e)}
};
}catch(e){console.error('Painel VSN:',e)}});
</script></body></html>
