function switchProfileTab(tab){
  document.querySelectorAll('[data-profile-tab]').forEach(b=>b.classList.toggle('active',b.dataset.profileTab===tab));
  document.getElementById('profileTab')?.classList.toggle('active',tab==='profile');
  document.getElementById('adminTab')?.classList.toggle('active',tab==='admin');
  document.getElementById('siteTab')?.classList.toggle('active',tab==='site');
  if(currentProfile?.role!=='admin' && tab!=='profile')return;
  if(tab==='admin') loadUserAdmin();
  if(tab==='site') loadSiteProfile();
}
function previewSitePhoto(e){const file=e.target.files?.[0];if(!file)return;if(file.size>8*1024*1024){toast('A foto deve ter no máximo 8 MB.','err');e.target.value='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use JPG, PNG ou WebP.','err');e.target.value='';return}const img=document.getElementById('sitePhotoPreview');if(img){img.src=URL.createObjectURL(file);img.style.display='block'}}
function previewProfilePhoto(e){
  const file=e.target.files?.[0];if(!file)return;
  if(file.size>8*1024*1024){toast('A foto deve ter no máximo 8 MB.','err');e.target.value='';return}
  document.getElementById('profilePhotoName').textContent=file.name;
  const url=URL.createObjectURL(file);
  const old=document.getElementById('profilePhotoPreview');
  if(old.tagName==='IMG'){old.src=url}else{const img=document.createElement('img');img.id='profilePhotoPreview';img.className='profile-photo';img.src=url;old.replaceWith(img)}
}
async function saveProfile(){
  const {data:{user}}=await S.auth.getUser();if(!user)return;
  const btn=document.querySelector('#profileContent .profile-actions .red');if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  try{
    let avatar=currentProfile?.avatar_url||'';
    const file=document.getElementById('profilePhoto')?.files?.[0];
    if(file){
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path=user.id+'/'+Date.now()+'.'+ext;
      const up=await S.storage.from('profile-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:true});
      if(up.error)throw up.error;
      avatar=S.storage.from('profile-photos').getPublicUrl(path).data.publicUrl;
    }
    const row={full_name:document.getElementById('profileName').value.trim(),phone:document.getElementById('profilePhone').value.trim(),cpf_cnpj:document.getElementById('profileCpfCnpj').value.trim(),creci:document.getElementById('profileCreci')?.value.trim()||'',company:document.getElementById('profileCompany').value.trim(),bio:document.getElementById('profileBio').value.trim(),avatar_url:avatar,updated_at:new Date().toISOString()};
    const {data:saved,error}=await S.from('profiles').update(row).eq('id',user.id).select('id,role,user_type,full_name,phone,cpf_cnpj,creci,company,bio,avatar_url,updated_at').maybeSingle();if(error)throw error;if(!saved)throw new Error('Perfil não encontrado para este usuário.');
    currentProfile={...currentProfile,...row};await loadProfileSummary(user);toast('Perfil atualizado com sucesso.','ok');closeProfile();
  }catch(e){toast('Não foi possível salvar o perfil: '+(e.message||e),'err');if(btn){btn.disabled=false;btn.textContent='Salvar perfil'}}
}

async function loadUserAdmin(){
  const el=document.getElementById('usersContent');if(!el)return;
  el.innerHTML='<p class="muted">Carregando usuários...</p>';
  const [ur,pr]=await Promise.all([S.rpc('admin_list_users'),S.from('permissions').select('key,label,description,category').order('category').order('label')]);
  if(ur.error||pr.error){el.innerHTML='<p class="danger">Não foi possível carregar usuários e permissões: '+esc((ur.error||pr.error).message)+'</p>';return}
  adminUsers=ur.data||[];adminPermissions=pr.data||[];
  const up=await S.from('user_permissions').select('user_id,permission_key,allowed');
  if(up.error){el.innerHTML='<p class="danger">Não foi possível carregar as permissões individuais: '+esc(up.error.message)+'</p>';return}
  const overrides={};(up.data||[]).forEach(x=>{(overrides[x.user_id]||(overrides[x.user_id]={}))[x.permission_key]=x.allowed});
  window.__adminOverrides=overrides;
  renderUserAdmin();
}
function renderUserAdmin(){
  const el=document.getElementById('usersContent');if(!el)return;
  if(!adminUsers.length){el.innerHTML='<p class="muted">Nenhum usuário encontrado.</p>';return}
  el.innerHTML=adminUsers.map(u=>{
    const ov=window.__adminOverrides?.[u.id]||{};
    const roleLabel=u.role==='admin'?'Administrador':u.role==='proprietario'?'Proprietário':'Corretor';
    const avatar=u.avatar_url?'<img class="user-admin-avatar" src="'+esc(u.avatar_url)+'" alt="">':'<div class="user-admin-avatar">'+esc((u.full_name||u.email||'U').trim().charAt(0).toUpperCase())+'</div>';
    const perms=adminPermissions.map(p=>{const v=Object.prototype.hasOwnProperty.call(ov,p.key)?(ov[p.key]?'allow':'deny'):'inherit';return '<div class="permission-item"><div><span>'+esc(p.label)+'</span><small>'+esc(p.description||'')+'</small></div><select data-user="'+esc(u.id)+'" data-perm="'+esc(p.key)+'"><option value="inherit" '+(v==='inherit'?'selected':'')+'>Herdar função</option><option value="allow" '+(v==='allow'?'selected':'')+'>Permitir</option><option value="deny" '+(v==='deny'?'selected':'')+'>Bloquear</option></select></div>'}).join('');
    return '<div class="user-admin-card" data-user-card="'+esc(u.id)+'"><div class="user-admin-head"><div class="user-admin-ident">'+avatar+'<div><div class="user-admin-name">'+esc(u.full_name||'Usuário sem nome')+'</div><div class="user-admin-email">'+esc(u.email||'')+'</div></div></div><select class="user-admin-role" data-role-user="'+esc(u.id)+'" '+(u.id===currentProfile?.id?'disabled':'')+'><option value="corretor" '+(u.role==='corretor'?'selected':'')+'>Corretor</option><option value="proprietario" '+(u.role==='proprietario'?'selected':'')+'>Proprietário</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>Administrador</option></select></div><div class="permission-grid">'+perms+'</div><button class="red users-save" onclick="saveUserPermissions(\''+esc(u.id)+'\')">Salvar permissões</button></div>';
  }).join('');
}
async function saveUserPermissions(userId){
  const card=document.querySelector('[data-user-card="'+CSS.escape(userId)+'"]');if(!card)return;
  const btn=card.querySelector('.users-save');if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  try{
    const roleSel=card.querySelector('[data-role-user="'+CSS.escape(userId)+'"]');
    const target=adminUsers.find(x=>x.id===userId);if(!target)throw new Error('Usuário não encontrado.');
    if(roleSel&&!roleSel.disabled&&roleSel.value!==target.role){
      const r=await S.from('profiles').update({role:roleSel.value}).eq('id',userId);
      if(r.error)throw r.error;
    }
    for(const sel of card.querySelectorAll('select[data-perm]')){
      const key=sel.dataset.perm,val=sel.value;
      if(val==='inherit'){
        const r=await S.from('user_permissions').delete().eq('user_id',userId).eq('permission_key',key);if(r.error)throw r.error;
      }else{
        const r=await S.from('user_permissions').upsert({user_id:userId,permission_key:key,allowed:val==='allow'},{onConflict:'user_id,permission_key'});if(r.error)throw r.error;
      }
    }
    toast('Usuário atualizado com sucesso.','ok');await loadUserAdmin();
  }catch(e){toast('Não foi possível salvar: '+(e.message||e),'err');if(btn){btn.disabled=false;btn.textContent='Salvar permissões'}}
}

async function loadSiteProfile(){
  if(currentProfile?.role!=='admin')return;
  const {data,error}=await S.from('site_settings').select('*').eq('id',true).maybeSingle();
  if(error){toast('Não foi possível carregar o perfil do site: '+error.message,'err');return}
  const map={siteName:'site_name',siteLogoUrl:'logo_url',sitePhone:'phone',siteWhatsapp:'whatsapp',siteEmail:'email',siteCreci:'creci',siteInstagram:'instagram',siteFacebook:'facebook',siteYoutube:'youtube',siteAddress:'address',siteAbout:'about'};
  Object.keys(map).forEach(id=>{const el=document.getElementById(id);if(el)el.value=(data&&data[map[id]])||''}); const p=document.getElementById('sitePhotoPreview'); if(p&&data?.site_photo_url){p.src=data.site_photo_url;p.style.display='block'}
}
async function saveSiteProfile(){
  if(currentProfile?.role!=='admin')return;
  const btn=document.querySelector('#siteTab .profile-actions .red');
  if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  try{
    const current=await S.from('site_settings').select('site_photo_url').eq('id',true).maybeSingle();
    if(current.error)throw current.error;
    let sitePhotoUrl=current.data?.site_photo_url||null;
    const file=document.getElementById('sitePhotoFile')?.files?.[0];
    if(file){
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path='site/'+Date.now()+'.'+ext;
      const up=await S.storage.from('site-assets').upload(path,file,{contentType:file.type||'image/jpeg',upsert:true});
      if(up.error)throw up.error;
      sitePhotoUrl=S.storage.from('site-assets').getPublicUrl(path).data.publicUrl;
    }
    const row={id:true,site_name:document.getElementById('siteName')?.value.trim()||'VSN Imóveis',logo_url:document.getElementById('siteLogoUrl')?.value.trim()||null,site_photo_url:sitePhotoUrl,phone:document.getElementById('sitePhone')?.value.trim()||null,whatsapp:document.getElementById('siteWhatsapp')?.value.trim()||null,email:document.getElementById('siteEmail')?.value.trim()||null,creci:document.getElementById('siteCreci')?.value.trim()||null,instagram:document.getElementById('siteInstagram')?.value.trim()||null,facebook:document.getElementById('siteFacebook')?.value.trim()||null,youtube:document.getElementById('siteYoutube')?.value.trim()||null,address:document.getElementById('siteAddress')?.value.trim()||null,about:document.getElementById('siteAbout')?.value.trim()||null,updated_at:new Date().toISOString()};
    const {data:saved,error}=await S.from('site_settings').update(row).eq('id',true).select('*').maybeSingle();
    if(error)throw error;
    if(!saved)throw new Error('Configuração do site não encontrada.');
    toast('Perfil do site atualizado com sucesso.','ok');
  }catch(error){
    toast('Não foi possível salvar: '+(error.message||error),'err');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Salvar perfil do site'}
  }
}
function closeProfile(){document.getElementById('profileModal')?.classList.remove('open')}
function viewProperty(id){if(!id)return;window.open('/imovel.html?id='+encodeURIComponent(id),'_blank','noopener,noreferrer')}function goCadastro(){window.location.href='painel-cadastro.html'}
function newProp(x={}){editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<div class="card"><h2>'+ (x.id?'Editar':'Novo') +' imóvel</h2><form onsubmit="save(event,\''+(x.id||'')+'\')"><div class="grid"><div><label>Título</label><input name="title" required value="'+esc(x.title)+'"></div><div><label>Código</label><input name="code" value="'+esc(x.code)+'"></div><div><label>Finalidade</label><select name="transaction_type"><option value="sale" '+(x.transaction_type!=='rent'?'selected':'')+'>Venda</option><option value="rent" '+(x.transaction_type==='rent'?'selected':'')+'>Locação</option></select></div><div><label>Tipo</label><input name="property_type" value="'+esc(x.property_type||'Apartamento')+'"></div><div><label>Preço</label><input name="price" type="number" step="0.01" value="'+(x.price||'')+'" required></div><div><label>Condomínio</label><input name="condo_fee" type="number" step="0.01" value="'+(x.condo_fee||'')+'"></div><div><label>IPTU</label><input name="iptu" type="number" step="0.01" value="'+(x.iptu||'')+'"></div><div><label>Área m²</label><input name="area" type="number" step="0.01" value="'+(x.area||'')+'"></div><div><label>Dormitórios</label><input name="bedrooms" type="number" value="'+(x.bedrooms||'')+'"></div><div><label>Suítes</label><input name="suites" type="number" value="'+(x.suites||'')+'"></div><div><label>Vagas</label><input name="parking" type="number" value="'+(x.parking||'')+'"></div><div><label>Bairro</label><input name="neighborhood" required value="'+esc(x.neighborhood)+'"></div><div class="full"><label>Endereço</label><input name="address" value="'+esc(x.address)+'"></div><div class="full"><label>Descrição</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="full"><label>Características — uma por linha</label><textarea name="features">'+esc((x.features||[]).join('\n'))+'</textarea></div><div class="full"><label>Fotos do imóvel</label><div class="upload"><label for="photoFiles">📷 Escolher fotos do PC ou celular</label><input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple onchange="pickPhotos(event)"><p class="muted">Você pode selecionar várias fotos de uma vez. JPG, PNG, WEBP ou HEIC — até 10 MB cada.</p><div id="progress" class="progress" style="display:none"><i></i></div></div><div id="photosPreview" class="photos"></div><input type="hidden" name="photos"></div><div class="full"><label>Vídeo URL (opcional)</label><input name="video_url" value="'+esc(x.video_url)+'"></div></div><p><label><input type="checkbox" name="featured" style="width:auto" '+(x.featured?'checked':'')+'> Destaque</label> <label><input type="checkbox" name="published" style="width:auto" '+(x.id?(x.published?'checked':''):'checked')+'> Publicado</label></p><button class="red" id="saveBtn">Salvar imóvel</button></form></div>';renderPhotos()}function edit(id){window.location.href='painel-cadastro.html?id='+encodeURIComponent(id)}function pickPhotos(e){selectedFiles=[...e.target.files];const preview=document.getElementById('photosPreview');preview.innerHTML='';selectedFiles.forEach((file,i)=>{const u=URL.createObjectURL(file);const d=document.createElement('div');d.className='photo';d.innerHTML='<img src="'+u+'"><button type="button" onclick="removeSelected('+i+')">×</button>';preview.appendChild(d)});if(selectedFiles.length)document.getElementById('saveBtn').textContent='Enviar fotos e salvar imóvel'}function removeSelected(i){selectedFiles.splice(i,1);const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));document.getElementById('photoFiles').files=dt.files;pickPhotos({target:{files:dt.files}})}function renderPhotos(){const p=document.getElementById('photosPreview');if(!p)return;p.innerHTML=editingPhotos.map((url,i)=>'<div class="photo"><img src="'+esc(url)+'"><button type="button" onclick="removeExisting('+i+')">×</button></div>').join('')}function removeExisting(i){editingPhotos.splice(i,1);renderPhotos()}async function uploadPhotos(propertyId){if(!selectedFiles.length)return [];const urls=[];const progress=document.getElementById('progress'),bar=progress.querySelector('i');progress.style.display='block';for(let i=0;i<selectedFiles.length;i++){const file=selectedFiles[i];const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto');const path=propertyId+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const {error}=await S.storage.from('property-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;const {data}=S.storage.from('property-photos').getPublicUrl(path);urls.push(data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}async function save(e,id){e.preventDefault();const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';let f=new FormData(e.target),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{let r=id?await S.from('properties').update(row).eq('id',id).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const property=r.data;const newUrls=await uploadPhotos(property.id);if(newUrls.length){const allPhotos=[...editingPhotos,...newUrls];const up=await S.from('properties').update({photos:allPhotos}).eq('id',property.id);if(up.error)throw up.error}document.getElementById('form').innerHTML='<div class="card"><b>✓ Imóvel salvo com sucesso.</b></div>';selectedFiles=[];editingPhotos=[];await load()}catch(err){alert('Não foi possível salvar: '+err.message);btn.disabled=false;btn.textContent='Salvar imóvel'}}async function toggle(id){let x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;let x=items.find(x=>x.id===id);if(x&&x.photos&&x.photos.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}let r=await S.from('properties').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
