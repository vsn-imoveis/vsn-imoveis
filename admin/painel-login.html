<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel Administrativo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#171d24;--navy2:#202a33;--gold:#d3aa62;--gold-dark:#b78d48;--gold-soft:#f8f0e2;--text:#202a33;--muted:#68737d;--line:#e3e6e8;--bg:#f5f6f8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif}.top{height:68px;background:var(--navy);color:#fff;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(211,170,98,.35)}.brand{font-family:Montserrat,Arial,sans-serif;font-weight:800;letter-spacing:.08em}.user{font-size:13px;color:#d9dde1}.wrap{max-width:1280px;margin:auto;padding:30px 20px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.head h1{font-family:Montserrat,Arial,sans-serif;margin:0 0 5px;font-size:28px;color:var(--navy)}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(23,29,36,.06);margin-bottom:18px}button{border:0;border-radius:9px;padding:11px 16px;font:800 13px Manrope,Arial;cursor:pointer;transition:.15s}button.primary{background:var(--gold);color:var(--navy)}button.primary:hover{background:var(--gold-dark);color:#fff}button.secondary{background:#eef0f2;color:var(--navy)}button.danger{background:#fff0ef;color:#a52a25}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat strong{display:block;font-family:Montserrat;font-size:25px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#44515c}.field input,.field select{width:100%;height:44px;border:1px solid #d3d9de;border-radius:9px;padding:0 12px;font:14px Manrope;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(211,170,98,.14)}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.list-head h2{font-family:Montserrat;font-size:19px;margin:0;color:var(--navy)}.loading{color:var(--muted);padding:25px 0}.property{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid #edf0f2}.property:last-child{border-bottom:0}.thumb{width:92px;height:72px;border-radius:10px;overflow:hidden;background:#eef0f2}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.empty{display:grid;place-items:center;color:#9aa3ab;font-size:11px}.ptitle{font-weight:800;color:var(--navy);margin-bottom:5px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#eef0f2;color:#59636c}.badge.live{background:#e9f6ee;color:#16733e}.badge.off{background:#f0f1f2;color:#68737d}.price{text-align:right;font-weight:800;color:var(--navy);white-space:nowrap}.row-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.row-actions button{padding:8px 10px;font-size:11px}.empty-state{text-align:center;padding:45px 15px;color:var(--muted)}.error{color:#a52a25;background:#fff3f2;border:1px solid #f2cbc8;padding:12px;border-radius:9px}.login{max-width:440px;margin:70px auto}.login .bar{width:44px;height:4px;background:var(--gold);border-radius:4px;margin-bottom:22px}.login h1{font-family:Montserrat;color:var(--navy)}.login label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.login input{width:100%;height:48px;border:1px solid #d3d9de;border-radius:9px;padding:0 13px;font:15px Manrope;box-sizing:border-box}.login button{width:100%;margin-top:10px;height:48px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.actions{width:100%}}@media(max-width:600px){.wrap{padding:20px 12px}.top{padding:0 16px}.user{max-width:170px;overflow:hidden;text-overflow:ellipsis}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.property{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.price{grid-column:2;text-align:left}.row-actions{justify-content:flex-start}.property .actions-col{grid-column:2}.card{padding:17px;border-radius:14px}}</style></head><body><header class="top"><div class="brand">VSN IMÓVEIS</div><div class="user" id="user"></div></header><main class="wrap" id="app"></main><script>const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K);const A=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[];let filtered=[];let sessionUser=null;function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}function login(msg=''){A.innerHTML='<div class="card login"><div class="bar"></div><h1>Área administrativa</h1><p style="color:var(--muted)">Acesse o painel de imóveis da VSN Imóveis.</p><label>E-mail</label><input id="email" type="email" value="wm.vinicius@hotmail.com" autocomplete="username"><label>Senha</label><input id="password" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key===\\'Enter\\')enter()"><button class="primary" onclick="enter()">Entrar no painel</button><p id="msg" style="color:var(--muted)">'+esc(msg)+'</p></div>'}async function enter(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,m=document.getElementById('msg');m.textContent='Entrando...';const {data,error}=await S.auth.signInWithPassword({email:e,password:p});if(error){m.style.color='#a52a25';m.textContent='Não foi possível entrar: '+error.message;return}panel(data.session)}async function boot(){const {data:{session}}=await S.auth.getSession();session?panel(session):login()}async function panel(session){sessionUser=session;document.getElementById('user').textContent=session.user.email;A.innerHTML='<div class="head"><div><h1>Relatório de imóveis</h1><p>Visão geral dos imóveis cadastrados e publicados.</p></div><div class="actions"><button class="primary" onclick="window.location.href=&quot;painel-cadastro.html&quot;">+ Novo imóvel</button><button class="secondary" id="refreshBtn" onclick="load()">↻ Atualizar</button><button class="secondary" onclick="S.auth.signOut()">Sair</button></div></div><div class="stats"><div class="stat"><strong id="total">—</strong><span>Total de imóveis</span></div><div class="stat"><strong id="published">—</strong><span>Publicados</span></div><div class="stat"><strong id="drafts">—</strong><span>Rascunhos</span></div><div class="stat"><strong id="featured">—</strong><span>Em destaque</span></div></div><div class="card" style="margin-top:18px"><div class="filters"><div class="field search"><label>Buscar</label><input id="q" placeholder="Título, código, bairro ou cidade" oninput="applyFilters()"></div><div class="field"><label>Finalidade</label><select id="transaction" onchange="applyFilters()"><option value="">Todas</option><option value="sale">Venda</option><option value="rent">Locação</option></select></div><div class="field"><label>Status</label><select id="status" onchange="applyFilters()"><option value="">Todos</option><option value="published">Publicado</option><option value="draft">Rascunho</option></select></div><div class="field"><label>Tipo</label><select id="type" onchange="applyFilters()"><option value="">Todos</option></select></div><button class="secondary" onclick="clearFilters()">Limpar</button></div></div><div class="card"><div class="list-head"><h2>Lista de imóveis</h2><span id="count" class="meta"></span></div><div id="list" class="loading">Carregando imóveis...</div></div>';await load()}async function load(){const btn=document.getElementById('refreshBtn');if(btn){btn.disabled=true;btn.textContent='Atualizando...'}const list=document.getElementById('list');if(list)list.innerHTML='<div class="loading">Atualizando lista...</div>';const {data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error){if(list)list.innerHTML='<div class="error">'+esc(error.message)+'</div>';if(btn){btn.disabled=false;btn.textContent='↻ Atualizar'}return}items=data||[];document.getElementById('total').textContent=items.length;document.getElementById('published').textContent=items.filter(x=>x.published).length;document.getElementById('drafts').textContent=items.filter(x=>!x.published).length;document.getElementById('featured').textContent=items.filter(x=>x.featured).length;const types=[...new Set(items.map(x=>x.property_type).filter(Boolean))].sort();const sel=document.getElementById('type');if(sel)sel.innerHTML='<option value="">Todos</option>'+types.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('');applyFilters();if(btn){btn.disabled=false;btn.textContent='↻ Atualizar'}}function applyFilters(){const q=(document.getElementById('q')?.value||'').toLowerCase().trim(),tr=document.getElementById('transaction')?.value||'',st=document.getElementById('status')?.value||'',ty=document.getElementById('type')?.value||'';filtered=items.filter(x=>{const text=[x.title,x.code,x.neighborhood,x.city,x.address].filter(Boolean).join(' ').toLowerCase();return(!q||text.includes(q))&&(!tr||x.transaction_type===tr)&&(!st||(st==='published'?x.published:!x.published))&&(!ty||x.property_type===ty)});renderList()}function clearFilters(){['q','transaction','status','type'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});applyFilters()}function renderList(){const list=document.getElementById('list'),count=document.getElementById('count');if(!list)return;if(count)count.textContent=filtered.length+' imóvel(is)';if(!filtered.length){list.innerHTML='<div class="empty-state">Nenhum imóvel encontrado com os filtros selecionados.</div>';return}list.innerHTML=filtered.map(x=>{const photo=Array.isArray(x.photos)&&x.photos[0]?'<img src="'+esc(x.photos[0])+'" alt="">':'<div class="thumb empty">Sem foto</div>';const tx=x.transaction_type==='rent'?'Locação':'Venda';const status=x.published?'<span class="badge live">Publicado</span>':'<span class="badge off">Rascunho</span>';return '<div class="property"><div class="thumb">'+photo+'</div><div><div class="ptitle">'+esc(x.title||'Imóvel sem título')+'</div><div class="meta">'+esc(x.code||'Sem código')+' · '+esc(x.property_type||'Imóvel')+' · '+esc(x.neighborhood||'Sem bairro')+' · '+tx+' · '+money(x.price)+'</div><div class="badges">'+status+(x.featured?'<span class="badge">Destaque</span>':'')+'<span class="badge">'+(Array.isArray(x.photos)?x.photos.length:0)+' foto(s)</span></div></div><div class="actions-col"><div class="price">'+money(x.price)+'</div><div class="row-actions"><button class="secondary" onclick="editProp(\\''+x.id+'\\')">Editar</button><button class="'+(x.published?'danger':'primary')+'" onclick="toggle(\\''+x.id+'\\')">'+(x.published?'Despublicar':'Publicar')+'</button></div></div></div>'}).join('')}function editProp(id){window.location.href='painel-cadastro.html?id='+encodeURIComponent(id)}async function toggle(id){const x=items.find(i=>i.id===id);if(!x)return;const r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error){alert(r.error.message);return}await load()}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
