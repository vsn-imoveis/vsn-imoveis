function viewProperty(id){if(!id)return;window.open('imovel.html?id='+encodeURIComponent(id),'_blank','noopener,noreferrer')}function goCadastro(){window.location.href='painel-cadastro.html'}
function newProp(x={}){editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<div class="card"><h2>'+ (x.id?'Editar':'Novo') +' imóvel</h2><form onsubmit="save(event,\''+(x.id||'')+'\')"><div class="grid"><div><label>Título</label><input name="title" required value="'+esc(x.title)+'"></div><div><label>Código</label><input name="code" value="'+esc(x.code)+'"></div><div><label>Finalidade</label><select name="transaction_type"><option value="sale" '+(x.transaction_type!=='rent'?'selected':'')+'>Venda</option><option value="rent" '+(x.transaction_type==='rent'?'selected':'')+'>Locação</option></select></div><div><label>Tipo</label><input name="property_type" value="'+esc(x.property_type||'Apartamento')+'"></div><div><label>Preço</label><input name="price" type="number" step="0.01" value="'+(x.price||'')+'" required></div><div><label>Condomínio</label><input name="condo_fee" type="number" step="0.01" value="'+(x.condo_fee||'')+'"></div><div><label>IPTU</label><input name="iptu" type="number" step="0.01" value="'+(x.iptu||'')+'"></div><div><label>Área m²</label><input name="area" type="number" step="0.01" value="'+(x.area||'')+'"></div><div><label>Dormitórios</label><input name="bedrooms" type="number" value="'+(x.bedrooms||'')+'"></div><div><label>Suítes</label><input name="suites" type="number" value="'+(x.suites||'')+'"></div><div><label>Vagas</label><input name="parking" type="number" value="'+(x.parking||'')+'"></div><div><label>Bairro</label><input name="neighborhood" required value="'+esc(x.neighborhood)+'"></div><div class="full"><label>Endereço</label><input name="address" value="'+esc(x.address)+'"></div><div class="full"><label>Descrição</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="full"><label>Características — uma por linha</label><textarea name="features">'+esc((x.features||[]).join('\n'))+'</textarea></div><div class="full"><label>Fotos do imóvel</label><div class="upload"><label for="photoFiles">📷 Escolher fotos do PC ou celular</label><input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple onchange="pickPhotos(event)"><p class="muted">Você pode selecionar várias fotos de uma vez. JPG, PNG, WEBP ou HEIC — até 10 MB cada.</p><div id="progress" class="progress" style="display:none"><i></i></div></div><div id="photosPreview" class="photos"></div><input type="hidden" name="photos"></div><div class="full"><label>Vídeo URL (opcional)</label><input name="video_url" value="'+esc(x.video_url)+'"></div></div><p><label><input type="checkbox" name="featured" style="width:auto" '+(x.featured?'checked':'')+'> Destaque</label> <label><input type="checkbox" name="published" style="width:auto" '+(x.id?(x.published?'checked':''):'checked')+'> Publicado</label></p><button class="red" id="saveBtn">Salvar imóvel</button></form></div>';renderPhotos()}function edit(id){window.location.href='painel-cadastro.html?id='+encodeURIComponent(id)}function pickPhotos(e){selectedFiles=[...e.target.files];const preview=document.getElementById('photosPreview');preview.innerHTML='';selectedFiles.forEach((file,i)=>{const u=URL.createObjectURL(file);const d=document.createElement('div');d.className='photo';d.innerHTML='<img src="'+u+'"><button type="button" onclick="removeSelected('+i+')">×</button>';preview.appendChild(d)});if(selectedFiles.length)document.getElementById('saveBtn').textContent='Enviar fotos e salvar imóvel'}function removeSelected(i){selectedFiles.splice(i,1);const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));document.getElementById('photoFiles').files=dt.files;pickPhotos({target:{files:dt.files}})}function renderPhotos(){const p=document.getElementById('photosPreview');if(!p)return;p.innerHTML=editingPhotos.map((url,i)=>'<div class="photo"><img src="'+esc(url)+'"><button type="button" onclick="removeExisting('+i+')">×</button></div>').join('')}function removeExisting(i){editingPhotos.splice(i,1);renderPhotos()}async function uploadPhotos(propertyId){if(!selectedFiles.length)return [];const urls=[];const progress=document.getElementById('progress'),bar=progress.querySelector('i');progress.style.display='block';for(let i=0;i<selectedFiles.length;i++){const file=selectedFiles[i];const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto');const path=propertyId+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const {error}=await S.storage.from('property-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;const {data}=S.storage.from('property-photos').getPublicUrl(path);urls.push(data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}async function save(e,id){e.preventDefault();const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';let f=new FormData(e.target),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{let r=id?await S.from('properties').update(row).eq('id',id).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const property=r.data;const newUrls=await uploadPhotos(property.id);if(newUrls.length){const allPhotos=[...editingPhotos,...newUrls];const up=await S.from('properties').update({photos:allPhotos}).eq('id',property.id);if(up.error)throw up.error}document.getElementById('form').innerHTML='<div class="card"><b>✓ Imóvel salvo com sucesso.</b></div>';selectedFiles=[];editingPhotos=[];await load()}catch(err){alert('Não foi possível salvar: '+err.message);btn.disabled=false;btn.textContent='Salvar imóvel'}}async function toggle(id){let x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;let x=items.find(x=>x.id===id);if(x&&x.photos&&x.photos.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}let r=await S.from('properties').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
