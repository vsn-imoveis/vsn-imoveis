<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel Administrativo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#18212b}.top{background:#171d24;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin-bottom:20px}button{padding:11px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.red{background:#d71920;color:#fff}button:disabled{opacity:.6;cursor:not-allowed}input,select,textarea{width:100%;padding:11px;margin:5px 0 12px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.item{padding:15px 0;border-bottom:1px solid #eee}.muted{color:#68737d}.danger{color:#b42318}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.photo{position:relative;border:1px solid #ddd;border-radius:9px;overflow:hidden;background:#eee}.photo img{display:block;width:100%;height:130px;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;padding:5px 8px;background:#fff;color:#b42318}.upload{border:2px dashed #cbd1d8;border-radius:12px;padding:18px;text-align:center;margin:8px 0 15px}.upload label{display:inline-block;background:#d71920;color:#fff;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}.upload input{display:none}.progress{height:7px;background:#e5e7eb;border-radius:5px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#d71920;transition:width .2s}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.photos{grid-template-columns:repeat(2,1fr)}.photo img{height:120px}}</style></head><body><div class="top"><b>VSN IMÓVEIS</b><span id="user"></span></div><main class="wrap" id="app"></main><script>const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K);const A=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[];let selectedFiles=[];let editingPhotos=[];async function boot(){const {data:{session}}=await S.auth.getSession();session?panel(session):login()}function login(msg=''){A.innerHTML='<div class="card" style="max-width:420px;margin:70px auto"><h1>Área administrativa</h1><p class="muted">Entre com o e-mail e a senha do administrador.</p><label>E-mail</label><input id="email" type="email" value="wm.vinicius@hotmail.com" autocomplete="username"><label>Senha</label><input id="password" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')enter()"><button class="red" onclick="enter()">Entrar</button><p id="msg" class="muted">'+esc(msg)+'</p></div>'}async function enter(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,m=document.getElementById('msg');m.textContent='Entrando...';const {data,error}=await S.auth.signInWithPassword({email:e,password:p});if(error){m.className='danger';m.textContent='Não foi possível entrar: '+error.message;return}panel(data.session)}async function panel(session){document.getElementById('user').textContent=session.user.email;A.innerHTML='<div class="card"><h1>Painel de imóveis</h1><p class="muted">Banco real Supabase — alterações ficam salvas para o site.</p><button class="red" onclick="newProp()">+ Novo imóvel</button> <button onclick="load()">Atualizar</button> <button onclick="S.auth.signOut()">Sair</button></div><div class="card"><div id="list">Carregando...</div></div><div id="form"></div>';load()}async function load(){let {data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}items=data||[];document.getElementById('list').innerHTML=items.length?items.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.neighborhood)+' · '+(x.transaction_type==='rent'?'Locação':'Venda')+' · R$ '+Number(x.price||0).toLocaleString('pt-BR')+' · '+(x.published?'Publicado':'Rascunho')+' · '+(x.photos||[]).length+' foto(s)</span><br><br><button onclick="edit(\''+x.id+'\')">Editar</button> <button onclick="toggle(\''+x.id+'\')">'+(x.published?'Despublicar':'Publicar')+'</button> <button onclick="del(\''+x.id+'\')">Excluir</button></div>').join(''):'Nenhum imóvel cadastrado.'}function newProp(x={}){editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<div class="card"><h2>'+ (x.id?'Editar':'Novo') +' imóvel</h2><form onsubmit="save(event,\''+(x.id||'')+'\')"><div class="grid"><div><label>Título</label><input name="title" required value="'+esc(x.title)+'"></div><div><label>Código</label><input name="code" value="'+esc(x.code)+'"></div><div><label>Finalidade</label><select name="transaction_type"><option value="sale" '+(x.transaction_type!=='rent'?'selected':'')+'>Venda</option><option value="rent" '+(x.transaction_type==='rent'?'selected':'')+'>Locação</option></select></div><div><label>Tipo</label><input name="property_type" value="'+esc(x.property_type||'Apartamento')+'"></div><div><label>Preço</label><input name="price" type="number" step="0.01" value="'+(x.price||'')+'" required></div><div><label>Condomínio</label><input name="condo_fee" type="number" step="0.01" value="'+(x.condo_fee||'')+'"></div><div><label>IPTU</label><input name="iptu" type="number" step="0.01" value="'+(x.iptu||'')+'"></div><div><label>Área m²</label><input name="area" type="number" step="0.01" value="'+(x.area||'')+'"></div><div><label>Dormitórios</label><input name="bedrooms" type="number" value="'+(x.bedrooms||'')+'"></div><div><label>Suítes</label><input name="suites" type="number" value="'+(x.suites||'')+'"></div><div><label>Vagas</label><input name="parking" type="number" value="'+(x.parking||'')+'"></div><div><label>Bairro</label><input name="neighborhood" required value="'+esc(x.neighborhood)+'"></div><div class="full"><label>Endereço</label><input name="address" value="'+esc(x.address)+'"></div><div class="full"><label>Descrição</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="full"><label>Características — uma por linha</label><textarea name="features">'+esc((x.features||[]).join('\n'))+'</textarea></div><div class="full"><label>Fotos do imóvel</label><div class="upload"><label for="photoFiles">📷 Escolher fotos do PC ou celular</label><input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple onchange="pickPhotos(event)"><p class="muted">Você pode selecionar várias fotos de uma vez. JPG, PNG, WEBP ou HEIC — até 10 MB cada.</p><div id="progress" class="progress" style="display:none"><i></i></div></div><div id="photosPreview" class="photos"></div><input type="hidden" name="photos"></div><div class="full"><label>Vídeo URL (opcional)</label><input name="video_url" value="'+esc(x.video_url)+'"></div></div><p><label><input type="checkbox" name="featured" style="width:auto" '+(x.featured?'checked':'')+'> Destaque</label> <label><input type="checkbox" name="published" style="width:auto" '+(x.id?(x.published?'checked':''):'checked')+'> Publicado</label></p><button class="red" id="saveBtn">Salvar imóvel</button></form></div>';renderPhotos()}function edit(id){newProp(items.find(x=>x.id===id))}function pickPhotos(e){selectedFiles=[...e.target.files];const preview=document.getElementById('photosPreview');preview.innerHTML='';selectedFiles.forEach((file,i)=>{const u=URL.createObjectURL(file);const d=document.createElement('div');d.className='photo';d.innerHTML='<img src="'+u+'"><button type="button" onclick="removeSelected('+i+')">×</button>';preview.appendChild(d)});if(selectedFiles.length)document.getElementById('saveBtn').textContent='Enviar fotos e salvar imóvel'}function removeSelected(i){selectedFiles.splice(i,1);const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));document.getElementById('photoFiles').files=dt.files;pickPhotos({target:{files:dt.files}})}function renderPhotos(){const p=document.getElementById('photosPreview');if(!p)return;p.innerHTML=editingPhotos.map((url,i)=>'<div class="photo"><img src="'+esc(url)+'"><button type="button" onclick="removeExisting('+i+')">×</button></div>').join('')}function removeExisting(i){editingPhotos.splice(i,1);renderPhotos()}async function uploadPhotos(propertyId){if(!selectedFiles.length)return [];const urls=[];const progress=document.getElementById('progress'),bar=progress.querySelector('i');progress.style.display='block';for(let i=0;i<selectedFiles.length;i++){const file=selectedFiles[i];const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto');const path=propertyId+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const {error}=await S.storage.from('property-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;const {data}=S.storage.from('property-photos').getPublicUrl(path);urls.push(data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}async function save(e,id){e.preventDefault();const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';let f=new FormData(e.target),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{let r=id?await S.from('properties').update(row).eq('id',id).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const property=r.data;const newUrls=await uploadPhotos(property.id);if(newUrls.length){const allPhotos=[...editingPhotos,...newUrls];const up=await S.from('properties').update({photos:allPhotos}).eq('id',property.id);if(up.error)throw up.error}document.getElementById('form').innerHTML='<div class="card"><b>✓ Imóvel salvo com sucesso.</b></div>';selectedFiles=[];editingPhotos=[];await load()}catch(err){alert('Não foi possível salvar: '+err.message);btn.disabled=false;btn.textContent='Salvar imóvel'}}async function toggle(id){let x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;let x=items.find(x=>x.id===id);if(x&&x.photos&&x.photos.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}let r=await S.from('properties').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
