function newProp(x={}){editId=x.id||'';editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<div class="progress-steps"><div class="step active" id="s1"><b>1</b>Dados</div><div class="step" id="s2"><b>2</b>Valores</div><div class="step" id="s3"><b>3</b>Características</div><div class="step" id="s4"><b>4</b>Localização</div><div class="step" id="s5"><b>5</b>Descrição</div><div class="step" id="s6"><b>6</b>Fotos</div></div><form class="card" id="propertyForm" onsubmit="save(event)"><div class="section" id="dados"><div class="section-head"><div class="num">1</div><div><h2 class="section-title">Dados principais</h2><p class="section-help">Comece pelo essencial. Você pode complementar depois.</p></div></div><div class="grid"><div class="field half"><label>Título do anúncio <span class="req">*</span></label><input name="title" required placeholder="Ex.: Apartamento moderno no Morumbi" value="'+esc(x.title)+'"><div class="hint">Prefira um título curto, claro e atrativo.</div></div><div class="field"><label>Código interno</label><input name="code" placeholder="Ex.: VSN1234" value="'+esc(x.code)+'"></div><div class="field"><label>Tipo do imóvel</label><select name="property_type"><option>Apartamento</option><option>Casa</option><option>Studio</option><option>Cobertura</option><option>Terreno</option><option>Sala comercial</option><option>Outro</option></select></div><div class="field"><label>Finalidade</label><div class="segment"><input id="sale" type="radio" name="transaction_type" value="sale" '+(x.transaction_type!=='rent'?'checked':'')+'><label for="sale">Venda</label><input id="rent" type="radio" name="transaction_type" value="rent" '+(x.transaction_type==='rent'?'checked':'')+'><label for="rent">Locação</label></div></div></div></div><br><div class="section" id="valores"><div class="section-head"><div class="num">2</div><div><h2 class="section-title">Valores</h2><p class="section-help">Digite somente os números. O símbolo R$ já d?'checked':'')+'><span><b>Destacar imóvel</b><small>Exibe o imóvel na área de destaque.</small></span></label><label class="check"><input type="checkbox" name="published" '+(x.id?(x.published?'checked':''):'checked')+'><span><b>Publicar no site</b><small>Desmarque para salvar como rascunho.</small></span></label></div><div class="actions"><div class="action-status" id="status">Obrigatórios: título, preço e bairro.</div><div class="buttons"><button type="button" class="btn gray" onclick="cancelForm()">Cancelar</button><button class="btn red" id="saveBtn">Salvar imóvel</button></div></div></form>';const sel=document.querySelector('[name="property_type"]'),type=x.property_type||'Apartamento';sel.value=[...sel.options].some(o=>o.value===type)?type:'Outro';updateCounter();document.getElementById('description').addEventListener('input',updateCounter);setupDropzone();renderPhotos();document.getElementById('form').scrollIntoView({behavior:'smooth',block:'start'});observeSections()}
function updateCounter(){const e=document.getElementById('description'),c=document.getElementById('descCount');if(e&&c)c.textContent=e.value.length}function observeSections(){const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id,n={dados:1,valores:2,caracteristicas:3,localizacao:4,descricao:5,fotos:6}[id];document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));const st=document.getElementById('s'+n);if(st)st.classList.add('active')}}),{rootMargin:'-20% 0px -65% 0px'});document.querySelectorAll('.section').forEach(e=>obs.observe(e))}

async function uploadPhotos(propertyId){if(!selectedFiles.length)return[];const urls=[],progress=document.getElementById('progress'),bar=progress.querySelector('i');progress.style.display='block';for(let i=0;i<selectedFiles.length;i++){const file=selectedFiles[i],ext=(file.name.split('.').pop()||'jpg').toLowerCase(),safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto'),path=propertyId+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const {error}=await S.storage.from('property-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;const {data}=S.storage.from('property-photos').getPublicUrl(path);urls.push(data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}
async function save(e){e.preventDefault();const form=e.target;if(!form.reportValidity())return;const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';document.getElementById('status').textContent='Salvando dados e fotos...';const f=new FormData(form),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{let r=editId?await S.from('properties').update(row).eq('id',editId).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const property=r.data,newUrls=await uploadPhotos(property.id);if(newUrls.length){const up=await S.from('properties').update({photos:[...editingPhotos,...newUrls]}).eq('id',property.id);if(up.error)throw up.error}toast('Imóvel salvo com sucesso.','ok');selectedFiles=[];editingPhotos=[];editId='';await load();document.getElementById('form').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}catch(err){toast('Não foi possível salvar: '+err.message,'err');btn.disabled=false;btn.textContent='Salvar imóvel';document.getElementById('status').textContent='Verifique os campos e tente novamente.'}}
function edit(id){newProp(items.find(x=>x.id===id))}function cancelForm(){if((selectedFiles.length||editId)&&!confirm('Descartar o preenchimento atual?'))return;selectedFiles=[];editingPhotos=[];editId='';document.getElementById('form').innerHTML=''}async function toggle(id){const x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)toast(r.error.message,'err');else{toast(x.published?'Imóvel despublicado.':'Imóvel publicado.','ok');load()}}async function del(id){if(!confirm('Excluir este imóvel? Esta ação não pode ser desfeita.'))return;const x=items.find(x=>x.id===id);if(x&&x.photos&&x.photos.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}const r=await S.from('properties').delete().eq('id',id);if(r.error)toast(r.error.message,'err');else{toast('Imóvel excluído.','ok');load()}}
S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();
