function formatArea(v){
  if(v===null||v===undefined||v==='')return '';
  const n=Number(v);
  return Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2}):'';
}
function parseArea(v){
  if(v===null||v===undefined||v==='')return 0;
  let s=String(v).trim().replace(/\./g,'').replace(',','.');
  const n=Number(s.replace(/[^0-9.-]/g,''));
  return Number.isFinite(n)?n:0;
}
function formatAreaField(el){
  let s=String(el.value||'').replace(/[^0-9,\.]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'');
  else s=s.replace(/\./g,'');
  el.value=s.replace(',',',');
}
function formatMoney(v){
  if(v===null||v===undefined||v==='')return '';
  const n=Number(v);
  if(!Number.isFinite(n))return '';
  return n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function parseMoney(v){
  if(v===null||v===undefined||v==='')return 0;
  let s=String(v).replace(/R\$\s?/g,'').trim();
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/\./g,'');
  s=s.replace(/[^0-9.-]/g,'');
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}
function formatMoneyField(el){
  const digits=String(el.value||'').replace(/\D/g,'');
  if(!digits){el.value='';return;}
  const n=Number(digits)/100;
  el.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function syncPurposeAndTitle(){

          if(groups.Educação?.length)parts.push('escolas e instituições de ensino');
          if(groups.Saúde?.length)parts.push('serviços de saúde');
          if(groups.Farmácias?.length)parts.push('farmácias');
          if(groups.Comércio?.length)parts.push('comércio e serviços');
          if(groups.Lazer?.length)parts.push('opções de lazer');
          if(parts.length)p5='A localização facilita a rotina, com '+descList(parts)+' nas proximidades.';
        }
      }catch(_){}
    }
    if(!p5&& (neighborhood||city))p5='Localizado'+(isHouse?'a':'')+(neighborhood?' no bairro '+neighborhood:'')+(city?', em '+city:'')+', o imóvel combina praticidade de acesso com a conveniência da região.';

    const description=[intro,p2,p3,p4,p5].filter(Boolean).join('\n\n').trim();
    document.getElementById('description').value=description;
    document.getElementById('descCount').textContent=description.length;
    toast('Descrição criada automaticamente.','ok');
  }catch(e){
    console.error('[VSN] generateDescription',e);
    toast(e.message||'Falha ao gerar descrição','err');
  }finally{
    b.disabled=false;b.textContent='Gerar descrição automaticamente';
  }
}
function descList(items){
  const a=items.filter(Boolean);
  if(a.length<=1)return a[0]||'';
  if(a.length===2)return a[0]+' e '+a[1];
  return a.slice(0,-1).join(', ')+' e '+a[a.length-1];
}
