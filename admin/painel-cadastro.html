<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Cadastro de imóvel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K),A=document.getElementById('app');let items=[],selectedFiles=[],editingPhotos=[],editId='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t,type=''){const e=document.getElementById('toast');e.textContent=t;e.className='toast show '+type;clearTimeout(window.__t);window.__t=setTimeout(()=>e.className='toast',3200)}async function boot(){const{data:{session}}=await S.auth.getSession();session?panel(session):login()}function login(msg=''){A.innerHTML='<div class="card login"><h1>Área administrativa</h1><p class="section-help">Entre com o e-mail e a senha do administrador.</p><br><label>E-mail</label><input id="email" type="email" value="wm.vinicius@hotmail.com" autocomplete="username"><label>Senha</label><input id="password" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')enter()"><br><br><button class="btn red" onclick="enter()">Entrar</button><div id="msg" class="section-help" style="margin-top:12px">'+esc(msg)+'</div></div>'}async function enter(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,m=document.getElementById('msg');m.textContent='Entrando...';const{data,error}=await S.auth.signInWithPassword({email:e,password:p});if(error){m.style.color='#b42318';m.textContent='Não foi possível entrar: '+error.message;return}panel(data.session)}async function panel(session){document.getElementById('user').textContent=session.user.email;A.innerHTML='<div class="head"><h1>Cadastro de imóvel</h1><p>Preencha os dados e publique o imóvel no site.</p></div><div id="list"></div><div id="form"></div>';load()}async function load(){const{data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').in function counter(name,value,unit,step=1){const v=value==null||value===''?0:Number(value);return '<div class="counter"><button type="button" aria-label="Diminuir '+unit+'" onclick="adjust(\''+name+'\',-'+step+')">−</button><input id="counter-'+name+'" name="'+name+'" type="number" min="0" step="'+step+'" value="'+v+'" inputmode="numeric" aria-label="'+unit+'"><button type="button" class="plus" aria-label="Aumentar '+unit+'" onclick="adjust(\''+name+'\','+step+')">+</button></div><div class="counter-unit">'+unit+'</div>'}function adjust(name,delta){const i=document.getElementById('counter-'+name);if(!i)return;const step=Number(i.step)||1;let v=Number(i.value)||0;v=Math.max(0,v+Number(delta));if(step<1)v=Math.round(v/step)*step;i.value=String(v)}
function newProp(x={}){editId=x.id||'';editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<div class="progress-steps"><div class="step active"><b>1</b>Dados</div><div class="step"><b>2</b>Valores</div><div class="step"><b>3</b>Características</div><div class="step"><b>4</b>Localização</div><div class="step"><b>5</b>Descrição</div><div class="step"><b>6</b>Fotos</div></div><form class="card" onsubmit="save(event)"><div class="section"><div class="section-head"><div class="num">1</div><div><h2 class="section-title">Dados principais</h2><p class="section-help">Comece pelo essencial.</p></div></div><div class="grid"><div class="field half"><label>Título do anúncio <span class="req">*</span></label><input name="title" required placeholder="Ex.: Apartamento moderno no Morumbi" value="'+esc(x.title)+'"></div><div class="field"><label>Código interno</label><input name="code" placeholder="Ex.: VSN1234" value="'+esc(x.code)+'"></div><div class="field"><label>Tipo do imóvel</label><select name="property_type"><option>Apartamento</option><option>Casa</option><option>Studio</option><option>Cobertura</option><option>Terreno</option><option>Sala comercial</option><option>Outro</option></select></div><div class="field"><label>Finalidade</label><div class="segment"><input id="sale" type="radio" name="transaction_type" value="sale" '+(x.transaction_type!=='rent'?'checked':'')+'><label for="sale">Venda</label><input id="rent" type="radio" name="transaction_type" value="rent" '+(x.transaction_type==='rent'?'checked':'')+'><label for="rent">Locação</label></div></div></div></div><br><div class="section"><div class="section-head"><div class="num">2</div><div><h2 class="section-title">Valores</h2><p class="section-help">Informe os valores do imóvel.</p></div></div><div class="grid"><div class="field"><label>Preço <span class="req">*</span></label><div class="input-money"><span>R$</span><input name="price" type="number" min="0" step="0.01" require artamento'):'Outro';const d=document.getElementById('description');const c=document.getElementById('descCount');const update=()=>c.textContent=d.value.length;d.addEventListener('input',update);update();renderPhotos();document.getElementById('form').scrollIntoView({behavior:'smooth',block:'start'})}
function edit(id){newProp(items.find(x=>x.id===id))}function pickPhotos(e){const files=[...e.target.files].filter(f=>f.size<=10*1024*1024&&/^image\/(jpeg|png|webp|heic|heif)$/.test(f.type));selectedFiles=[...selectedFiles,...files];renderPhotos();const input=document.getElementById('photoFiles');if(input){const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));input.files=dt.files}if(selectedFiles.length)document.getElementById('saveBtn').textContent='Enviar fotos e salvar'}function removeSelected(i){selectedFiles.splice(i,1);renderPhotos();const input=document.getElementById('photoFiles');if(input){const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));input.files=dt.files}}function removeExisting(i){editingPhotos.splice(i,1);renderPhotos()}function makeCover(i){editingPhotos.unshift(editingPhotos.splice(i,1)[0]);renderPhotos()}function renderPhotos(){const p=document.getElementById('photosPreview');if(!p)return;p.innerHTML='';editingPhotos.forEach((url,i)=>{const d=document.createElement('div');d.className='photo '+(i===0?'primary':'');d.innerHTML='<img src="'+esc(url)+'"><button type="button" title="Remover" onclick="removeExisting('+i+')">×</button><button type="button" class="cover" onclick="makeCover('+i+')">Usar como capa</button>';p.appendChild(d)});selectedFiles.forEach((f,i)=>{const d=document.createElement('div');d.className='photo '+(editingPhotos.length===0&&i===0?'primary':'');d.innerHTML='<img src="'+URL.createObjectURL(f)+'"><button type="button" title="Remover" onclick="removeSelected('+i+')">×</button>';p.appendChild(d)})}async function uploadPhotos(id){if(!selectedFiles.length)return[];const urls=[],bar=document.querySelector('#progress i'),prog=document.getElementById('progress');prog.style.display='block';for(let i=0;i<selectedFiles.length;i++){const f=selectedFiles[i],ext=(f.name.split('.').pop()||'jpg').toLowerCase(),safe=(f.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto'),path=id+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const{error}=await S.storage.from('property-photos').upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});if(error)throw error;urls.push(S.storage.from('property-photos').getPublicUrl(path).data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}async function save(e){e.preventDefault();const form=e.target;if(!form.reportValidity())return;const b=document.getElementById('saveBtn');b.disabled=true;b.textContent='Salvando...';const f=new FormData(form),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{const r=editId?await S.from('properties').update(row).eq('id',editId).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const urls=await uploadPhotos(r.data.id);if(urls.length){const up=await S.from('properties').update({photos:[...editingPhotos,...urls]}).eq('id',r.data.id);if(up.error)throw up.error}toast('Imóvel salvo com sucesso.','ok');selectedFiles=[];editingPhotos=[];editId='';await load();document.getElementById('form').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}catch(err){toast('Não foi possível salvar: '+err.message,'err');b.disabled=false;b.textContent='Salvar imóvel'}}function cancelForm(){if((selectedFiles.length||editId)&&!confirm('Descartar o preenchimento atual?'))return;selectedFiles=[];editingPhotos=[];editId='';document.getElementById('form').innerHTML=''}async function toggle(id){const x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)toast(r.error.message,'err');else{toast(x.published?'Imóvel despublicado.':'Imóvel publicado.','ok');load()}}async function del(id){if(!confirm('Excluir este imóvel? Esta ação não pode ser desfeita.'))return;const x=items.find(x=>x.id===id);if(x?.photos?.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}const r=await S.from('properties').delete().eq('id',id);if(r.error)toast(r.error.message,'err');else{toast('Imóvel excluído.','ok');load()}}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
