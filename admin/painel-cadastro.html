<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Cadastro de imóvel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#d71920;--dark:#171d24;--text:#1c2630;--muted:#68737d;--line:#dfe3e7;--bg:#f4f6f8;--white:#fff;--soft:#fafbfc}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:var(--dark);color:#fff;padding:15px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.4px}.user{font-size:13px;opacity:.85}
.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.head h1{margin:0 0 6px;font-size:28px}.head p{margin:0;color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 2px 8px rgba(20,30,40,.03)}
.section-title{font-size:17px;font-weight:800;margin:0 0 4px}.section-help{font-size:13px;color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.field{grid-column:span 4}.field.wide{grid-column:span 6}.field.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:700;margin:0 0 7px;color:#33404b}.required{color:var(--red)}
input,select,textarea{width:100%;border:1px solid #cfd5db;border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:14px;padding:12px 13px;outline:none;transition:.15s}input,select{height:44px}textarea{min-height:125px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.08)}
.input-wrap{position:relative}.prefix,.suffix{position:absolute;top:0;height:44px;display:flex;align-items:center;color:#6b747d;font-size:13px;font-weight:700;pointer-events:none}.prefix{left:13px}.suffix{right:13px}.has-prefix{padding-left:42px}.has-suffix{padding-right:45px}
.upload{border:2px dashed #cbd2d9;border-radius:13px;padding:24px;text-align:center;background:var(--soft)}.upload strong{display:block;font-size:15px;margin-bottom:6px}.upload p{margin:0 0 14px;color:var(--muted);font-size:13px}.upload label{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;padding:11px 18px;border-radius:9px;font-size:14px;cursor:pointer;margin:0}.upload input{display:none}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.photo{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eee}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo button{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:50%;background:#fff;color:#b42318;font-size:19px;line-height:28px;padding:0;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.15)}
.checks{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px}.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}.check input{width:18px;height:18px;margin:0;accent-color:var(--red)}
.actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:24px -24px -24px;padding:16px 24px;display:flex;justify-content:flex-end;gap:10px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#eef1f4;color:#27323c}.btn:disabled{opacity:.55;cursor:not-allowed}
.progress{height:7px;background:#e7eaed;border-radius:5px;overflow:hidden;margin-top:15px;display:none}.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}.msg{margin-top:12px;font-size:14px}.error{color:#b42318}.success{color:#16723a}
.login{max-width:430px;margin:70px auto}.login .btn{width:100%}
@media(max-width:850px){.field,.field.wide{grid-column:span 6}.photos{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.wrap{padding:20px 14px 45px}.head{display:block}.head h1{font-size:23px}.card{padding:18px}.grid{gap:13px}.field,.field.wide,.field.full{grid-column:1/-1}.photos{grid-template-columns:repeat(2,1fr)}.actions{margin:20px -18px -18px;padding:14px 18px}.btn{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="brand">VSN IMÓVEIS</div><div class="user" id="user"></div></header>
<main class="wrap" id="app"></main>
<script>
const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K);const A=document.getElementById('app');let items=[],selectedFiles=[],editingPhotos=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){const {data:{session}}=await S.auth.getSession();session?panel(session):login()}function login(msg=''){A.innerHTML='<div class="card login"><h1>Área administrativa</h1><p class="section-help">Entre com o e-mail e a senha do administrador.</p><label>E-mail</label><input id="email" type="email" value="wm.vinicius@hotmail.com" autocomplete="username"><label>Senha</label><input id="password" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')enter()"><br><br><button class="btn red" onclick="enter()">Entrar</button><div id="msg" class="msg muted">'+esc(msg)+'</div></div>'}async function enter(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,m=document.getElementById('msg');m.textContent='Entrando...';const {data,error}=await S.auth.signInWithPassword({email:e,password:p});if(error){m.className='msg error';m.textContent='Não foi possível entrar: '+error.message;return}panel(data.session)}
async function panel(session){document.getElementById('user').textContent=session.user.email;A.innerHTML='<div class="head"><div><h1>Cadastro de imóvel</h1><p>Preencha os dados abaixo para publicar o imóvel no site.</p></div></div><div id="list"></div><div id="form"></div>';load()}
async function load(){let {data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}items=data||[];document.getElementById('list').innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b>Imóveis cadastrados</b><div class="section-help" style="margin:4px 0 0">'+items.length+' imóvel(is) no banco</div></div><div><button class="btn red" onclick="newProp()">+ Novo imóvel</button> <button class="btn gray" onclick="load()">Atualizar</button> <button class="btn gray" onclick="S.auth.signOut()">Sair</button></div></div><div style="margin-top:18px">'+(items.length?items.map(x=>'<div style="padding:13px 0;border-top:1px solid var(--line)"><b>'+esc(x.title)+'</b><br><span class="section-help" style="display:inline">'+esc(x.neighborhood)+' · '+(x.transaction_type==='rent'?'Locação':'Venda')+' · R$ '+Number(x.price||0).toLocaleString('pt-BR')+' · '+(x.published?'Publicado':'Rascunho')+' · '+(x.photos||[]).length+' foto(s)</span><div style="margin-top:9px"><button class="btn gray" onclick="edit(\''+x.id+'\')">Editar</button> <button class="btn gray" onclick="toggle(\''+x.id+'\')">'+(x.published?'Despublicar':'Publicar')+'</button> <button class="btn gray" onclick="del(\''+x.id+'\')">Excluir</button></div></div>').join(''):'<span class="section-help">Nenhum imóvel cadastrado.</span>')+'</div></div>'}function newProp(x={}){editingPhotos=[...(x.photos||[])];selectedFiles=[];document.getElementById('form').innerHTML='<form class="card" onsubmit="save(event,\''+(x.id||'')+'\')"><div class="section-title">'+(x.id?'Editar imóvel':'Novo imóvel')+'</div><p class="section-help">Os campos marcados com <span class="required">*</span> são obrigatórios.</p><div class="grid"><div class="field wide"><label>Título <span class="required">*</span></label><input name="title" required placeholder="Ex.: Apartamento moderno no Morumbi" value="'+esc(x.title)+'"></div><div class="field"><label>Código</label><input name="code" placeholder="Ex.: VSN1234" value="'+esc(x.code)+'"></div><div class="field"><label>Finalidade</label><select name="transaction_type"><option value="sale" '+(x.transaction_type!=='rent'?'selected':'')+'>Venda</option><option value="rent" '+(x.transaction_type==='rent'?'selected':'')+'>Locação</option></select></div><div class="field"><label>Tipo do imóvel</label><input name="property_type" placeholder="Apartamento, casa..." value="'+esc(x.property_type||'Apartamento')+'"></div></div><br><div class="section-title">Valores</div><p class="section-help">Informe os valores sem pontos ou símbolos; o sistema formata no site.</p><div class="grid"><div class="field"><label>Preço <span class="required">*</span></label><div class="input-wrap"><span class="prefix">R$</span><input class="has-prefix" name="price" type="number" min="0" step="0.01" placeholder="0,00" value="'+(x.price||'')+'" required></div></div><div class="field"><label>Condomínio</label><div class="input-wrap"><span class="prefix">R$</span><input class="has-prefix" name="condo_fee" type="number" min="0" step="0.01" placeholder="0,00" value="'+(x.condo_fee||'')+'"></div></div><div class="field"><label>IPTU</label><div class="input-wrap"><span class="prefix">R$</span><input class="has-prefix" name="iptu" type="number" min="0" step="0.01" placeholder="0,00" value="'+(x.iptu||'')+'"></div></div></div><br><div class="section-title">Características</div><p class="section-help">Dados que aparecerão nos destaques do imóvel.</p><div class="grid"><div class="field"><label>Área</label><div class="input-wrap"><input class="has-suffix" name="area" type="number" min="0" step="0.01" placeholder="0" value="'+(x.area||'')+'"><span class="suffix">m²</span></div></div><div class="field"><label>Dormitórios</label><input name="bedrooms" type="number" min="0" step="1" placeholder="0" value="'+(x.bedrooms||'')+'"></div><div class="field"><label>Suítes</label><input name="suites" type="number" min="0" step="1" placeholder="0" value="'+(x.suites||'')+'"></div><div class="field"><label>Vagas</label><input name="parking" type="number" min="0" step="1" placeholder="0" value="'+(x.parking||'')+'"></div></div><br><div class="section-title">Localização</div><p class="section-help">O endereço pode ser completo ou apenas a referência que você deseja exibir.</p><div class="grid"><div class="field wide"><label>Bairro <span class="required">*</span></label><input name="neighborhood" required placeholder="Ex.: Vila Andrade" value="'+esc(x.neighborhood)+'"></div><div class="field wide"><label>Endereço</label><input name="address" placeholder="Rua, número, complemento..." value="'+esc(x.address)+'"></div></div><br><div class="section-title">Descrição e detalhes</div><div class="grid"><div class="field full"><label>Descrição</label><textarea name="description" placeholder="Descreva os principais diferenciais do imóvel...">'+esc(x.description)+'</textarea></div><div class="field full"><label>Características — uma por linha</label><textarea name="features" placeholder="Varanda gourmet\nPiscina\nAcademia\nChurrasqueira">'+esc((x.features||[]).join('\n'))+'</textarea></div><div class="field full"><label>Vídeo URL <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input name="video_url" type="url" placeholder="https://..." value="'+esc(x.video_url)+'"></div></div><br><div class="section-title">Fotos do imóvel</div><p class="section-help">Selecione várias fotos de uma vez. JPG, PNG, WEBP ou HEIC — até 10 MB por foto.</p><div class="upload"><strong>Adicione fotos profissionais do imóvel</strong><p>Recomendamos pelo menos 8 fotos, começando pela melhor imagem.</p><label for="photoFiles">📷 Escolher fotos do PC ou celular</label><input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple onchange="pickPhotos(event)"><div id="progress" class="progress"><i></i></div></div><div id="photosPreview" class="photos"></div><div class="checks"><label class="check"><input type="checkbox" name="featured" '+(x.featured?'checked':'')+'> Destacar este imóvel</label><label class="check"><input type="checkbox" name="published" '+(x.id?(x.published?'checked':''):'checked')+'> Publicar no site</label></div><div class="actions"><button type="button" class="btn gray" onclick="document.getElementById(\'form\').innerHTML=\'\'">Cancelar</button><button class="btn red" id="saveBtn">Salvar imóvel</button></div></form>';renderPhotos()}
function edit(id){newProp(items.find(x=>x.id===id))}function pickPhotos(e){selectedFiles=[...e.target.files];const p=document.getElementById('photosPreview');p.innerHTML='';selectedFiles.forEach((file,i)=>{const u=URL.createObjectURL(file),d=document.createElement('div');d.className='photo';d.innerHTML='<img src="'+u+'"><button type="button" onclick="removeSelected('+i+')">×</button>';p.appendChild(d)});if(selectedFiles.length)document.getElementById('saveBtn').textContent='Enviar fotos e salvar'}function removeSelected(i){selectedFiles.splice(i,1);const dt=new DataTransfer();selectedFiles.forEach(f=>dt.items.add(f));document.getElementById('photoFiles').files=dt.files;pickPhotos({target:{files:dt.files}})}function renderPhotos(){const p=document.getElementById('photosPreview');if(!p)return;p.innerHTML=editingPhotos.map((url,i)=>'<div class="photo"><img src="'+esc(url)+'"><button type="button" onclick="removeExisting('+i+')">×</button></div>').join('')}function removeExisting(i){editingPhotos.splice(i,1);renderPhotos()}
async function uploadPhotos(id){if(!selectedFiles.length)return[];const urls=[],progress=document.getElementById('progress'),bar=progress.querySelector('i');progress.style.display='block';for(let i=0;i<selectedFiles.length;i++){const file=selectedFiles[i],ext=(file.name.split('.').pop()||'jpg').toLowerCase(),safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')||'foto'),path=id+'/'+Date.now()+'_'+i+'_'+safe+'.'+ext;const {error}=await S.storage.from('property-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw error;urls.push(S.storage.from('property-photos').getPublicUrl(path).data.publicUrl);bar.style.width=((i+1)/selectedFiles.length*100)+'%'}return urls}
async function save(e,id){e.preventDefault();const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';const f=new FormData(e.target),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),condo_fee:+(f.get('condo_fee')||0),iptu:+(f.get('iptu')||0),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:editingPhotos,video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};try{const r=id?await S.from('properties').update(row).eq('id',id).select().single():await S.from('properties').insert(row).select().single();if(r.error)throw r.error;const urls=await uploadPhotos(r.data.id);if(urls.length){const up=await S.from('properties').update({photos:[...editingPhotos,...urls]}).eq('id',r.data.id);if(up.error)throw up.error}document.getElementById('form').innerHTML='<div class="card success"><b>✓ Imóvel salvo com sucesso.</b><p class="section-help">As informações e fotos foram gravadas no banco.</p></div>';selectedFiles=[];editingPhotos=[];await load()}catch(err){alert('Não foi possível salvar: '+err.message);btn.disabled=false;btn.textContent='Salvar imóvel'}}
async function toggle(id){const x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;const x=items.find(x=>x.id===id);if(x?.photos?.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}const r=await S.from('properties').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}
S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();
</script>
</body>
</html>
