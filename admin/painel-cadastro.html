);document.getElementById('form').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast('Não foi possível salvar: '+e.message,'err');b.disabled=false;b.textContent='Salvar imóvel'}}function edit(id){newProp(items.find(x=>x.id===id))}function cancelForm(){if((selectedFiles.length||editId)&&!confirm('Descartar o preenchimento atual?'))return;selectedFiles=[];editingPhotos=[];editId='';document.getElementById('form').innerHTML=''}async function toggle(id){const x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)toast(r.error.message,'err');else{toast(x.published?'Imóvel despublicado.':'Imóvel publicado.','ok');load()}}async function del(id){if(!confirm('Excluir este imóvel?'))return;const x=items.find(x=>x.id===id);if(x?.photos?.length){const paths=x.photos.map(u=>{const m=u.match(/\/property-photos\/([^?]+)/);return m?decodeURIComponent(m[1]):null}).filter(Boolean);if(paths.length)await S.storage.from('property-photos').remove(paths)}const r=await S.from('properties').delete().eq('id',id);if(r.error)toast(r.error.message,'err');else{toast('Imóvel excluído.','ok');load()}}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
