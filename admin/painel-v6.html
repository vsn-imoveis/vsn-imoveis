<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Painel</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="panel" src="./painel-v5.html?v=20260910-general-condo-v1" title="Painel VSN Imóveis"></iframe>
<script>
const frame=document.getElementById('panel');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    const original=w.identifyCondo;
    if(typeof original!=='function')return;
    w.identifyCondo=async function(){
      const f=d.getElementById('propertyForm');
      if(f){
        const condoName=f.elements.namedItem('condominium_name');
        if(condoName)condoName.value='';
        d.querySelectorAll('input[name="condo_feature"]').forEach(e=>e.checked=false);
        const year=f.elements.namedItem('construction_year');
        if(year)year.value='';
      }
      return original.apply(this,arguments);
    };
  }catch(e){console.error('Correção do painel:',e)}
});
</script>
</body>
</html>
