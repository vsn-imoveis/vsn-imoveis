<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSN Imóveis — Painel</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="panel" src="./painel-v5.html?v=20260910-condo-fields-v1" title="Painel VSN Imóveis"></iframe>
<script>
const frame=document.getElementById('panel');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    const originalFetch=w.fetch.bind(w);
    w.fetch=async function(input,init){
      let url=typeof input==='string'?input:(input&&input.url)||'';
      const isProperties=url.includes('/rest/v1/properties');
      if(isProperties&&init?.body&&typeof init.body==='string'){
        try{
          const body=JSON.parse(init.body),f=d.getElementById('propertyForm');
          if(f){
            const get=n=>String(f.elements.namedItem(n)?.value||'').trim();
            body.condominium_builder=get('condominium_builder')||null;
            body.condominium_delivery_year=get('condominium_delivery_year')?Number(get('condominium_delivery_year')):null;
            body.condominium_units=get('condominium_units')?Number(get('condominium_units')):null;
            body.condominium_land_area=get('condominium_land_area')?Number(get('condominium_land_area').replace(/\./g,'').replace(',','.')):null;
            init={...init,body:JSON.stringify(body)};
          }
        }catch(e){console.warn('Não foi possível salvar os dados estruturais do condomínio:',e)}
      }
      return originalFetch(input,init);
    };

    function addCondoFields(){
      const f=d.getElementById('propertyForm');if(!f||f.dataset.condoFieldsAdded==='1')return;
      const sections=[...f.querySelectorAll('.section')];
      const section=sections.find(s=>s.querySelector('h2')?.textContent.trim()==='Características do condomínio');
      if(!section)return;
      const record=f.__record||w.__nextPropertyRecord||{};
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const moneyArea=v=>v==null||v===''?'':String(v);
      const wrap=document.createElement('div');
      wrap.innerHTML=`<div class="feature-title">Descrição do condomínio</div><div class="grid" style="margin-top:8px"><div class="half"><label>Construtora</label><input name="condominium_builder" value="${esc(record.condominium_builder||'')}"></div><div class="third"><label>Ano de entrega</label><input name="condominium_delivery_year" type="number" min="1800" max="2100" value="${esc(record.condominium_delivery_year||'')}"></div><div class="third"><label>Unidades</label><input name="condominium_units" type="number" min="1" value="${esc(record.condominium_units||'')}"></div><div class="third"><label>Terreno (m²)</label><input name="condominium_land_area" type="number" min="0" step="0.01" value="${esc(moneyArea(record.condominium_land_area))}"></div></div>`;
      const anchor=section.querySelector('.features');
      if(anchor)anchor.insertAdjacentElement('afterend',wrap.firstElementChild);else section.appendChild(wrap.firstElementChild);
      f.dataset.condoFieldsAdded='1';
    }

    function fillSanLorenzo(){
      const f=d.getElementById('propertyForm');if(!f)return;
      const address=String(f.elements.namedItem('address')?.value||'').toLowerCase();
      const number=String(f.elements.namedItem('number')?.value||'').trim();
      const name=String(f.elements.namedItem('condominium_name')?.value||'').toLowerCase();
      if((address.includes('jose de oliveira coelho')&&number==='165')||name.includes('san lorenzo')){
        const set=(n,v)=>{const e=f.elements.namedItem(n);if(e&&!String(e.value||'').trim())e.value=v};
        set('condominium_builder','Campanário');
        set('condominium_delivery_year','1992');
        set('condominium_units','34');
        set('condominium_land_area','2456');
      }
    }

    const originalNew=w.newProperty;
    if(typeof originalNew==='function')w.newProperty=function(p){const r=originalNew.apply(this,arguments);setTimeout(()=>{addCondoFields();fillSanLorenzo()},80);return r};
    new MutationObserver(()=>{addCondoFields();fillSanLorenzo()}).observe(d.getElementById('editor')||d.body,{childList:true,subtree:true});
    setTimeout(()=>{addCondoFields();fillSanLorenzo()},300);
  }catch(e){console.error('Ajuste dos dados do condomínio:',e)}
});
</script>
</body>
</html>
