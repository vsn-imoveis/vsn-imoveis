<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#18212b}.top{background:#171d24;color:white;padding:16px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:22px;margin-bottom:20px}button{padding:11px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.red{background:#d71920;color:white}input,select,textarea{width:100%;padding:11px;margin:5px 0 12px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.item{padding:15px 0;border-bottom:1px solid #eee}.muted{color:#68737d}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="top"><b>VSN IMÓVEIS</b><span id="user"></span></div><main class="wrap" id="app"></main><script>const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K);const A=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){let {data:{session}}=await S.auth.getSession();session?panel(session):login()}function login(){A.innerHTML='<div class="card" style="max-width:420px;margin:80px auto"><h1>Login</h1><p class="muted">Receba um link de acesso no e-mail da VSN.</p><input id="email" type="email" value="vsnimoveis@gmail.com"><button class="red" onclick="send()">Enviar acesso</button><p id="msg" class="muted"></p></div>'}async function send(){let e=document.getElementById('email').value.trim();let {error}=await S.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});document.getElementById('msg').textContent=error?error.message:'Acesso enviado. Confira o e-mail.'}async function panel(session){document.getElementById('user').textContent=session.user.email;A.innerHTML='<div class="card"><h1>Painel de imóveis</h1><p class="muted">Banco real Supabase — alterações ficam salvas para o site.</p><button class="red" onclick="newProp()">+ Novo imóvel</button> <button onclick="S.auth.signOut()">Sair</button></div><div class="card"><div id="list">Carregando...</div></div><div id="form"></div>';load()}async function load(){let {data,error}=await S.from('properties').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}window.items=data||[];document.getElementById('list').innerHTML=items.length?items.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.neighborhood)+' · '+(x.transaction_type==='rent'?'Locação':'Venda')+' · R$ '+Number(x.price||0).toLocaleString('pt-BR')+'</span><br><br><button onclick="edit(\''+x.id+'\')">Editar</button> <button onclick="toggle(\''+x.id+'\')">'+(x.published?'Despublicar':'Publicar')+'</button> <button onclick="del(\''+x.id+'\')">Excluir</button></div>').join(''):'Nenhum imóvel cadastrado.'}function newProp(x={}){document.getElementById('form').innerHTML='<div class="card"><h2>'+ (x.id?'Editar':'Novo') +' imóvel</h2><form onsubmit="save(event,\''+(x.id||'')+'\')"><div class="grid"><div><label>Título</label><input name="title" required value="'+esc(x.title)+'"></div><div><label>Código</label><input name="code" value="'+esc(x.code)+'"></div><div><label>Finalidade</label><select name="transaction_type"><option value="sale" '+(x.transaction_type!=='rent'?'selected':'')+'>Venda</option><option value="rent" '+(x.transaction_type==='rent'?'selected':'')+'>Locação</option></select></div><div><label>Tipo</label><input name="property_type" value="'+esc(x.property_type||'Apartamento')+'"></div><div><label>Preço</label><input name="price" type="number" step="0.01" value="'+(x.price||'')+'" required></div><div><label>Área m²</label><input name="area" type="number" step="0.01" value="'+(x.area||'')+'"></div><div><label>Dormitórios</label><input name="bedrooms" type="number" value="'+(x.bedrooms||'')+'"></div><div><label>Suítes</label><input name="suites" type="number" value="'+(x.suites||'')+'"></div><div><label>Vagas</label><input name="parking" type="number" value="'+(x.parking||'')+'"></div><div><label>Bairro</label><input name="neighborhood" required value="'+esc(x.neighborhood)+'"></div><div class="full"><label>Endereço</label><input name="address" value="'+esc(x.address)+'"></div><div class="full"><label>Descrição</label><textarea name="description">'+esc(x.description)+'</textarea></div><div class="full"><label>Características — uma por linha</label><textarea name="features">'+esc((x.features||[]).join('\n'))+'</textarea></div><div class="full"><label>Fotos — uma URL por linha</label><textarea name="photos">'+esc((x.photos||[]).join('\n'))+'</textarea></div><div class="full"><label>Vídeo URL</label><input name="video_url" value="'+esc(x.video_url)+'"></div></div><p><label><input type="checkbox" name="featured" style="width:auto" '+(x.featured?'checked':'')+'> Destaque</label> <label><input type="checkbox" name="published" style="width:auto" '+(x.id?(x.published?'checked':''):'checked')+'> Publicado</label></p><button class="red">Salvar</button></form></div>'}function edit(id){newProp(items.find(x=>x.id===id))}async function save(e,id){e.preventDefault();let f=new FormData(e.target),row={title:f.get('title'),code:f.get('code')||null,transaction_type:f.get('transaction_type'),property_type:f.get('property_type'),price:+f.get('price'),area:+(f.get('area')||0),bedrooms:+(f.get('bedrooms')||0),suites:+(f.get('suites')||0),parking:+(f.get('parking')||0),neighborhood:f.get('neighborhood'),address:f.get('address')||null,description:f.get('description')||null,features:String(f.get('features')||'').split('\n').map(x=>x.trim()).filter(Boolean),photos:String(f.get('photos')||'').split('\n').map(x=>x.trim()).filter(Boolean),video_url:f.get('video_url')||null,featured:f.has('featured'),published:f.has('published')};let r=id?await S.from('properties').update(row).eq('id',id):await S.from('properties').insert(row);if(r.error)return alert(r.error.message);document.getElementById('form').innerHTML='';load()}async function toggle(id){let x=items.find(x=>x.id===id),r=await S.from('properties').update({published:!x.published}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Excluir este imóvel?'))return;let r=await S.from('properties').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}S.auth.onAuthStateChange((_e,s)=>{if(s)panel(s);else login()});boot();</script></body></html>
