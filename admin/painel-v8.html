<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Painel</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="panel" src="./painel-v7.html?v=20260910-v9-code" title="Painel VSN Imóveis"></iframe><script>
const frame=document.getElementById('panel');
function findForm(win){try{const doc=win.document;const f=doc.getElementById('propertyForm');if(f)return{win,doc,form:f};for(const fr of doc.querySelectorAll('iframe')){try{const r=findForm(fr.contentWindow);if(r)return r}catch(e){}}}catch(e){}return null}
async function nextCode(ctx){try{const f=ctx.form,code=f.elements.namedItem('code');if(!code||String(code.value||'').trim())return;let editing='';try{editing=String(ctx.win.editId||'').trim()}catch(e){}if(editing)return;const r=await fetch('https://jpdfynaioepcmgqlqlht.supabase.co/rest/v1/properties?select=code&code=not.is.null&order=code.desc&limit=1',{headers:{apikey:'sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',Authorization:'Bearer sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03'}});if(!r.ok)return;const rows=await r.json();let n=0;if(Array.isArray(rows)&&rows[0]?.code){const m=String(rows[0].code).match(/^vsn(\d+)$/i);if(m)n=parseInt(m[1],10)||0}code.value='vsn'+String(n+1).padStart(5,'0');code.readOnly=true;code.title='Código gerado automaticamente a partir do banco de dados';code.style.background='#f3f5f7'}catch(e){console.warn('Código VSN:',e)}}
function setup(){const ctx=findForm(frame.contentWindow);if(!ctx)return;const{win,doc,form}=ctx;if(form.dataset.v9Installed==='1')return;const addFields=()=>{if(doc.getElementById('structuralCondoFields'))return;const box=doc.createElement('div');box.id='structuralCondoFields';box.style.cssText='margin-top:18px;padding:18px;border:1px solid #dfe4ea;border-radius:12px;background:#fff';box.innerHTML='<div style="font-weight:700;font-size:15px;margin-bottom:12px">🏢 Dados do condomínio</div><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px"><div><label>Construtora</label><input name="condominium_builder" type="text" placeholder="Ex.: Campanário"></div><div><label>Ano de entrega</label><input name="condominium_delivery_year" type="number" min="1800" max="2100" placeholder="Ex.: 1992"></div><div><label>Unidades</label><input name="condominium_units" type="number" min="1" placeholder="Ex.: 34"></div><div><label>Terreno (m²)</label><input name="condominium_land_area" type="number" min="0" step="0.01" placeholder="Ex.: 2456"></div></div>';const sections=[...form.querySelectorAll('.section')];const target=sections.find(s=>/características do condomínio|condomínio/i.test(s.querySelector('h2')?.textContent||''))||sections[sections.length-1];if(target)target.appendChild(box);else form.appendChild(box)};
const oldFetch=win.fetch.bind(win);if(!win.__v9Fetch){win.__v9Fetch=true;win.fetch=async function(input,init){let url=typeof input==='string'?input:(input&&input.url)||'';if(url.includes('/rest/v1/properties')&&init?.body&&typeof init.body==='string'){try{const body=JSON.parse(init.body);for(const n of ['condominium_builder','condominium_delivery_year','condominium_units','condominium_land_area']){const e=form.elements.namedItem(n);if(e)body[n]=String(e.value||'').trim()?(n==='condominium_builder'?e.value.trim():Number(e.value)):null}init={...init,body:JSON.stringify(body)}}catch(e){}}return oldFetch(input,init)}}
addFields();nextCode(ctx);form.dataset.v9Installed='1';new MutationObserver(()=>{addFields();nextCode(ctx)}).observe(doc.body,{childList:true,subtree:true})}
frame.addEventListener('load',()=>{setTimeout(setup,100);setTimeout(setup,700);setTimeout(setup,1800)});</script></body></html>
