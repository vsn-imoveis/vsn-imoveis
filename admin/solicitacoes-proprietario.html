<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitações de proprietários | VSN</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#071f30;--gold:#d6b36b;--muted:#71808b;--line:#e3e9ed;--ink:#102b40;--surface:#fff;--bg:#f3f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}.top{background:linear-gradient(115deg,#061d2d,#12384e);color:white;padding:17px max(20px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 4px 18px #061d2d1a}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.9}.top a:hover{opacity:1}.top b{font:800 14px Montserrat,Manrope,sans-serif;letter-spacing:.2px}.wrap{max-width:1180px;margin:30px auto;padding:0 22px}.page-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}.page-intro h1{font:800 clamp(24px,3vw,32px) Montserrat,Manrope,sans-serif;letter-spacing:-.8px;margin:0 0 8px;color:#0a2639}.page-intro p{margin:0;max-width:700px;line-height:1.65}.status-line{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:18px 0;color:#465b6b;font-size:13px;font-weight:700}.status-line:before{content:'';width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px #d6b36b25}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 5px 22px #0b2b3d08;transition:box-shadow .18s,border-color .18s}.card:hover{border-color:#cbd7df;box-shadow:0 10px 30px #0b2b3d0d}.request-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.request-head h2{font:800 20px Montserrat,Manrope,sans-serif;line-height:1.35;margin:12px 0 8px;color:#0a2639}.request-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:12px;line-height:1.6}.request-meta span{overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px;line-height:1.6}.btn{border:0;border-radius:10px;padding:12px 17px;font:800 12px Manrope,Arial,sans-serif;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.gold{background:var(--gold);color:var(--navy);box-shadow:0 3px 8px #d6b36b30}.gray{background:#eef2f5;color:var(--navy)}.reject{background:#fff1ef;color:#a52f28;border:1px solid #f4d5d1}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:30px;background:#fff5dd;color:#805b15;font-size:11px;font-weight:800;white-space:nowrap}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:#c9972d}.changes-title{font-size:12px;font-weight:800;color:#536575;margin:20px 0 10px}.changes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}.change{background:#f7f9fb;border:1px solid #e7edf1;border-radius:11px;padding:13px 14px;font-size:13px;line-height:1.55;overflow-wrap:anywhere;min-width:0}.change b{display:block;font-size:10px;letter-spacing:.45px;text-transform:uppercase;color:#738391;margin-bottom:6px}.note-label{display:block;font-size:12px;font-weight:800;color:#465b6b;margin:20px 0 8px}.note-input{width:100%;min-height:78px;padding:13px 14px;border:1px solid #dbe3e8;border-radius:11px;background:#fbfcfd;font:13px Manrope,Arial,sans-serif;resize:vertical;outline:none}.note-input:focus{border-color:#9eb7c7;box-shadow:0 0 0 3px #1c526d12;background:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #edf1f3}.empty{padding:28px;background:#fff;border:1px dashed #d9c28c;border-radius:15px;color:#586977;line-height:1.7;text-align:center}.empty:before{content:'✓';display:grid;place-items:center;width:42px;height:42px;border-radius:50%;margin:0 auto 12px;background:#edf7ef;color:#34774a;font-size:21px;font-weight:800}@media(max-width:720px){.top{padding:15px 16px;align-items:flex-start}.top b{max-width:48%;text-align:right;line-height:1.4}.wrap{padding:0 13px;margin:22px auto}.page-intro{display:block;margin-bottom:16px}.page-intro h1{font-size:24px}.card{padding:17px;border-radius:14px}.request-head{display:block}.request-head h2{font-size:18px}.changes{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}.status-line{padding:12px}.request-meta{gap:6px 12px}}</style></head><body><header class="top"><a href="painel-login.html">← Voltar ao painel VSN</a><b>Solicitações de proprietários</b></header><main class="wrap"><section class="page-intro"><div><h1>Solicitações de alterações</h1><p class="muted">Revise as mudanças enviadas pelos proprietários. O anúncio só será atualizado depois da aprovação.</p></div></section><div id="status" class="status-line">Verificando acesso...</div><div id="requests"></div></main><script>
const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={title:'Título do anúncio',transaction_type:'Finalidade',for_sale:'Disponível para venda',for_rent:'Disponível para locação',property_type:'Tipo do imóvel',price:'Valor de venda',rent_price:'Valor de locação',condo_fee:'Condomínio',iptu:'IPTU',area:'Área útil',bedrooms:'Dormitórios',suites:'Suítes',bathrooms:'Banheiros',parking:'Vagas',address:'Endereço',number:'Número',complement:'Complemento',neighborhood:'Bairro',city:'Cidade',state:'Estado',cep:'CEP',tower:'Torre',unit_number:'Unidade',condominium_name:'Condomínio',condominium_address:'Endereço do condomínio',condominium_number:'Número do condomínio',condominium_complement:'Complemento do condomínio',condominium_neighborhood:'Bairro do condomínio',condominium_city:'Cidade do condomínio',condominium_state:'Estado do condomínio',features:'Características do imóvel',condo_features:'Lazer do condomínio',description:'Descrição',photos:'Fotos',video_url:'Vídeo'};
const allowed=new Set(Object.keys(labels));
function sameValue(a,b){return JSON.stringify(a??null)===JSON.stringify(b??null)}
function fmt(k,v){if(v===null||v===undefined||v==='')return '—';if(['price','rent_price','condo_fee','iptu'].includes(k))return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});if(k==='area')return v+' m²';if(['for_sale','for_rent'].includes(k))return v?'Sim':'Não';if(k==='photos')return Array.isArray(v)?v.length+' foto(s)':String(v);if(Array.isArray(v))return v.join(', ')||'Nenhum';return String(v)}
async function boot(){
 const {data:{session}}=await S.auth.getSession();if(!session){$('status').innerHTML='Faça login no painel administrativo para acessar as solicitações. <a href="painel-login.html">Entrar</a>';return}
 
 const {data:perm,error:permError}=await S.rpc('has_permission',{requested_permission:'properties.edit'});
 if(permError||perm!==true){$('status').textContent='Acesso restrito: seu usuário não tem permissão para revisar alterações de imóveis.';return}
 $('status').textContent='Carregando solicitações...';await load();
}
async function load(){
 const {data,error}=await S.from('property_owner_edit_requests').select('id,property_id,owner_id,changes,status,owner_message,admin_note,created_at,properties(*)').eq('status','pending').order('created_at',{ascending:true});
 if(error){$('status').textContent='Erro ao carregar: '+error.message;return}
 $('status').textContent=(data?.length||0)+' solicitação(ões) aguardando análise.';
 if(!data?.length){$('requests').innerHTML='<div class="empty">Nenhuma solicitação pendente no momento.</div>';return}
 $('requests').innerHTML=data.map(r=>{
  const p=r.properties||{},changes=r.changes||{};
  const entries=Object.entries(changes).filter(([k,v])=>allowed.has(k)&&!sameValue(p[k],v));
  return '<article class="card" id="req_'+r.id+'"><div class="request-head"><div><span class="badge">Aguardando aprovação</span><h2>'+esc(p.title||'Imóvel')+'</h2><div class="request-meta"><span><b>Código:</b> '+esc(p.code||'—')+'</span><span>'+esc([p.address,p.neighborhood,p.city].filter(Boolean).join(', '))+'</span><span>Enviada em '+new Date(r.created_at).toLocaleString('pt-BR')+'</span></div></div></div><div class="changes-title">Campos realmente alterados · '+entries.length+' campo(s)</div><div class="changes">'+entries.map(([k,v])=>'<div class="change"><b>'+esc(labels[k])+'</b><div style="margin:8px 0 4px;color:#7b8790;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px">Como está hoje</div><div style="color:#5d6c77;overflow-wrap:anywhere">'+esc(fmt(k,p[k]))+'</div><div style="margin:11px 0 4px;color:#28734b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px">Como ficará após aprovação</div><div style="color:#174b32;font-weight:800;overflow-wrap:anywhere">'+esc(fmt(k,v))+'</div></div>').join('')+'</div><label class="note-label" for="note_'+r.id+'">Observação para o proprietário <span style="font-weight:500;color:var(--muted)">(opcional)</span></label><textarea class="note-input" id="note_'+r.id+'" rows="3" placeholder="Escreva uma orientação ou o motivo de uma eventual recusa..."></textarea><div class="actions"><button class="btn gold" onclick="approveRequest(\''+r.id+'\')">Aprovar e aplicar alterações</button><button class="btn reject" onclick="rejectRequest(\''+r.id+'\')">Recusar solicitação</button></div></article>';
 }).join('');
}
async function approveRequest(id){
 const card=$('req_'+id);if(!card)return;
 if(!confirm('Aprovar esta solicitação e aplicar as alterações ao imóvel?'))return;
 const {data:req,error}=await S.from('property_owner_edit_requests').select('*').eq('id',id).eq('status','pending').single();if(error){alert('Não foi possível carregar a solicitação: '+error.message);return}
 const changes=req.changes||{},row={};for(const [k,v] of Object.entries(changes)){if(allowed.has(k))row[k]=v}
 if(!Object.keys(row).length){alert('A solicitação não contém alterações reconhecidas.');return}
 const upd=await S.from('properties').update(row).eq('id',req.property_id).eq('owner_id',req.owner_id);
 if(upd.error){alert('Não foi possível aplicar as alterações: '+upd.error.message);return}
 const {data:{user}}=await S.auth.getUser();
 const note=$('note_'+id)?.value.trim()||null;
 const done=await S.from('property_owner_edit_requests').update({status:'approved',admin_note:note,reviewed_by:user.id,reviewed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id).eq('status','pending');
 if(done.error){alert('As alterações foram aplicadas, mas não foi possível atualizar o status da solicitação: '+done.error.message);return}
 alert('Solicitação aprovada e alterações aplicadas.');await load();
}
async function rejectRequest(id){
 const note=$('note_'+id)?.value.trim()||prompt('Informe o motivo da recusa (opcional):')||null;
 if(!confirm('Recusar esta solicitação?'))return;
 const {data:{user}}=await S.auth.getUser();
 const r=await S.from('property_owner_edit_requests').update({status:'rejected',admin_note:note,reviewed_by:user.id,reviewed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id).eq('status','pending');
 if(r.error){alert('Não foi possível recusar: '+r.error.message);return}
 await load();
}
boot();
</script></body></html>
