<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSN Imóveis — Perfil do site</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#061d2d;--gold:#d3aa62;--line:#e1e6e9;--muted:#6c7881;--bg:#f6f7f8;--text:#0b2940}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding-left:240px}.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--navy);padding:0 8px}.brand{height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--gold);border-bottom:1px solid #23394a}.brand b{font:700 31px Georgia}.brand small{font-size:7px;letter-spacing:4px;color:#fff;margin-top:5px}.nav{padding-top:14px}.nav a{display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:7px;color:#d4dde4;text-decoration:none;font-size:12px;font-weight:700}.nav a:hover,.nav a.active{background:var(--gold);color:var(--navy)}main{max-width:1180px;margin:auto;padding:36px 30px}h1{font-size:28px;margin:0}p{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.full{grid-column:1/-1}input,textarea{width:100%;padding:11px 12px;border:1px solid #d6dde1;border-radius:9px;font-size:13px}textarea{min-height:130px}.photo{display:flex;gap:15px;align-items:start}.preview{width:150px;height:188px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;display:none}.actions{text-align:right;margin-top:22px}button{border:0;border-radius:22px;background:var(--gold);color:var(--navy);padding:12px 22px;font-weight:800;cursor:pointer}#msg{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;display:none}@media(max-width:760px){body{padding-left:70px}.side{width:70px}.brand{height:68px}.brand b{font-size:23px}.brand small{font-size:5px}.nav a span{display:none}.grid{grid-template-columns:1fr}main{padding:24px 15px}}
</style></head><body><aside class="side"><a class="brand" href="painel-cadastro.html"><b>VSN</b><small>IMÓVEIS</small></a><nav class="nav"><a href="painel-cadastro.html"><span>⌂</span><span>Painel de Imóveis</span></a><a href="proprietario.html"><span>♙</span><span>Usuários</span></a><a class="active" href="perfil-site.html"><span>⚙</span><span>Configurações</span></a></nav></aside><main><h1>Perfil do site</h1><p>Configure as informações institucionais e os canais de contato exibidos no site.</p><section class="card"><div class="grid">
<div><label>Empresa / Imobiliária</label><input id="siteName"></div><div><label>CRECI</label><input id="siteCreci"></div><div><label>Telefone</label><input id="sitePhone"></div><div><label>WhatsApp</label><input id="siteWhatsapp"></div><div><label>E-mail</label><input id="siteEmail" type="email"></div><div><label>Instagram</label><input id="siteInstagram"></div><div><label>Facebook</label><input id="siteFacebook"></div><div><label>YouTube</label><input id="siteYoutube"></div><div class="full"><label>Endereço</label><input id="siteAddress"></div><div class="full"><label>Logo (URL)</label><input id="siteLogoUrl"></div><div class="full"><label>Foto do site</label><p>Foto da seção “Quem está por trás”. Ideal 800 × 1000 px, JPG/PNG/WebP, até 8 MB.</p><div class="photo"><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="preview"><img id="photoPreview"></div></div></div><div class="full"><label>Sobre a imobiliária</label><textarea id="siteAbout"></textarea></div></div><div class="actions"><button id="save">Salvar perfil do site</button></div></section></main><div id="msg"></div>
<script>
const U='https://jpdfynaioepcmgqlqlht.supabase.co',K='sb_publishable_bDiXCzTT1gXO_xbVGhnAXg_Muy4lx03',S=supabase.createClient(U,K);
const map={siteName:'site_name',siteLogoUrl:'logo_url',sitePhone:'phone',siteWhatsapp:'whatsapp',siteEmail:'email',siteCreci:'creci',siteInstagram:'instagram',siteFacebook:'facebook',siteYoutube:'youtube',siteAddress:'address',siteAbout:'about'};
const msg=(s)=>{const e=document.getElementById('msg');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
async function boot(){const {data:{session}}=await S.auth.getSession();if(!session){location.href='painel-login.html';return}const {data:p}=await S.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p?.role!=='admin'){location.href='painel-cadastro.html';return}const {data,error}=await S.from('site_settings').select('*').eq('id',true).maybeSingle();if(error){msg(error.message);return}Object.entries(map).forEach(([id,col])=>document.getElementById(id).value=data?.[col]||'');if(data?.site_photo_url){photoPreview.src=data.site_photo_url;photoPreview.style.display='block'}}
photoFile.onchange=()=>{const f=photoFile.files?.[0];if(!f)return;if(f.size>8*1024*1024){msg('A foto deve ter no máximo 8 MB');photoFile.value='';return}photoPreview.src=URL.createObjectURL(f);photoPreview.style.display='block'};
save.onclick=async()=>{save.disabled=true;save.textContent='Salvando...';try{const cur=await S.from('site_settings').select('site_photo_url').eq('id',true).maybeSingle();if(cur.error)throw cur.error;let photo=cur.data?.site_photo_url||null;const f=photoFile.files?.[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site/'+Date.now()+'.'+ext,upl=await S.storage.from('site-assets').upload(path,f,{contentType:f.type,upsert:true});if(upl.error)throw upl.error;photo=S.storage.from('site-assets').getPublicUrl(path).data.publicUrl}const row={id:true,site_name:siteName.value.trim()||'VSN Imóveis',logo_url:siteLogoUrl.value.trim()||null,site_photo_url:photo,phone:sitePhone.value.trim()||null,whatsapp:siteWhatsapp.value.trim()||null,email:siteEmail.value.trim()||null,creci:siteCreci.value.trim()||null,instagram:siteInstagram.value.trim()||null,facebook:siteFacebook.value.trim()||null,youtube:siteYoutube.value.trim()||null,address:siteAddress.value.trim()||null,about:siteAbout.value.trim()||null,updated_at:new Date().toISOString()};const r=await S.from('site_settings').update(row).eq('id',true).select('*').maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('Configuração não encontrada');msg('Perfil do site atualizado com sucesso')}catch(e){msg('Erro: '+e.message)}finally{save.disabled=false;save.textContent='Salvar perfil do site'}};
boot();
</script></body></html>
